  `archetipo wiki affected` è stato eseguito sui percorsi attesi: `Spikes/04-crash-recovery/Package.swift`, `RESULT.md`, `PROCEDURE.md`, `README.md`, `Sources/CrashKit/BatchExecutor.swift`, `Tests/CrashKitTests/ResultTraceabilityTests.swift` e `fixtures/batch.json`. Ha restituito **un solo candidato**, `architecture/context-map`, perché è l'unica pagina che cita `.` fra le sorgenti.

  La domanda applicata a ciascuna pagina non è «il file che ha prodotto la corrispondenza è importante», ma **«questa spec fa qualcosa che questa pagina afferma?»**. Tre pagine non individuate da `affected` fanno affermazioni su *insiemi* di file e di cancelli, e queste affermazioni diventano false. Una riga di motivazione per pagina:

  - **`architecture/context-map`** (candidato di `affected`) — tre affermazioni decadono:
