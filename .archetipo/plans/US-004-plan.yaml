  - id: TASK-08
    title: Matrice in processi figli con ripetizioni, oracoli indipendenti dall'istantanea e JSON di misura tracciabile
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      `crashbench run-matrix` esegue in processi figli ogni cella della matrice, con ripetizioni. Le celle sono 98 di base, cioè 61 punti con le strategie previste, più 48 combinazioni di perturbazione. Il comando verifica che ogni arresto sia avvenuto davvero, confronta le affermazioni della macchina con le istantanee del banco e scrive un JSON di misura con `measurementId`.

      ## Read
      - `Sources/crashbench/main.swift`: i sottocomandi `run`, `perturb`, `unperturb`, `recover`, `decide`, e il formato fisso dell'output di `recover` (TASK-06, passo 3).
      - `Sources/CrashKit/CrashPoints.swift`, `Snapshot.swift`, `HostFingerprint.swift` e `Fixtures.swift` (digest di `MANIFEST.json`).
      - Questo piano, § *Matrice e oracoli indipendenti* e § *Perturbazioni*.

      ## Change
      - File nuovi: `Sources/CrashKit/Matrix.swift`, `Sources/CrashKit/MeasurementResult.swift`.
      - `Sources/crashbench/main.swift`: aggiungi il sottocomando `run-matrix`.
      - **Non-obiettivi:**
        - la matrice non esegue `run` né `recover` nel proprio processo: lo fanno sempre i figli;
        - non si modificano la macchina né il classificatore.

      ## Steps
      1. **Celle.**
         - Ogni punto `X*` e `S*` dà due celle, `resume` e `compensate`.
         - Ogni punto `K*` dà una cella, `compensate`, perché la direzione viene dal log.
         - `D01` dà una cella `resume`, `D02` una cella `compensate`.
         - Le perturbazioni danno una cella per ogni combinazione di:
           - classe: le otto di `ErrorClass.allCases`;
           - punto: `X03-prepare`, `S06-b` e `S10-c`;
           - strategia: `resume` e `compensate`.
         - Con la fixture fanno 37 × 2 + 22 + 2 = 98 celle di base, più 48 celle di perturbazione.
         - L'ID di cella è `<punto>/<strategia>[/<classe>]`.
      2. **Esecuzione di una ripetizione.** Usa il binario stesso, `Bundle.main.executableURL`, con la `--data-dir` della matrice.
         1. In-process: `resetBatchFolder`, poi istantanea `pre`.
         2. Figlio: `run --crash-at <punto>`.
            - Pretendi `terminationReason == .uncaughtSignal`, `terminationStatus == 9` e `ARRESTO <punto>` su stdout.
            - Altrimenti la ripetizione è `PUNTO_NON_RAGGIUNTO`, e la matrice continua ma esce con 3 alla fine.
         3. In-process: istantanea `crash`. Le **separazioni all'arresto** si calcolano qui, dalle posizioni nell'istantanea, applicando le regole di posizione del piano. È l'oracolo indipendente dal riconoscitore.
         4. Solo per le celle di perturbazione, figlio: `perturb <classe> --strategy <s>`. Con `NON-APPLICABILE`, la cella è `applicable: false`, con il motivo, e si passa al punto 8.
         5. Figlio: `recover --strategy <s>`.
            - Per `D01` e `D02`, il primo `recover` deve morire per segnale 9 al secondo punto; poi segue un secondo `recover`.
            - Analizza le righe `ESITO`, `PASSO`, `COPPIA`, `SEPARAZIONI-ALL-AVVIO`, `SEPARAZIONI-RESIDUE` e `TRACCIA`.
         6. In-process: istantanea `post`. Se il volume è stato espulso dalla perturbazione, prima `attach`, poi l'istantanea.
         7. Se l'esito è `bloccato`, esegui due rami:
            - **ramo `abandon`**, su questa stessa ripetizione: figlio `decide abandon`, e registra l'esito;
            - **ramo `retry`**, su una ripetizione nuova: ripeti i passi da 1 a 5, poi figlio `unperturb`, poi figlio `decide retry`, e registra l'esito.
         8. Figlio: `unperturb`. È sempre eseguito, ed è idempotente. Se il volume non è montato, esegui `attach`.
      3. **Oracoli calcolati dalla matrice**, mai dalla macchina:
         - **`compensation`.** Vale per ogni cella in cui la direzione effettiva è `compensate`, cioè con la riga `RECUPERO … direzione=compensate`.
           - `attempted` è `true`.
           - `deviations` è `Snapshot.diff(pre, post)`, diviso in `fileDeviations` e `directoryMtimeDeviations`.
           - `matchesPre` è `true` se e solo se entrambi gli elenchi sono vuoti.
         - **`resumeMatchesExpected`.** Vale per gli esiti `completato`: è il confronto di percorsi e digest fra lo stato atteso del lotto completato, derivato dal piano e da `pre`, e `post`.
         - **`separationDetected`.** Confronta le separazioni all'arresto del punto 3 con `SEPARAZIONI-ALL-AVVIO`:
           - `rilevata` se coincidono;
           - `non-rilevata` se ne manca una;
           - `falsa-segnalazione` se ne è riferita una che l'istantanea non mostra;
           - `nessuna` se non ce ne sono.
         - **`recognitionError`.** Vale `true` se una riga `COPPIA` dichiara una posizione diversa da quella dell'istantanea `post`. Una cella con `recognitionError` è marcata `RICONOSCIMENTO_ERRATO`. È distinta da `NON_SUPPORTABILE`: lì la macchina ammette di non sapere, qui afferma il falso.
      4. **Ripetizioni e profili.**
         - `--profile full` ha 5 ripetizioni per default, `--profile smoke` 1.
         - `--repetitions N` sovrascrive il default.
         - Il profilo `smoke` contiene:
           - i punti `X01-plan`, `S03-b`, `S07-m`, `S10-c`, `K05-a` e `D01`, con le loro strategie;
           - le celle `S06-b/resume/L-locked` e `S06-b/resume/G-volume-missing`.
         - **Conteggio degli esiti.** Per ogni cella, `outcomes` conta gli esiti per tipo, per esempio `{"completato": 5}`.
         - **Ripetizioni discordanti.** Le ripetizioni discordanti restano tutte nei conteggi, e la cella ha `nonDeterministic: true`.
         - **Riepilogo delle celle.** Gli oracoli del punto 3 si riportano dalla prima ripetizione. Ogni ripetizione che diverge dalla prima per un oracolo marca la cella `nonDeterministic`, con i valori divergenti in `repetitionNotes`.
      5. **Schema `MeasurementResult`.** È `Codable`, scritto con `.sortedKeys` e `.prettyPrinted`.
         - **Campi di testata:**
           - `measurementId`, nella forma `crash-matrix-<UTC yyyyMMdd'T'HHmmss'Z'>-<8 esadecimali>`;
           - `spike: "04-crash-recovery"`;
           - `host`, cioè `HostFingerprint`;
           - `volume`, con formato, dimensione e `fs: "APFS"`;
           - `fixtureManifestSha256`;
           - `profile` e `repetitions`;
           - `startedAt` e `durationSeconds`;
           - `points`, l'elenco completo di `list-points`.
         - **`cells[]`.** Ogni cella ha:
           - `cellId`, `point`, `phase`, `strategy`, e le opzionali `perturbation` e `target`;
           - `applicable` e `notApplicableReason`;
           - `outcomes` e `reasons`, i motivi di `NON_SUPPORTABILE` con i conteggi;
           - `trace`, `steps` e `pairs`, dalla prima ripetizione: `steps` è stepId → stato finale, `pairs` è opId → posizioni di immagine e sidecar dall'istantanea `post`;
           - `separationsAtCrash`, `separationsReported` e `separationDetected`;
           - `compensation`, con `attempted`, `matchesPre`, `fileDeviations` e `directoryMtimeDeviations`;
           - `resumeMatchesExpected`, `recognitionError`;
           - `followUp`, con `retry` e `abandon`;
           - `errorClass`, `errorScope`, `errnoObserved` e `cocoaObserved`;
           - `nonDeterministic` e `repetitionNotes`;
           - `pointReached`.
      6. **Scrittura e riepilogo.**
         - Il JSON va in `runs/<measurementId>.json`; `--out <percorso>` lo sostituisce.
         - Su stderr una riga di avanzamento per cella.
         - Su stdout un riepilogo:
           - numero di celle;
           - istogramma degli esiti;
           - numero di `NON_SUPPORTABILE`, `RICONOSCIMENTO_ERRATO` e `PUNTO_NON_RAGGIUNTO`;
           - percorso del JSON.
         - **Stato di uscita:**
           - 0 normalmente;
           - 3 se c'è almeno un `PUNTO_NON_RAGGIUNTO`, che è un difetto del banco.
         - `NON_SUPPORTABILE` e `RICONOSCIMENTO_ERRATO` **non** cambiano lo stato di uscita: sono misure.
      7. Prima di iniziare, `run-matrix` esegue `setup` se il volume non è montato. Alla fine lo lascia montato, così l'esecuzione resta ispezionabile.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui:

        ```sh
        Spikes/04-crash-recovery/.build/debug/crashbench run-matrix --profile smoke --out Spikes/04-crash-recovery/runs/smoke-check.json; echo "stato $?"
        ```

        Attesa: `stato 0` e un riepilogo senza `PUNTO_NON_RAGGIUNTO`.
      - Esegui:

        ```sh
        python3 -c "import json;d=json.load(open('Spikes/04-crash-recovery/runs/smoke-check.json'));print(len(d['points']),len(d['cells']),all(sum(c['outcomes'].values())==d['repetitions'] for c in d['cells'] if c['applicable']))"
        ```

        Attesa: `61 <numero celle smoke> True`. Il conteggio delle celle smoke è quello del profilo: 6 punti con le loro strategie, più 2 perturbazioni.
      - Esegui `Spikes/04-crash-recovery/.build/debug/crashbench teardown`, poi `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0`.
      - Esegui, con timeout 900 s, `swift test --package-path Spikes/04-crash-recovery`. Attesa: la suite resta verde.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-2 — ogni cella registra gli esiti con il numero di ripetizioni, e lo stato di immagine e sidecar dopo il recupero preso dall'istantanea.
      - [ ] AC-3 — per ogni cella con compensazione tentata, la coincidenza con lo stato di partenza è calcolata dalla matrice, con l'elenco degli scostamenti.
      - [ ] AC-4 — le celle di perturbazione riportano classe, ambito, errno o errore Cocoa osservato, e gli esiti di `retry` e `abandon` dopo un `bloccato`.
      - [ ] AC-5 — la separazione all'arresto è osservata dall'istantanea e confrontata con quanto riferisce il recupero.
      - [ ] AC-7 — `NON_SUPPORTABILE` e `RICONOSCIMENTO_ERRATO` sono registrati come distinti, ciascuno con la propria traccia.
      - [ ] AC-1 — nessuna cella è dichiarata senza che il figlio sia morto per segnale 9 nel punto chiesto.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Integrazione sul binario reale - arresto per SIGKILL osservato dal padre, recupero in un nuovo processo e matrice smoke conforme
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Test di integrazione sul binario `crashbench` reale dimostrano tre cose:
      - l'arresto avviene davvero per `SIGKILL` nel punto chiesto, e lascia il log e il disco nello stato che quel punto dichiara;
      - un recupero in un nuovo processo stampa l'esito e le posizioni;
      - la matrice `smoke` produce un JSON conforme allo schema.

      ## Read
      - `Spikes/01-scale-memory/Tests/BenchKitTests/BenchIntegrationTests.swift`: come Spike 01 lancia `.build/debug/bench` con `Process` e ne raccoglie l'output.
      - `Sources/crashbench/main.swift`, e il formato fisso dell'output di `recover`.
      - `Sources/CrashKit/MeasurementResult.swift`.

      ## Change
      - File nuovo: `Tests/CrashKitTests/CrashbenchIntegrationTests.swift`.
      - `Tests/CrashKitTests/TestSupport.swift`: aggiungi l'helper `runCrashbench`.
      - **Non-obiettivi:**
        - nessuna modifica ai sorgenti;
        - se un test rivela un difetto, il difetto si corregge nel task che possiede il file, e qui si riporta come regressione.

      ## Steps
      1. Aggiungi `runCrashbench(_ args: [String], dataDir: URL) -> (reason: Process.TerminationReason, status: Int32, stdout: String, stderr: String)`.
         - Lancia `CrashPaths.packageRoot/.build/debug/crashbench`, aggiungendo `--data-dir`.
         - Legge stdout e stderr fino alla chiusura dei pipe, poi chiama `waitUntilExit`.
      2. Imposta la suite con `@Suite(.serialized, .timeLimit(.minutes(10)))`.
         - Directory dati: `CrashPaths.defaultDataDirectory/tests/integration-<UUID>`.
         - All'inizio `setup`; alla fine `teardown`, garantito con `defer`, e rimozione della directory.
      3. **Arresti reali.** Per ogni punto `X01-plan`, `S03-b`, `S07-m`, `S09-b` e `K05-a`, esegui `run --crash-at <punto>` e verifica `reason == .uncaughtSignal`, `status == 9` e `ARRESTO <punto>` su stdout. Poi verifica lo stato lasciato:

         | Punto | Ultimo record del log | Stato del disco |
         |---|---|---|
         | `X01-plan` | `plan` | nessun file mosso |
         | `S03-b` | `step-intent` di `S03` | `lotto/selezione/IMG_0002.jpg` esiste |
         | `S07-m` | `step-intent` di `S07` | `.IMG_0004.jpg.partial-*` presente in `consegna/`, e `consegna/IMG_0004.jpg` assente |
         | `S09-b` | `step-intent` di `S09` | `lotto/IMG_0005.jpg` assente, e una voce con il suo digest in `.Trashes/<uid>` |
         | `K05-a` | `step-intent` con `direction: compensate` per `S05` | — |

         Per `K05-a` verifica anche che nel log ci sia `outcome completato` seguito da `undo-requested`.
      4. **Record troncato.** `run --crash-at X00-plan-torn` lascia un log il cui ultimo frammento non termina con `\n`. Poi `recover --strategy resume` esce con 0 e stampa `RECORD-TRONCATO si` ed `ESITO NON_SUPPORTABILE motivo=nessun-esito-applicabile`.
      5. **Ripresa.** `run --crash-at S03-b`, poi `recover --strategy resume` in un nuovo processo: esce con 0, stampa `ESITO completato` e cinque righe `COPPIA`, nessuna `SEPARATA`.
      6. **Compensazione e separazione.** `run --crash-at S03-c`, poi `recover --strategy compensate`: stampa `SEPARAZIONI-ALL-AVVIO OP2`, `ESITO compensato` e `SEPARAZIONI-RESIDUE nessuna`.
      7. **Doppio arresto.** Con `run --crash-at D01`, il primo `recover --strategy resume` termina per segnale 9 con `ARRESTO S08-b`. Il secondo `recover --strategy resume` stampa `ESITO completato`.
      8. **Matrice smoke.** `run-matrix --profile smoke --out <dataDir>/smoke.json` esce con 0. Il JSON:
         - si decodifica con `MeasurementResult`;
         - ha un `measurementId` uguale al nome del file senza estensione;
         - ha `points.count == 61`;
         - per ogni cella con `applicable`, ha la somma di `outcomes` uguale a `repetitions` e `pointReached == true`;
         - ha almeno una cella con `compensation.attempted == true` e almeno una con `separationsAtCrash` non vuoto.

      ## Verify
      - Esegui, con timeout 900 s, `swift test --package-path Spikes/04-crash-recovery --filter CrashbenchIntegrationTests`. Attesa: tutti verdi.
      - Esegui `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0` dopo la suite.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-1 — l'interruzione per `SIGKILL` al punto scelto è osservata da un processo esterno, e lo stato lasciato su log e disco corrisponde alla descrizione del punto: piano, intento, temporaneo di copia, Cestino, compensazione.
      - [ ] AC-2 — un recupero in un nuovo processo stampa l'esito e la posizione di immagine e sidecar di ogni coppia.
      - [ ] AC-5 — la separazione di `OP2` a `S03-c` è riferita dal recupero sul binario reale, e non resta dopo la compensazione.
      - [ ] AC-7 — il record troncato del piano produce `NON_SUPPORTABILE` con motivo `nessun-esito-applicabile`, e non `bloccato`.

      ## Blockers
      None.
