  - id: TASK-06
    title: Recupero in un nuovo processo - riconoscimento dal disco, ripresa o compensazione, separazioni immagine/sidecar e decisione dell'utente
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      `crashbench recover --strategy resume|compensate` riconosce dal disco lo stato raggiunto da ogni file del lotto. Poi riprende o compensa in modo idempotente, riferisce le separazioni fra immagine e sidecar e chiude con uno dei cinque esiti, oppure con `NON_SUPPORTABILE` e la sua traccia. `crashbench decide retry|abandon` registra la decisione dell'utente su un lotto bloccato.

      ## Read
      - `Sources/CrashKit/IntentLog.swift`: `read`, `repairTornTail`.
      - `Sources/CrashKit/Steps.swift`: `observe`, `execute`, `compensate`, `compensatePrepare`.
      - `Sources/CrashKit/ErrorClassifier.swift`, `OutcomeClassifier.swift`, `CrashPoints.swift` (`composite`) e `BatchExecutor.swift`.
      - Questo piano, § *Recupero* e § *Classificatore degli esiti*.

      ## Change
      - File nuovi: `Sources/CrashKit/Recognizer.swift`, `Sources/CrashKit/Recovery.swift`.
      - `Sources/crashbench/main.swift`: aggiungi i sottocomandi `recover`, `decide` e `status`.
      - **Non-obiettivi:**
        - non si modificano le regole di `OutcomeClassifier`;
        - nessun test in questo task: gli oracoli sono TASK-07 e TASK-09;
        - il recupero non legge mai `pre-snapshot.json`, che è l'oracolo del banco e non conoscenza della macchina.

      ## Steps
      1. Implementa `Recognizer.recognize(log:, volume:, requestedStrategy:) -> RecognizedState`.
         1. **Log.** Esegue `log.read()`. Se c'è un `tornTail`, chiama `repairTornTail()` e annota `recordTroncato = true` con il percorso dell'evidenza.
         2. **Piano.** Se non c'è un record `plan` completo, lo stato è `noPlan`, e il riconoscimento finisce qui.
         3. **Volume.** Se `batchRoot` manca, o il suo UUID è diverso da `plan.volumeUUID`, ogni passo è `sospeso(G-volume-missing)` e non si osserva altro.
         4. **Passi.** Per ogni passo, `observe`:
            - `.done` vale `fatto`, `.notDone` vale `non-fatto`, `.partial` vale `non-fatto` (con il temporaneo annotato);
            - `.anomaly` va all'`ErrorClassifier`. Una classe locale vale `saltato(classe)`, una sistemica `sospeso(classe)`, e `nonClassificato` vale `non-riconoscibile(traccia)`. La traccia elenca ogni posizione ispezionata con il digest trovato o «assente».
         5. **Divergenze.** Se il log ha uno `step-done` per un passo osservato `non-fatto`, o viceversa, annota `divergenza <stepId> log=<…> disco=<…>`. **Vale il disco.**
         6. **Posizioni.** Per ogni operazione, posizione dell'immagine e del sidecar: `orig`, `dest`, `cest`, `ass` oppure `amb`. Per `copy` vale `dest` se la copia esiste. La coppia è `SEPARATA` se le due posizioni sono diverse.
         7. **Direzione.**
            - Se il log contiene `undo-requested`, oppure uno `step-intent` con `direction: compensate`, la direzione è `compensate`, qualunque sia `--strategy`: una compensazione avviata non si rovescia mai in silenzio.
            - Se l'ultimo `outcome` del log è `interrotto-prima-di-agire`, la direzione è `nessuna` e non si agisce.
            - Altrimenti vale la strategia chiesta.
      2. Implementa `Recovery.run(strategy:, log:, volume:, injector:, decision: .none|.retry)`.
         1. Esegue `recognize`, e registra le separazioni **all'avvio**.
         2. Esegue `append(.recovery(strategy, direction, summary))`.
         3. Con `noPlan` o direzione `nessuna`, non fa nulla e passa all'esito.
         4. **In ripresa**, per ogni passo `non-fatto`, in ordine di piano:
            1. ripete il controllo delle precondizioni del solo passo;
            2. `append(.stepIntent(id, .forward))`, poi `hit("Sxx-a")`;
            3. `execute`, con `hit("Sxx-m")` per le copie;
            4. `hit("Sxx-b")`, poi `append(.stepDone)`, poi `hit("Sxx-c")`.

            Un errore **locale** diventa `append(.stepFailed)`, e la ripresa prosegue. Un errore **sistemico** diventa `append(.stepFailed)`, e la ripresa si sospende.
         5. **In compensazione**, per ogni passo `fatto`, in ordine inverso:
            1. `append(.stepIntent(id, .compensate))`, poi `hit("Kxx-a")`;
            2. `compensate`, poi `hit("Kxx-b")`, poi `append(.stepDone(id, .compensate))`.

            Poi `hit("K00-a")`, `compensatePrepare(created:)` (con le cartelle create lette dal record `prepare`) e `hit("K00-b")`. Gli errori seguono la stessa politica della ripresa.
         6. **Stati finali.** Ricalcola gli stati finali con `observe` e calcola l'esito con `OutcomeClassifier.classify`. In compensazione, il disco dice se un passo è stato riportato all'origine.
         7. **Registrazione.** `append(.outcome)`.
      3. Implementa la stampa su stdout. Il formato è **fisso**, perché TASK-08 e TASK-09 lo analizzano: una voce per riga, chiave in maiuscolo, valori separati da spazio.

         ```text
         RECUPERO strategia=<resume|compensate> direzione=<forward|compensate|nessuna>
         RECORD-TRONCATO <si|no>
         DIVERGENZA <stepId> log=<…> disco=<…>           (zero o più righe)
         PASSO <stepId> <stato all'avvio> -> <stato finale> [classe=<…> ambito=<…>]
         COPPIA <opId> immagine=<pos> sidecar=<pos> [SEPARATA]
         SEPARAZIONI-ALL-AVVIO <opId,opId|nessuna>
         SEPARAZIONI-RESIDUE <opId,opId|nessuna>
         ESITO <kind> [motivo=<reason>]
         TRACCIA <riga>                                   (zero o più righe)
         ```

         Lo stato di uscita è 0 per qualunque esito, compreso `NON_SUPPORTABILE`: l'esito è un dato, non un errore del banco. È diverso da 0 solo per errori del banco, come un log corrotto o un volume mai creato.
      4. Gestisci il secondo arresto di `D01` e `D02`. Se esiste `<data>/state/pending-second-crash.json`, `recover` lo consuma e lo rimuove **prima** di agire. Poi usa quel punto come bersaglio dell'iniettore e quella strategia. Il recupero successivo, senza il file, procede normalmente.
      5. Implementa `crashbench decide retry|abandon`.
         - Richiede che l'ultimo `outcome` del log sia `bloccato`; altrimenti stampa il motivo ed esce con 2.
         - **`retry`:** `append(.decision(retry))`, poi `Recovery.run` nella direzione del log, con la stessa stampa.
         - **`abandon`:** `append(.decision(abandon))`, nessuna azione sui file, poi `recognize` per riferire dove è rimasto ogni file. L'esito è `abbandonato` per la regola 3, salvo uno stato non riconoscibile, che resta `NON_SUPPORTABILE` per la regola 2.
      6. Implementa `crashbench status`: stampa le righe `PASSO`, `COPPIA` e `SEPARAZIONI-ALL-AVVIO` dello stato riconosciuto, senza agire e senza scrivere nel log, salvo la riparazione di un record troncato, che va dichiarata. Serve alla dimostrazione del revisore.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui:

        ```sh
        B=Spikes/04-crash-recovery/.build/debug/crashbench
        $B setup
        $B run --crash-at S03-b; $B recover --strategy resume
        $B run --crash-at S03-c; $B recover --strategy compensate
        $B run --crash-at S09-b; $B status
        $B teardown
        ```

        Attesa:
        - la prima coppia di comandi stampa `ESITO completato`;
        - la seconda stampa `SEPARAZIONI-ALL-AVVIO OP2` ed `ESITO compensato`;
        - `status` mostra `PASSO S09 fatto`, con l'immagine di OP5 trovata nel Cestino per digest.
      - Esegui `swift test --package-path Spikes/04-crash-recovery`, con timeout 900 s. Attesa: le suite già esistenti restano verdi.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-2 — un recupero, eseguito in un nuovo processo, stampa l'esito fra i cinque oppure `NON_SUPPORTABILE`, e la posizione di immagine e sidecar per ogni coppia.
      - [ ] AC-3 — la compensazione procede in ordine inverso, è registrata passo per passo, e il suo esito è ricavato dal disco.
      - [ ] AC-4 — un errore sistemico sospende il recupero (`bloccato`); un errore locale fa saltare il solo passo e il recupero prosegue.
      - [ ] AC-5 — le separazioni all'avvio e quelle residue dopo il recupero sono riferite per coppia.
      - [ ] AC-7 — uno stato non riconoscibile produce `NON_SUPPORTABILE` con la traccia delle posizioni ispezionate.

      ## Blockers
      None.
