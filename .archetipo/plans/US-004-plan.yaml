    Questa spec aggiunge un secondo pacchetto Swift e chiude ADR-007. Inoltre la pagina cita fra le sorgenti solo `Spikes/01-scale-memory`. → **update**.
  - **`engineering/code-map`** — dice «un solo pacchetto Swift: `Spikes/01-scale-memory/`», e la nota della voce di copertura `Spikes` dice «oggi il solo `Spikes/01-scale-memory/`». Sono affermazioni su un insieme di file, rese false dal nuovo pacchetto. La voce `coverage` resta `kind: boundary`, `path: Spikes`, `status: excluded`: cambia solo la nota. → **update**.
