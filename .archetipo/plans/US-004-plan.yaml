    body: |-
      ## Objective
      `ResultTraceabilityTests` fallisce se una sola riga di `RESULT.md` non trova la sua cella nel JSON versionato, o se una cella rilevante del JSON non ha la sua riga. In particolare fallisce se una cella `NON_SUPPORTABILE` compare fra i punti bloccati, o se l'esito su ADR-007 non ha esattamente un marcatore.

      ## Read
      - `Spikes/01-scale-memory/Tests/BenchKitTests/ResultTraceabilityTests.swift`: gli helper `section(_:)` e `tableRows(in:header:)`, da **copiare** e adattare, non importare.
      - `Spikes/04-crash-recovery/RESULT.md` e il JSON in `measurements/`.
      - `Sources/CrashKit/MeasurementResult.swift`, `CrashPoints.swift` ed `ErrorClassifier.swift`.

      ## Change
      - File nuovo: `Tests/CrashKitTests/ResultTraceabilityTests.swift`.
      - Se un controllo fallisce, la correzione va in `RESULT.md`, che deve dire ciò che il JSON dice, e **mai** nel JSON.
      - **Non-obiettivi:**
        - nessuna rigenerazione della misura per far tornare il documento;
        - nessuna tolleranza sui conteggi.

      ## Steps
      1. Nell'`init`, carica `RESULT.md` e l'**unico** `*.json` di `measurements/`. Se ce n'è più di uno, il test fallisce. Decodifica il JSON con `MeasurementResult`, e ricostruisci l'elenco dei punti con `CrashPoints.enumerate` sulla fixture.
      2. **Configurazione.** Verifica che:
         - il `measurementId` sia uguale al nome del file;
         - § *Configurazione* citi il `measurementId`, il modello e la build di macOS di `host`, e il `fixtureManifestSha256`;
         - nessuna cella abbia `pointReached == false`.
      3. **Punti.** Verifica che:
         - l'insieme degli ID nella prima colonna di § *Punti di interruzione* sia uguale a `points` del JSON e all'enumerazione ricostruita, cioè 61 punti, nello stesso ordine;
         - per ogni riga, «Esito ripresa» e «Esito compensazione» corrispondano esattamente agli `outcomes` delle celle `<punto>/resume` e `<punto>/compensate`, con tipi e conteggi; si scrive `—` dove la cella non esiste;
         - «Ripetizioni» sia uguale a `repetitions`;
         - le colonne di stato corrispondano a `pairs` delle due celle.
      4. **Compensazione.** Verifica che:
         - le righe di § *Compensazione* siano in corrispondenza biunivoca con le celle in cui `compensation.attempted` vale `true`;
         - «Coincide» valga `sì` se e solo se `matchesPre`;
         - ogni elemento di `fileDeviations` e `directoryMtimeDeviations` compaia come `percorso:campo` nella colonna giusta, e nessuno scostamento non presente nel JSON compaia nella riga.
      5. **Classi.** Verifica che:
         - § *Classi di errore* abbia 8 righe, una per `ErrorClass.allCases`;
         - «Ambito adottato» sia uguale a `ErrorClass.scope`;
         - «Celle provate» elenchi esattamente le celle di quella classe con `applicable` vero.
      6. **Bloccati (AC-4).** Verifica che:
         - le righe di § *Punti bloccati in attesa dell'utente* siano in corrispondenza biunivoca con le celle che hanno almeno una ripetizione `bloccato`;
         - «Ambito» sia `locale` oppure `sistemico` e coincida con `errorScope`;
         - «Ragione» non sia vuota;
         - gli esiti dopo `retry` e `abandon` coincidano con `followUp`.
      7. **Separazioni (AC-5).** Verifica che:
         - le righe di § *Separazione di immagine e sidecar* siano in corrispondenza biunivoca con le celle con `separationsAtCrash` non vuoto;
         - «Rilevata dal recupero» coincida con `separationDetected`.
      8. **Non supportabili (AC-7), simmetria.** Verifica che:
         - le righe di § *Esiti non supportabili* siano in corrispondenza biunivoca con le celle che hanno almeno una ripetizione `NON_SUPPORTABILE` o `recognitionError`;
         - «Motivo» coincida con `reasons`;
         - **nessun** ID di quelle celle compaia in § *Punti bloccati in attesa dell'utente*, a meno che la stessa cella abbia anche ripetizioni `bloccato`; in quel caso la cella è necessariamente `nonDeterministic`, e il test lo verifica.
      9. **ADR-007 (AC-6).** Verifica che:
         - § *Esito su ADR-007* contenga esattamente una occorrenza fra `**confermato**` ed `**emendato**`;
         - se il marcatore è `**emendato**`, esista `### Testo di sostituzione` con un testo non vuoto;
         - se il JSON ha almeno una cella con motivo `nessun-esito-applicabile`, la sezione citi almeno uno di quegli ID di cella.
      10. **Il controllo deve poter fallire.** Un test di controllo applica i controlli dei passi 3, 6 e 8 a copie **alterate in memoria** del documento. Pretende che ciascuna alterazione venga rilevata:
          - un esito con il conteggio cambiato in una riga di § *Punti di interruzione*;
          - una cella bloccata rimossa;
          - una cella `NON_SUPPORTABILE` spostata fra i bloccati.

      ## Verify
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter ResultTraceabilityTests`. Attesa: tutti verdi, compreso il test di controllo.
      - Esegui, con timeout 900 s, `swift test --package-path Spikes/04-crash-recovery`. Attesa: l'intera suite è verde.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-2 — ogni riga di § *Punti di interruzione* combacia con il JSON per esito, ripetizioni e stato, e ogni punto enumerato ha la sua riga.
      - [ ] AC-3 — § *Compensazione* combacia con il JSON, cella per cella e scostamento per scostamento.
      - [ ] AC-4 — § *Classi di errore* e § *Punti bloccati in attesa dell'utente* combaciano con il JSON, e ogni cella bloccata ha ambito e ragione.
      - [ ] AC-5 — § *Separazione di immagine e sidecar* combacia con il JSON.
      - [ ] AC-6 — l'esito su ADR-007 ha un solo marcatore, e le proposte sono motivate da celle reali.
      - [ ] AC-7 — la simmetria fra non supportabili e bloccati è verificata, e il test di controllo dimostra che il confronto può fallire.

      ## Blockers
      None.
