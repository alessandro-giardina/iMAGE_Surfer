      - Esegui `archetipo wiki --project-root /Users/gia/iMAGE_Surfer validate`. Attesa: `ok: true`, nessun rilievo `error`.
      - Esegui `grep -c "04-crash-recovery" docs/wiki/operations/development.md`. Attesa: almeno 3.

      ## Done
      - [ ] La pagina `operations/development` registra il cambiamento di conoscenza: toolchain e prerequisiti del banco n°4, cancello n°4 concluso con l'esito su ADR-007, due suite reali, e l'iniezione di arresti a ogni push ancora prescritta e non costruita.
      - [ ] Evidenza: `sources` cita `Spikes/04-crash-recovery`, e il corpo rimanda a `PROCEDURE.md`, `RESULT.md` e alla pagina di decisione.
