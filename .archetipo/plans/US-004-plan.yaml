  - id: TASK-03
    title: Piano del lotto, log di intenti JSONL durevole con record troncato riconoscibile, e passi idempotenti con compensazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Il lotto della fixture si espande in un piano di dieci passi, da `S01` a `S10`. Il log di intenti scrive su disco ogni record prima dell'azione che annuncia, e si rilegge riconoscendo un record troncato. Ogni passo è idempotente sia in esecuzione sia in compensazione.

      ## Read
      - `Spikes/04-crash-recovery/fixtures/batch.json` e `Sources/CrashKit/Fixtures.swift` (`BatchDefinition`).
      - `Sources/CrashKit/WorkVolume.swift`: `batchRoot`, `trashDirectory`, `volumeUUID(of:)`.
      - Questo piano, § *Baseline*: gli errno osservati e il nome con suffisso orario di una collisione nel Cestino.

      ## Change
      - File nuovi: `Sources/CrashKit/BatchPlan.swift`, `Sources/CrashKit/IntentLog.swift`, `Sources/CrashKit/Steps.swift`, `Tests/CrashKitTests/IntentLogTests.swift`, `Tests/CrashKitTests/StepTests.swift`.
      - **Non-obiettivi:**
        - nessuna classificazione degli errori, che è TASK-04: qui un fallimento è un `StepFailure` grezzo;
        - nessun punto di interruzione, che è TASK-05;
        - nessun recupero, che è TASK-06;
        - nessun `try?` che nasconda un errore di sistema.

      ## Steps
      1. Implementa `BatchPlan.make(definition:volume:)`.
         - Per ogni operazione, nell'ordine, genera due `PlannedStep`: prima `.jpg`, poi `.xmp`. Sono numerati da `S01` a `S10`.
         - Ogni passo ha: `id`, `opId`, `kind` (`rename`, `move`, `copy` o `trash`), e `source` e `destination` relativi a `lotto/` (`destination` è `nil` per `trash`). Ha anche `sha256` e `size` della sorgente, letti dal volume.
         - Il piano ha: `planId` (un UUID), `batchId`, `volumeUUID` di `batchRoot`, `steps`, e `directoriesToCreate`, cioè le cartelle padre delle destinazioni non ancora esistenti (`selezione` e `consegna`). Tutto è `Codable`.
      2. Implementa `IntentLog(url:)`, con percorso predefinito `<data>/state/intent-log.jsonl`.
         - **`Record`.** È un enum `Codable` con discriminante `type`. I casi sono:

           | `type` | Campi |
           |---|---|
           | `plan` | il piano completo |
           | `recheck` | `ok`, `divergences: [String]` |
           | `prepare` | `created: [String]` |
           | `step-intent` | `stepId`, `direction` (`forward` o `compensate`) |
           | `step-done` | `stepId`, `direction`, `resultPath`; per `trash` è il `resultingItemURL` relativo al volume |
           | `step-failed` | `stepId`, `direction`, `syscall`, `errno`, `errorClass` (stringa opzionale, riempita da TASK-04), `scope` (opzionale) |
           | `recovery` | `strategy`, `direction`, `summary` |
           | `decision` | `retry` oppure `abandon` |
           | `outcome` | `outcome`, `reason`, `trace` |
           | `undo-requested` | nessun campo |

         - **`append(_:)`.** Serializza su una sola riga con `JSONEncoder` e `.sortedKeys`, aggiunge `\n` e scrive con **una sola** `write(2)` su un descrittore aperto con `O_WRONLY|O_CREAT|O_APPEND`. Poi chiama `fcntl(fd, F_FULLFSYNC)`. Una `write` parziale o un sync fallito lanciano un errore.
         - **`appendTorn(_:)`.** Scrive solo i primi `count/2` byte della riga, senza `\n`, poi chiama `F_FULLFSYNC`. Lo usa TASK-05.
         - **`read() -> (records: [Record], tornTail: String?)`.** Decodifica le righe terminate da `\n`. Se l'ultimo frammento non termina con `\n` o non si decodifica, lo restituisce come `tornTail`. Una riga terminata e non decodificabile **prima** della coda lancia `logCorrotto(linea:)`.
         - **`repairTornTail()`.** Se esiste un `tornTail`, ne copia il testo in `<state>/torn-<ISO8601>.txt`, tronca il file all'ultimo `\n` con `ftruncate` e chiama `F_FULLFSYNC`. Restituisce il percorso dell'evidenza. Senza questa riparazione, un `append` successivo fonderebbe il frammento con la riga nuova.
      3. In `Steps.swift`, definisci `StepFailure`, con i campi `stepId`, `syscall`, `errno: Int32?`, `cocoa: String?` e `path`.
         - Per `trashItem`: se l'`NSError` (o il suo `NSUnderlyingErrorKey`) è in `NSPOSIXErrorDomain`, `errno` è quel codice. Altrimenti `errno` è `nil` e `cocoa` vale `"<dominio> <codice> / <dominio sottostante> <codice>"`.
         - La baseline mostra che un file immutabile produce `NSCocoaErrorDomain 513 / NSOSStatusErrorDomain -5000`, senza alcun errno.

         Definisci poi `StepObservation`, con i casi `.notDone`, `.done(resultPath)`, `.partial(tempPath)` e `.anomaly(found: [String: String?])`: posizione → digest trovato, `nil` se assente.
      4. Implementa `observe(step, plan, volume)`. Il nome del file temporaneo di copia è `.<nome destinazione>.partial-<planId>`, nella cartella di destinazione.

         | Tipo | Stato osservato | Risultato |
         |---|---|---|
         | `rename`, `move` | sorgente con il digest del piano e destinazione assente | `.notDone` |
         | `rename`, `move` | destinazione con il digest e sorgente assente | `.done` |
         | `rename`, `move` | ogni altra combinazione | `.anomaly`, con entrambe le posizioni |
         | `copy` | destinazione con il digest | `.done` |
         | `copy` | destinazione assente e file temporaneo presente | `.partial` |
         | `copy` | destinazione assente | `.notDone` |
         | `copy` | ogni altro caso, inclusa una sorgente assente o con digest diverso | `.anomaly` |
         | `trash` | sorgente presente con il digest | `.notDone` |
         | `trash` | sorgente assente, e **una sola** voce di `trashDirectory` con il digest | `.done(percorso)` |
         | `trash` | sorgente assente, e zero o più voci con il digest | `.anomaly`, con l'elenco delle voci |

         Nel Cestino si cerca **per digest**, non per nome.
      5. Implementa `execute(step, plan, volume)`, idempotente: se `observe` restituisce `.done` non fa nulla.
         - **`rename` e `move`:** `renamex_np(src, dst, RENAME_EXCL)`.
         - **`copy`:** in caso di `.partial`, prima `unlink` del temporaneo. Poi `copyfile(src, tmp, nil, COPYFILE_ALL|COPYFILE_EXCL)` e `renamex_np(tmp, dst, RENAME_EXCL)`. Esponi un gancio `afterTempWritten: () -> Void`, chiamato fra le due chiamate: lo usa TASK-05 per `Sxx-m`.
         - **`trash`:** prima verifica che `volumeUUID(of: src)` sia uguale a `plan.volumeUUID`; se no, `StepFailure` senza agire. Poi `FileManager.trashItem(at:resultingItemURL:)`, e restituisce il percorso risultante relativo al volume.
         - Ogni chiamata fallita produce un `StepFailure` con `syscall` ed `errno`.
      6. Implementa `compensate(step, plan, volume)`, idempotente: se `observe` restituisce `.notDone` non fa nulla.
         - **`rename` e `move`:** `renamex_np(dst, src, RENAME_EXCL)`.
         - **`copy`:** `trashItem` della copia, senza mai `unlink`, per NFR-A1.
         - **`trash`:** `renamex_np(<voce trovata per digest>, src, RENAME_EXCL)`.
         - **`compensatePrepare(created:)`:** `rmdir` delle sole cartelle elencate in `created`. Una cartella non vuota resta dov'è e viene restituita nell'elenco delle cartelle mantenute.
      7. Scrivi `IntentLogTests`, su una directory temporanea del volume ospite. Verifica che:
         - il round trip funzioni per ogni tipo di record;
         - dopo `appendTorn` e `read()`, i record precedenti siano intatti e `tornTail` non sia nullo;
         - dopo `repairTornTail()`, poi `append`, poi `read()`, ci siano tutti i record completi e nessun `tornTail`, e il file di evidenza contenga il frammento;
         - una riga corrotta in mezzo al file lanci `logCorrotto`.
      8. Scrivi `StepTests`, con `@Suite(.serialized)` e `TestVolume`.
         - Per ciascun tipo di passo verifica:
           - che `execute` ripetuto due volte agisca solo la prima volta, con le istantanee prima e dopo il secondo `execute` uguali;
           - che lo stesso valga per `compensate`;
           - che `execute` seguito da `compensate` riporti percorsi e digest dei file del passo a quelli di partenza.
         - Verifica inoltre questi casi particolari:
           - **copia interrotta:** con un temporaneo `.partial` creato a mano, `execute` completa la copia e il temporaneo sparisce;
           - **collisione nel Cestino:** con una voce `IMG_0005.jpg` di contenuto diverso già nel Cestino, `observe` dopo `trash` trova la voce giusta per digest;
           - **Cestino fuori volume:** un passo `trash` la cui sorgente sta su un volume diverso da `plan.volumeUUID` (un file nella directory temporanea dell'ospite, con un piano costruito a mano) produce uno `StepFailure` e il file resta dov'è.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter "IntentLogTests|StepTests"`. Attesa: tutti verdi.
      - Esegui `grep -rn "trashItem" Spikes/04-crash-recovery/Sources`. Attesa: occorrenze solo in `Steps.swift`.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-1 — il log di intenti scrive su disco il piano e ogni intento **prima** dell'azione corrispondente, con una riga per record, una sola `write` e `F_FULLFSYNC`. I passi sono registrati uno a uno.
      - [ ] AC-1 — ogni passo è idempotente in esecuzione e in compensazione, come dimostra `StepTests`.
      - [ ] AC-7 — un record troncato viene riconosciuto e conservato come evidenza, e non viene mai letto come record valido.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Classificazione degli errori per ambito della precondizione e le otto perturbazioni applicabili e reversibili
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Ogni fallimento o anomalia di un passo riceve una delle otto classi di errore del cancello, con ambito **locale** o **sistemico**. L'ambito si decide verificando volume, scrittura e spazio prima dell'errno. Le otto classi si applicano a un bersaglio scelto da una regola fissa e si rimuovono con un comando.

      ## Read
      - `Sources/CrashKit/Steps.swift`: `StepFailure`, `StepObservation.anomaly`.
      - `Sources/CrashKit/WorkVolume.swift`: `eject`, `attach`, `quarantine`, `trashDirectory`.
      - Questo piano, § *Classificazione degli errori per ambito, non per errno* e § *Perturbazioni*.
      - Questo piano, § *Baseline*: `ENOENT` dopo l'espulsione, il comportamento su volume pieno e l'algoritmo di riempimento a blocchi dimezzati.

      ## Change
      - File nuovi: `Sources/CrashKit/ErrorClassifier.swift`, `Sources/CrashKit/Perturbations.swift`, `Tests/CrashKitTests/ErrorClassifierTests.swift`.
      - `Sources/crashbench/main.swift`: aggiungi i sottocomandi `perturb` e `unperturb`.
      - **Non-obiettivi:**
        - nessuna modifica alle regole degli esiti;
        - nessun ricorso a errno «simili» per classificare: un caso senza regola resta `nonClassificato`.

      ## Steps
      1. Definisci `enum ErrorClass: String, Codable, CaseIterable` con questi otto casi. `scope` ha i valori `.locale` e `.sistemico`.

         | Classe | `scope` adottato | Rilevazione |
         |---|---|---|
         | `G-volume-missing` | sistemico | `batchRoot` assente, oppure `volumeUUID(of: batchRoot)` diverso da `plan.volumeUUID` |
         | `G-folder-readonly` | sistemico | `access(W_OK)` fallisce su `batchRoot` o sulla cartella di destinazione del passo |
         | `G-space-exhausted` | sistemico | errno `ENOSPC` o `EDQUOT` |
         | `L-locked` | locale | `UF_IMMUTABLE` presente in `st_flags` del file del passo, **e** errno `EPERM` oppure `cocoa` che comincia con `NSCocoaErrorDomain 513` (caso di `trashItem`, vedi baseline) |
         | `L-collision` | locale | errno `EEXIST`, oppure un'anomalia con un file di digest diverso nella posizione di arrivo e la sorgente intatta |
         | `L-modified` | locale | un'anomalia con un file nella posizione attesa ma con digest diverso da quello del piano |
         | `L-trash-emptied` | locale | in compensazione di un `trash` già eseguito, nessuna voce di `trashDirectory` ha il digest |
         | `L-missing` | locale | il file non è in nessuna delle posizioni attese: origine, destinazione, Cestino |

      2. Implementa `ErrorClassifier.classify(failure: StepFailure?, observation: StepObservation?, step:, plan:, volume:, direction:) -> Classification`.
         - `Classification` vale `.classified(ErrorClass)` oppure `.nonClassificato(descrizione)`.
         - Applica i controlli **in quest'ordine**, e il primo che corrisponde vince:
           1. volume;
           2. scrittura;
           3. errno di spazio;
           4. cause locali, nell'ordine della tabella.
         - Commenta in testa al file perché l'ordine conta: `ENOENT` dopo un'espulsione è identico a `ENOENT` di un file scomparso.
      3. Implementa `Perturbations` con `apply(_ class:, strategy:, plan:, log:, volume:) -> PerturbationRecord` e `remove(volume:)`.
         - Lo stato si salva in `<data>/state/perturbation.json`, così `unperturb` sa cosa annullare e funziona anche da un altro processo.
         - Ogni classe si applica e si rimuove così:

           | Classe | Applicazione | Rimozione |
           |---|---|---|
           | `L-missing` | `rename` del file bersaglio in `quarantine` | `rename` di ritorno |
           | `L-locked` | `chflags(UF_IMMUTABLE)` sul bersaglio | `chflags(0)` |
           | `L-collision` | crea un file estraneo con contenuto `"estraneo"` nella posizione di arrivo del bersaglio: la destinazione in ripresa, l'origine in compensazione | `rename` del file estraneo in `quarantine` |
           | `L-modified` | salva in `perturbation.json` la dimensione e la `mtime` originali, poi aggiunge un byte in coda | `ftruncate` alla dimensione originale e `utimensat` alla `mtime` originale; l'inode resta lo stesso |
           | `L-trash-emptied` | `rename` della voce del Cestino con il digest del bersaglio in `quarantine`, salvandone il nome | `rename` di ritorno con lo stesso nome |
           | `G-volume-missing` | `volume.eject()` | `volume.attach()` |
           | `G-folder-readonly` | `chmod 0555` su `batchRoot` e sulle cartelle di destinazione esistenti | `chmod 0755` |
           | `G-space-exhausted` | crea `<mnt>/.riempimento` e scrive blocchi da 1 MiB; a ogni errore dimezza il blocco, fino a 1 byte; poi `fsync` | `unlink` di `.riempimento` |

      4. Implementa la regola del bersaglio, `Perturbations.target(class, strategy, plan, log, volume)`.
         - Usa lo stato osservato dei passi, cioè `observe`.
         - **In ripresa:** il primo passo **non eseguito**, in ordine di piano, a cui la classe si applica.
         - **In compensazione:** il primo passo **eseguito**, in ordine inverso.
         - **Restrizioni per classe:**
           - `G-space-exhausted` si applica solo ai passi `copy` in ripresa;
           - `L-locked` si applica solo a `rename`, `move` e `trash`;
           - `L-trash-emptied` si applica solo alla compensazione di un `trash` eseguito;
           - `G-volume-missing` e `G-folder-readonly` non hanno un file bersaglio.
         - Senza un bersaglio la regola restituisce `.nonApplicabile(motivo)`, e non applica nulla.
      5. Aggiungi i sottocomandi.
         - `crashbench perturb <classe> --strategy resume|compensate` legge piano e log, sceglie il bersaglio, applica la perturbazione e stampa una sola riga:
           - `PERTURBAZIONE <classe> bersaglio=<stepId>|nessuno ambito=<locale|sistemico>`, oppure
           - `PERTURBAZIONE <classe> NON-APPLICABILE motivo=<…>`.
         - `crashbench unperturb` è idempotente.
      6. Scrivi `ErrorClassifierTests`, con `@Suite(.serialized)` e `TestVolume`. Per ogni classe:
         1. reimposta la cartella;
         2. crea il piano;
         3. esegui i passi necessari a portare il lotto nello stato richiesto;
         4. applica la perturbazione;
         5. tenta il passo;
         6. classifica;
         7. verifica la classe e l'ambito attesi.

         Casi da coprire esplicitamente:
         - **`ENOENT` con il volume montato** e il file in quarantena → `L-missing`, locale.
         - **`ENOENT` dopo `eject`** → `G-volume-missing`, sistemico. Questo test è l'evidenza che l'errno da solo non basta.
         - **Volume pieno.** `G-space-exhausted` sul passo `S07` (copia) produce `ENOSPC`, sistemico. Sullo stesso volume pieno, `S01` (rinomina) riesce.
         - **Cestino svuotato.** `L-trash-emptied` sulla compensazione di `S09` dopo l'esecuzione di `S09` è locale.
         - **Rimozione delle perturbazioni.** Per ogni classe, `remove` riporta il volume a un'istantanea uguale a quella presa prima di `apply`. Sono ammessi solo scostamenti con `isDirectoryMtime`.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter ErrorClassifierTests`. Attesa: tutti verdi.
      - Esegui `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0` dopo i test.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-4 — ognuna delle otto classi di errore ha nel codice un ambito adottato, locale o sistemico, e una regola di rilevazione verificata su un errore reale.
      - [ ] AC-4 — la scomparsa del volume è distinta dalla scomparsa di un file nonostante lo stesso `ENOENT`, e un test lo dimostra.
      - [ ] Ogni perturbazione è reversibile. `unperturb` riporta il volume allo stato precedente, salvo la `mtime` delle directory.

      ## Blockers
      None.
