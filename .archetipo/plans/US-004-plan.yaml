    body: |-
      ## Objective
      La pagina `operations/development` documenta come si costruisce, si testa e si esegue il banco del cancello n°4, con il prerequisito `diskutil image` e nessun `sudo`. Segna il cancello n°4 come concluso, con l'esito su ADR-007, e distingue la suite esistente dal test di iniezione di arresti «a ogni push» che il PRD prescrive e che resta da costruire.

      ## Read
      - `docs/wiki/operations/development.md`, in particolare:
        - § *Stato attuale*: la toolchain dei cancelli, la tabella dei quattro cancelli e la frase sul materiale non versionabile;
        - § *Test previsti*: «La prima suite reale del repository è `BenchKitTests`» e la voce dei test di iniezione di arresti;
        - il frontmatter `sources`.
      - `Spikes/04-crash-recovery/PROCEDURE.md` e `RESULT.md`, § *Configurazione* e § *Esito su ADR-007*.

      ## Change
      - `docs/wiki/operations/development.md`: solo le parti elencate qui sotto, più `sources`.
      - **Non-obiettivi:**
        - non dichiarare l'esistenza di una CI, che resta assente;
        - non modificare a mano il blocco `review`.

      ## Steps
      1. **Primo passo:** esegui `archetipo wiki --project-root /Users/gia/iMAGE_Surfer reset operations/development`.
      2. Aggiungi a `sources` la voce `- path: Spikes/04-crash-recovery` con `role: implementation`.
      3. Aggiorna § *Stato attuale*.
         - **Toolchain dei cancelli.** Aggiungi i comandi del banco n°4, lanciati dalla radice del repository:

           ```sh
           swift build --package-path Spikes/04-crash-recovery
           swift test  --package-path Spikes/04-crash-recovery
           Spikes/04-crash-recovery/.build/debug/crashbench setup
           Spikes/04-crash-recovery/.build/debug/crashbench run-matrix --profile full
           ```

           Aggiungi il rimando a `Spikes/04-crash-recovery/PROCEDURE.md`, e il prerequisito: un'immagine disco APFS creata con `diskutil image`, senza `sudo` e senza `hdiutil`, che su macOS 27.2 è deprecato. Il Cestino usato è quello del volume di lavoro, non quello dell'utente.
         - **Tabella dei cancelli.** La riga 4 diventa **concluso**: esito in `Spikes/04-crash-recovery/RESULT.md`, ADR-007 **confermato** oppure **emendato**, come in `RESULT.md`, con il collegamento [Lotti di operazioni su file recuperabili con esiti dichiarati](/decisions/recoverable-file-batches.md).
         - **Materiale non versionabile.** La frase resta vera per i cancelli 1 e 2. Aggiungi che il materiale del cancello 4 è versionato: fixture del lotto e misura in `measurements/`.
      4. Aggiorna § *Test previsti*.
         - Nello *Stato reale* dì che le suite reali sono due: `BenchKitTests` e `CrashKitTests`. Per la seconda elenca cosa copre:
           - idempotenza dei passi;
           - classificazione degli errori su errori reali;
           - raggiungibilità dei cinque esiti, asserita sull'istantanea;
           - arresto per `SIGKILL` sul binario reale;
           - tracciabilità di `RESULT.md`.
         - Nella voce *Test di iniezione di arresti … eseguiti a ogni push* dì che il meccanismo esiste come banco del cancello, eseguito a mano, e che la sua esecuzione a ogni push resta una prescrizione del PRD per la Tappa 3, fuori dall'ambito del cancello.
      5. Se il `description` del frontmatter («esiste la sola toolchain SwiftPM del banco di misura del cancello n°1») non è più esatto, aggiornalo ed esegui `archetipo wiki --project-root /Users/gia/iMAGE_Surfer catalog`.

