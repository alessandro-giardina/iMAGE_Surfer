spec_code: US-004
body: |-
  # US-004: Cancello 4 - stabilire per iniezione di arresti quale dei cinque esiti si raggiunge — Piano di implementazione

  **Generato da:** Team di pianificazione ARchetipo
  **Data:** 2026-11-16

  ---

  ## Spec

  **Epica:** EP-001 — Tappa 0 - Cancelli tecnici
  **Priorità:** HIGH | **Punti:** 5 | **Ambito:** MVP

  **Storia utente**

  Come Leonardo, architetto di iMAGE Surfer, voglio interrompere un lotto di operazioni su file in ogni punto enumerato e osservare, dopo il recupero, quale dei cinque esiti dichiarati viene effettivamente raggiunto e se la compensazione riporta lo stato precedente, così che ADR-007 sia confermato oppure emendato, e che i punti di interruzione destinati legittimamente a "bloccato in attesa dell'utente" siano nominati prima di costruire la macchina a stati che li deve gestire.

  **Criteri di accettazione**

  - AC-1 — `Spikes/04-crash-recovery/` con un lotto di prova eseguibile che scrive il log di intenti prima di agire, esegue passi idempotenti registrati uno a uno, e un meccanismo che interrompe il processo a un punto scelto dall'elenco enumerato; fixture del lotto versionate.
  - AC-2 — `RESULT.md` pubblica una riga per ogni punto di interruzione enumerato, con l'esito raggiunto fra i cinque, il numero di ripetizioni e lo stato osservato di immagine e sidecar dopo il recupero.
  - AC-3 — per ogni punto in cui è stata tentata una compensazione, `RESULT.md` dichiara se lo stato dopo la compensazione coincide con quello precedente all'avvio e nomina ogni scostamento.
  - AC-4 — `RESULT.md` nomina i punti che finiscono legittimamente in "bloccato in attesa dell'utente" con la ragione, distingue errore locale ed errore sistemico, e riporta la classificazione adottata per ogni classe di errore provata.
  - AC-5 — `RESULT.md` riporta, per i casi in cui l'interruzione separa immagine e sidecar, se il recupero rileva la separazione e cosa riferisce.
  - AC-6 — `RESULT.md` chiude con l'esito su ADR-007, **confermato** oppure **emendato**; se i cinque esiti non reggono, propone l'insieme sostitutivo con la traccia che lo motiva.
  - AC-7 — un punto dal quale nessuno dei cinque esiti è raggiungibile è registrato come **esito non supportabile** con la traccia, e non viene riclassificato come "bloccato".

  **Fuori ambito.** La macchina a stati `FileOps` del prodotto, la cronologia dei lotti, il comando di annullamento per l'utente e l'integrazione dei test di iniezione di arresti nella pipeline di integrazione continua appartengono alla Tappa 3. Il cancello non prova la rinomina guidata da pattern né lo smistamento per regole, e non tocca gli altri tre cancelli.

  ---

  ## Soluzione tecnica

  Il cancello è uno **spike di verifica**, non una funzione. Il suo prodotto è una matrice di esiti misurati e un esito scritto su ADR-007. Nasce da zero sotto `Spikes/04-crash-recovery/` come pacchetto SwiftPM **isolato e usa-e-getta**. Non ha dipendenze esterne e non dipende da `Spikes/01-scale-memory/`: il blocco del plugin delle macro di Swift Testing viene copiato, non importato.

  **La verità del cancello è il disco, non la macchina.** Ogni affermazione del recupero viene confrontata con un'**istantanea** del volume presa dal banco: posizione, digest e metadati di ogni file. Un esito stampato non basta: deve coincidere con ciò che il disco mostra.

  ### Pacchetto e fixture

  - **Target.** `CrashKit` è la libreria, `crashbench` l'eseguibile con un sottocomando per azione, `CrashKitTests` la suite Swift Testing. Il codice è in modalità Swift 6 ed è **interamente sincrono**: la macchina è sequenziale per natura, e un punto di arresto deterministico non convive con codice `async`.
  - **Lotto di prova versionato.** `fixtures/folder/` contiene cinque coppie, da `IMG_0001` a `IMG_0005`. Ogni coppia è un JPEG 64×48 più un sidecar XMP minimo con `xmp:Rating`. Le coppie sono generate una volta da `crashbench make-fixtures` e versionate insieme a `fixtures/MANIFEST.json`, che riporta SHA-256 e dimensione di ogni file.
  - **Le cinque operazioni.** `fixtures/batch.json` copre i tipi di FR-081 e FR-082, una operazione per coppia:

    | Operazione | Tipo | Coppia | Destinazione |
    |---|---|---|---|
    | `OP1` | rinomina | `IMG_0001` | `2026-08-24_evento_001` |
    | `OP2` | spostamento | `IMG_0002` | `selezione/` |
    | `OP3` | spostamento con rinomina | `IMG_0003` | `selezione/2026-08-24_evento_003` |
    | `OP4` | copia | `IMG_0004` | `consegna/` |
    | `OP5` | Cestino | `IMG_0005` | — |

  - **Passi.** Ogni operazione agisce sulla coppia in due passi, prima l'immagine e poi il sidecar: in tutto dieci passi, da `S01` a `S10`.
  - **Nome del sidecar.** La convenzione `<radice>.xmp` è una scelta della **sola fixture**. La decisione sul nome appartiene al cancello n°3, e nessun esito di questo cancello ne dipende.

  ### Volume di lavoro e log di intenti

  - **Volume di lavoro dedicato, su immagine disco.** Il lotto gira su un volume APFS da 64 MB:
    - creazione: `diskutil image create blank --format ASIF --size 64m --volumeName CrashBench --fs APFS .data/work.asif`;
    - montaggio: `diskutil image attach --nobrowse --mountPoint .data/mnt`;
    - smontaggio: `diskutil eject`.

    Le ragioni sono tre, tutte verificate dalle sonde della baseline:
    1. il Cestino di quel volume è `.Trashes/502` **sul volume stesso**, quindi il Cestino dell'utente non viene mai toccato;
    2. è l'unico modo, senza `sudo`, per far **scomparire il volume** e per **esaurirne lo spazio**;
    3. ogni esecuzione riparte da zero.

    `hdiutil` funziona, ma su macOS 27.2 stampa avvisi di deprecazione e non va usato. **Regola di sicurezza:** il passo `trash` verifica che l'UUID del volume della sorgente sia quello registrato nel piano, e altrimenti si rifiuta di agire.
  - **Log di intenti JSONL sul volume ospite.** Il log è `.data/state/intent-log.jsonl`. Ogni record occupa una riga, scritta con una sola `write(2)` e seguita da `fcntl(F_FULLFSYNC)` **prima** dell'azione che annuncia.
    - **Posizione.** Come lo stato durevole del prodotto, il log è separato dalla cartella del lotto: espellere il volume o riempirlo non tocca il registro.
    - **Lettura.** Il lettore tollera un'**ultima riga troncata**. La riconosce, ne conserva il frammento come evidenza e tronca il file all'ultima riga completa. Una riga corrotta che non sta in coda è invece un errore, mai ignorato.
    - **Alternativa scartata: SQLite di sistema**, più vicino a `DurableState` di ADR-003. Il cancello verifica la macchina a esiti di ADR-007, non il motore di durabilità di ADR-003. Un JSONL è leggibile dal revisore con `cat` e rende iniettabile in modo deterministico il record troncato.

  ### Macchina a stati e passi idempotenti

  - **Fasi.** La macchina attraversa queste fasi, ciascuna chiusa da un record:
    1. *piano registrato* — identità del volume, passi con digest e dimensione, cartelle da creare;
    2. *precondizioni ricontrollate* — se qualcosa è cambiato rispetto al piano il lotto si interrompe **prima di agire**, come prescrive FR-080, e lo registra come `interrotto-prima-di-agire`, che **non** è uno dei cinque esiti;
    3. *lotto preparato* — creazione di `selezione/` e `consegna/`;
    4. *passi* — per ciascuno, record d'intento → azione → record di fatto;
    5. *esito*.
  - **Esecuzione dei passi.** Ogni passo osserva prima il disco e non agisce se è già fatto.

    | Tipo | Esecuzione | Compensazione |
    |---|---|---|
    | rinomina e spostamento | `renamex_np(..., RENAME_EXCL)`, che non sovrascrive mai | `renamex_np` all'indietro |
    | copia | copia in un temporaneo `.<nome>.partial-<planId>`, poi pubblicazione con `renamex_np(RENAME_EXCL)` | la copia va nel **Cestino**: NFR-A1 vieta eliminazioni dirette |
    | Cestino | `FileManager.trashItem`, registrando il percorso restituito | `renamex_np` dalla voce del Cestino trovata **per digest** |

  - **Il Cestino si cerca per digest, non per nome.** La sonda ha mostrato che una collisione nel Cestino rinomina l'elemento con un suffisso orario (`a.jpg 11-11-52-954.jpg`).
  - **Cartelle preparate.** In compensazione, le cartelle create dal lotto si rimuovono con `rmdir` solo se vuote e solo se il record di preparazione dice che le ha create il lotto.
  - **File temporanei di copia.** Sono artefatti del banco e si rimuovono con `unlink`. È una politica adottata e dichiarata.

  ### Punti di interruzione

  L'elenco ha **61 punti**, derivati dal piano da `crashbench list-points` e non scritti a mano.

  **Esecuzione (37 punti).**

  | Punto | Momento dell'arresto |
  |---|---|
  | `X00-plan-torn` | record del piano scritto a metà |
  | `X01-plan` | dopo il record del piano |
  | `X02-recheck` | dopo il ricontrollo delle precondizioni |
  | `X03-prepare` | dopo la preparazione delle cartelle |
  | `Sxx-a` | intento registrato, azione non eseguita |
  | `Sxx-m` | solo copie `S07` e `S08`: temporaneo scritto, non pubblicato |
  | `Sxx-b` | azione eseguita, fatto non registrato |
  | `Sxx-c` | fatto registrato |
  | `S05-torn` | record di fatto di `S05` scritto a metà |

  **Compensazione di un lotto completato (22 punti).** Il lotto si conclude `completato`, poi viene annullato come farebbe l'utente secondo FR-083:

  - `Kxx-a` e `Kxx-b` per i passi da `S10` a `S01`, in ordine inverso;
  - `K00-a` e `K00-b` per la rimozione delle cartelle preparate.

  **Doppio arresto (2 punti).**

  - `D01`: arresto a `S03-b`, poi un secondo arresto durante la ripresa a `S08-b`.
  - `D02`: arresto a `S03-b`, poi un secondo arresto durante la compensazione a `K02-a`.

  **Iniezione.** Nel punto scelto il processo stampa `ARRESTO <id>` e si uccide con `kill(getpid(), SIGKILL)`: nessuna pulizia e nessun `atexit`. I punti `-torn` scrivono metà della riga, la sincronizzano e poi si uccidono.

  ### Recupero

  Il recupero gira in un **nuovo processo**, in quattro passaggi:

  1. legge il prefisso valido del log;
  2. verifica l'identità del volume;
  3. riconosce dal **disco**, non dal log, lo stato di ogni file;
  4. procede nella direzione stabilita.

  **Direzione.** `--strategy resume|compensate` sceglie la direzione. Una compensazione già avviata e registrata nel log, però, **non viene mai rovesciata in silenzio**: la direzione del log prevale sull'opzione.

  **Log e disco divergono.** Il log dice cosa si voleva fare, il disco cosa è accaduto. Una divergenza fra i due viene riportata, e per decidere vale il disco.

  **Stampa.** Il recupero riporta lo stato di ogni passo, la posizione di immagine e sidecar per coppia, le separazioni trovate all'avvio e la riga `ESITO`.

  **Decisioni dell'utente.** `crashbench decide retry|abandon` registra la decisione su un lotto `bloccato`.

  ### Classificazione degli errori per ambito, non per errno

  La sonda ha mostrato che, dopo l'espulsione del volume, `rename` restituisce `ENOENT`, **lo stesso errno di un file scomparso**, e che il punto di montaggio torna a essere una directory vuota del volume ospite. Il classificatore verifica quindi **nell'ordine** quattro condizioni, e la prima che corrisponde decide:

  1. **Il volume.** Se l'UUID della radice del lotto è diverso da quello del piano, oppure la radice manca, l'errore è sistemico (`G-volume-missing`).
  2. **La scrittura.** Se la radice o la cartella di destinazione non è scrivibile (`access(W_OK)`), l'errore è sistemico (`G-folder-readonly`).
  3. **Lo spazio.** Se l'errno è `ENOSPC` o `EDQUOT`, l'errore è sistemico (`G-space-exhausted`).
  4. **Le cause locali**, riconosciute da ciò che si osserva sul disco:
     - `L-missing`: il file non è in nessuna posizione attesa;
     - `L-locked`: `EPERM` con `UF_IMMUTABLE` impostato;
     - `L-collision`: `EEXIST`, oppure un file estraneo nella posizione di arrivo;
     - `L-modified`: il digest non è quello del piano;
     - `L-trash-emptied`: in compensazione, nessuna voce nel Cestino ha il digest atteso.

  Un fallimento che non corrisponde a nessuna classe resta `nonClassificato`, e non viene ricondotto per somiglianza a una classe vicina.

  **La classificazione è l'ingresso del cancello, non la sua conclusione.** `RESULT.md` dice se ha retto.

  ### Perturbazioni

  Le otto classi si applicano **fra l'arresto e il recupero**, con `crashbench perturb <classe>`, e si rimuovono con `crashbench unperturb`.

  - **Dove.** Ogni classe si prova a tre punti:
    - `X03-prepare`: niente ancora eseguito;
    - `S06-b`: lotto a metà;
    - `S10-c`: tutto eseguito.
  - **Quante celle.** Ogni punto si prova in ripresa e in compensazione: **48 celle**.
  - **Il bersaglio** è scelto da una regola fissa:
    - in ripresa, il primo passo non ancora eseguito a cui la classe si applica;
    - in compensazione, il primo passo eseguito, in ordine inverso.
  - **Restrizioni** che vengono dalla baseline:
    - `G-space-exhausted` si applica solo alle copie: su un volume APFS pieno rinomina, `mkdir` e Cestino riescono, la copia fallisce con `ENOSPC`;
    - `L-locked` si applica solo a rinomina, spostamento e Cestino: una sorgente immutabile si copia lo stesso.
  - **Celle non applicabili.** Una combinazione senza bersaglio si registra come non applicabile, con il motivo.
  - **Celle bloccate.** Ogni cella che finisce `bloccato` prosegue con due rami: `unperturb` più `decide retry`, e `decide abandon`.

  ### Classificatore degli esiti

  È una **funzione pura**. Le regole si applicano in ordine e la prima che corrisponde vince:

  1. **Nessun piano completo nel log** → `NON_SUPPORTABILE`, motivo `nessun-esito-applicabile`. Lo stato è riconoscibile: per costruzione nessuna azione è stata eseguita. Ma nessuno dei cinque esiti lo descrive.
  2. **Almeno un passo non riconoscibile, o un errore non classificato** → `NON_SUPPORTABILE`, motivo `stato-non-riconoscibile`, con la traccia del riconoscitore.
  3. **L'utente ha deciso di abbandonare** → `abbandonato`.
  4. **Almeno un errore sistemico non risolto** → `bloccato`.
  5. **Almeno un passo saltato per errore locale** → `parzialmente-recuperato`.
  6. **Direzione in avanti e tutti i passi fatti** → `completato`.
  7. **Direzione di compensazione e tutti i passi riportati all'origine** → `compensato`.
  8. **Ogni altro caso** → `NON_SUPPORTABILE`, motivo `nessun-esito-applicabile`.

  **`bloccato` nasce solo dalla regola 4.** Nessuna regola riconduce uno stato non riconoscibile a `bloccato` (AC-7).

  ### Matrice e oracoli indipendenti

  `crashbench run-matrix` esegue ogni cella **in processi figli** dello stesso eseguibile, con queste celle:

  - 37 punti di esecuzione per 2 strategie;
  - 22 punti di compensazione;
  - 2 punti di doppio arresto;
  - 48 combinazioni di perturbazione.

  **Ripetizioni.** 5 sul profilo `full`, 1 sul profilo `smoke`.

  **Controllo dell'arresto.** Per ogni esecuzione il banco verifica che il figlio sia morto per segnale 9 nel punto chiesto. Altrimenti la cella è `PUNTO_NON_RAGGIUNTO` e l'esecuzione fallisce.

  **Oracoli calcolati dal banco**, non dalla macchina:

  - **compensazione:** confronto campo per campo con l'istantanea di partenza;
  - **ripresa:** confronto con lo stato atteso del lotto completato;
  - **separazione:** confronto fra la separazione osservata nell'istantanea all'arresto e quella riferita dal recupero;
  - **riconoscimento:** se le posizioni dichiarate dal recupero contraddicono l'istantanea, la cella è marcata `RICONOSCIMENTO_ERRATO`. Questo caso è distinto da `NON_SUPPORTABILE`.

  **Tracciabilità.** Il JSON porta un `measurementId`, l'impronta dell'host e il digest del manifest delle fixture. L'esecuzione scelta è versionata sotto `measurements/`, e ogni riga di `RESULT.md` vi è ricondotta da un test.

  ### Limiti dichiarati, che `RESULT.md` deve riportare

  - **`SIGKILL` simula la caduta del processo, non la perdita di alimentazione.** Ciò che è nella cache delle pagine sopravvive a `SIGKILL`; una perdita di alimentazione o un kernel panic non sono riproducibili senza una macchina virtuale.
  - **Un solo tipo di volume.** Si usa un volume APFS locale su immagine disco. Le altre classi di volume sono del cancello n°2.
  - **Il log non è `DurableState`.** Il registro JSONL non prova il contratto di durabilità di ADR-003.
  - **Campi esclusi dal confronto.** `ctime` e `atime` sono esclusi: `ctime` cambia a ogni rinomina per costruzione.
  - **Il doppio arresto è coperto dai soli `D01` e `D02`.**
  - **Un solo lotto di prova**, di 5 operazioni e 10 passi.

  ### Decisioni architetturali

  **Supera la soglia ADR: la semantica di recupero dei lotti di operazioni su file.** È l'oggetto stesso del cancello. Riguarda la semantica di consistenza e di fallimento e una politica tecnica trasversale a ogni operazione massiva prevista: rinomina, smistamento, eliminazione dei duplicati, annullamento.

  `archetipo wiki search --type decision` restituisce la sola `decisions/work-admission-budget`, che non c'entra. Il piano crea quindi `decisions/recoverable-file-batches`.

  - **Contesto.**
    - Il filesystem non offre transazioni su più file.
    - ADR-007 è provvisorio fino a questo cancello (ADR-015).
    - La revisione 1.3 del PRD ha sostituito "ripreso o compensato" con cinque esiti, senza misura.
  - **Opzione scelta: la decide la misura.** ADR-007 risulterà **confermato** oppure **emendato**, e con lui:
    - l'insieme degli esiti;
    - la classificazione di ciascuna classe di errore;
    - i punti legittimamente bloccati;
    - le regole di riconoscimento.

    Il piano fissa le domande e la forma della risposta, non la risposta.
  - **Alternative valutate.**
    - **(a) Lotto atomico.** Impossibile: nessuna transazione su più file.
    - **(b) Esito binario "ripreso o compensato" (PRD 1.2).** Già scartato dalla 1.3; il cancello misura esattamente le celle in cui nessuna delle due strade è percorribile.
    - **(c) Classificazione per errno.** Scartata dalla sonda: `ENOENT` non distingue un file scomparso da un volume scomparso.
    - **(d) Fidarsi del log per conoscere lo stato.** Scartata: il nome assegnato dal Cestino e il record troncato mostrano che il log registra intenzioni, e la verità è sul disco.
  - **Conseguenze.** La Tappa 3 erediterà regole già misurate invece di ipotesi:
    - classificazione per ambito;
    - Cestino cercato per digest;
    - direzione di una compensazione avviata mai rovesciata;
    - gli scostamenti che una compensazione lascia e che vanno dichiarati all'utente.
  - **Intento di verifica.** `Spikes/04-crash-recovery/RESULT.md`, il JSON sotto `measurements/` e i test che lo tracciano.

  **Non superano la soglia ADR** e restano registrate qui, perché sono materiale del banco, reversibile e senza effetti sul prodotto:

  - il log JSONL al posto di SQLite;
  - il volume su immagine disco;
  - l'arresto con `SIGKILL`;
  - il nome dei file temporanei di copia;
  - la convenzione del sidecar della fixture.

  ---

  ## Baseline

  Misurata il 2026-11-16 sotto `/Users/gia/iMAGE_Surfer`, sulla revisione `10ec6ad`. È anche `data.workdir`, perché i worktree sono disabilitati. `Spikes/04-crash-recovery/` non esiste ancora.

  | Controllo | Risultato prima dell'implementazione | Conseguenza sulla pianificazione |
  |---|---|---|
  | `swift --version` | **Verde:** Apple Swift 6.4.2, target `arm64-apple-macosx27.2.0` | Concorrenza stretta di Swift 6 disponibile. |
  | `swift format --version` | **Verde:** `6.4.4` | Il controllo di stile del piano è `swift format lint --strict`. |
  | `swift format lint --strict --recursive Spikes/01-scale-memory/Sources Spikes/01-scale-memory/Tests` | **Verde:** stato 0 | Stesso controllo, a soglia zero, su ogni file Swift creato da questo piano. |
  | `swift build --package-path Spikes/01-scale-memory` | **Verde:** `Build complete!` (4,1 s) | Questo piano non tocca Spike 01. Il cancello finale verifica che `git diff --name-only 10ec6ad -- Spikes/01-scale-memory` sia vuoto, invece di rieseguire i 41 test di Spike 01, che durano circa 392 s. |
  | `swift test --package-path Spikes/04-crash-recovery` | **Non eseguibile:** il percorso non esiste | Diventa eseguibile dopo TASK-01. |
  | `xcodebuild -version` | **Rosso, prerequisito di ambiente:** è attiva solo l'istanza Command Line Tools | È un vincolo, non un difetto: nessun task usa `xcodebuild`, e il banco è SwiftPM. |
  | `swiftlint` | **Assente** | Nessun task lo invoca. |
  | `diskutil image create blank --format ASIF --size 64m --volumeName CrashBench --fs APFS <p>.asif` | **Verde, senza `sudo`:** 2,3 s | È il meccanismo del volume di lavoro. |
  | `diskutil image attach --nobrowse --mountPoint <dir> <p>.asif` e `diskutil eject <dir>` | **Verde:** montaggio in 0,6 s, volume scrivibile, espulsione pulita. Il punto di montaggio resta come directory vuota del volume ospite | Dopo l'espulsione, l'UUID del volume del punto di montaggio diventa quello dell'ospite. Su questo si basa la rilevazione di `G-volume-missing`. |
  | `hdiutil create/attach/detach` | **Funziona, con avviso di deprecazione** su macOS 27.2 | Non va usato. |
  | Sonda `FileManager.trashItem` su volume montato | **Verde:** destinazione `<mnt>/.Trashes/502/a.jpg`. Una seconda voce omonima diventa `a.jpg 11-11-52-954.jpg`. Il sistema crea `.Trashes/502/.DS_Store`. `.Trashes` non è elencabile, `.Trashes/502` sì | Tre conseguenze: il Cestino si cerca **per digest**; `.DS_Store` nel Cestino è uno scostamento da riportare; l'istantanea legge `.Trashes/<uid>`. |
  | Sonda errno | `chflags(UF_IMMUTABLE)` più `rename` → `EPERM` (1). `renamex_np(RENAME_EXCL)` su destinazione esistente → `EEXIST` (17). `rename` in cartella `0555` → `EACCES` (13). `rename` dopo l'espulsione → `ENOENT` (2) | Sono le regole di rilevazione del classificatore. `ENOENT` è ambiguo, da cui la classificazione per ambito. |
  | Sonda `trashItem` su file con `UF_IMMUTABLE` | **Errore Cocoa, non POSIX:** `NSCocoaErrorDomain` 513, con errore sottostante `NSOSStatusErrorDomain` −5000. Nessun errno | Lo `StepFailure` di un passo `trash` porta l'errore Cocoa, e il classificatore riconosce `L-locked` da `UF_IMMUTABLE` più `EPERM` **oppure** Cocoa 513. Una regola basata sul solo errno non vedrebbe mai il caso del Cestino. |
  | Sonda volume pieno, riempito fino all'ultimo byte con blocchi dimezzati | `mkdir`, `rename`, `trashItem` e una piccola `write` in append **riescono**. `FileManager.copyItem` e `copyfile(COPYFILE_DATA)` falliscono con `ENOSPC` (28) | `G-space-exhausted` morde solo i passi di copia, da cui l'operazione `OP4` nella fixture. Su volume pieno il registro non fallisce, anche perché sta sull'ospite. |
