  - id: TASK-12
    title: Wiki - crea la pagina di decisione decisions/recoverable-file-batches con l'esito misurato su ADR-007
    type: Impl
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      La Wiki contiene `decisions/recoverable-file-batches`, una pagina `type: decision` che registra come conoscenza durevole la semantica di recupero dei lotti di operazioni su file chiusa da questo cancello. Comprende l'insieme di esiti, la classificazione degli errori, i punti legittimamente bloccati, le regole di riconoscimento e gli scostamenti dichiarati, ciascuno con il valore misurato.

      ## Read
      - `.claude/skills/archetipo-wiki/references/wiki-contract.md`, righe 74-101: il contratto delle pagine `type: decision`, cioè frontmatter, `decision_status`, i cinque marcatori di sezione e l'evidenza di repository obbligatoria in `sources`.
      - `docs/wiki/decisions/work-admission-budget.md`: l'unica pagina di decisione esistente, come modello di forma, tono e attribuzione all'hardware.
      - `Spikes/04-crash-recovery/RESULT.md`: tutte le sezioni.
      - `docs/wiki/architecture/context-map.md`: le aree *Operazioni su file* e *Stato durevole*, e la sezione *Incertezze*.
      - `docs/wiki/index.md`, per vedere come il catalogo raggruppa i concetti. **Non va modificato a mano.**

      ## Change
      - File nuovo: `docs/wiki/decisions/recoverable-file-batches.md`.
      - `docs/wiki/index.md`: **solo** tramite `archetipo wiki catalog`.
      - **Non-obiettivi:**
        - nessun `wiki reset`, perché la pagina non esiste ancora;
        - non toccare le altre pagine, che hanno un task ciascuna;
        - non modificare `docs/PRD.md`;
        - non segnare come `superseded` `decisions/work-admission-budget`, che è una decisione diversa.

      ## Steps
      1. Crea `docs/wiki/decisions/recoverable-file-batches.md` con questo frontmatter:
         - `type: decision`;
         - `title: Lotti di operazioni su file recuperabili con esiti dichiarati`;
         - `description:` una riga che nomina l'esito su ADR-007 (confermato o emendato), l'insieme di esiti risultante e la classificazione per ambito;
         - `decision_status: accepted`;
         - `status: generated`;
         - `sources:` con evidenza di repository reale:

           | Percorso | `role` |
           |---|---|
           | `Spikes/04-crash-recovery/RESULT.md` | `verification` |
           | il file di `Spikes/04-crash-recovery/measurements/` | `verification` |
           | `Spikes/04-crash-recovery/Sources/CrashKit/OutcomeClassifier.swift` | `implementation` |
           | `Spikes/04-crash-recovery/Sources/CrashKit/ErrorClassifier.swift` | `implementation` |

           `docs/PRD.md` non va citato come implementazione.
      2. Dopo il titolo, scrivi un paragrafo d'attribuzione: la fonte è `Spikes/04-crash-recovery/RESULT.md`, e ogni esito vale per la configurazione dichiarata in § *Configurazione* di quel documento, cioè volume APFS locale su immagine disco e arresto del processo per `SIGKILL`.
      3. Scrivi il corpo sotto i cinque marcatori obbligatori, nell'ordine del contratto, ciascuno con contenuto sostanziale.
         - **`<!-- archetipo:wiki section=context -->`** — le forze in gioco:
           - il filesystem non offre transazioni su più file;
           - ADR-007 era provvisorio (ADR-015);
           - la revisione 1.3 del PRD aveva sostituito «ripreso o compensato» con cinque esiti, senza alcuna misura;
           - «bloccato in attesa dell'utente» richiede che l'utente lo sappia.

           Se ADR-007 è **emendato**, la sezione dice esplicitamente che questa pagina **sostituisce** la formulazione di ADR-007 nel PRD 1.3 (`docs/PRD.md`, riga 530), e che il PRD non è stato modificato.
         - **`<!-- archetipo:wiki section=decision -->`** — la decisione **con i valori misurati** presi da `RESULT.md`:
           - l'insieme degli esiti adottato;
           - la tabella delle otto classi di errore, con l'ambito confermato o corretto;
           - le celle legittimamente bloccate, con la ragione;
           - le regole di riconoscimento: il disco prevale sul log, il Cestino si cerca per digest, una compensazione avviata non si rovescia, il volume si identifica dall'UUID;
           - gli scostamenti che una compensazione lascia e che vanno dichiarati all'utente.

           Riporta i fatti misurati, non descrizioni qualitative.
         - **`<!-- archetipo:wiki section=alternatives -->`** — almeno tre alternative reali, ciascuna con la prova dello scarto presa dalla misura o dalla sonda:
           - **lotto atomico:** non esiste una transazione su più file;
           - **esito binario «ripreso o compensato»:** citare le celle in cui nessuna delle due strade era percorribile;
           - **classificazione per errno:** `ENOENT` dopo l'espulsione del volume è identico a quello di un file scomparso;
           - **fidarsi del log per lo stato:** il nome con suffisso orario nel Cestino e il record troncato.
         - **`<!-- archetipo:wiki section=consequences -->`** — vantaggi, svantaggi e implicazioni operative per la Tappa 3:
           - ogni passo va progettato idempotente e osservabile dal disco;
           - il registro deve tollerare un record troncato;
           - gli esiti fanno parte dell'interfaccia;
           - gli scostamenti di una compensazione vanno dichiarati all'utente.

           Includi i **limiti di attribuzione**:
           - `SIGKILL` non equivale a una perdita di alimentazione;
           - è stato provato un solo tipo di volume;
           - il contratto di durabilità di `DurableState` (ADR-003) non è provato da questo cancello.
         - **`<!-- archetipo:wiki section=verification -->`** — cita `Spikes/04-crash-recovery/RESULT.md`, il file di `measurements/`, i comandi `crashbench run-matrix`, `run --crash-at` e `recover`, e le suite `RecoveryScenarioTests` e `ResultTraceabilityTests`.
      4. In fondo, aggiungi `## Concetti collegati` con questi collegamenti Markdown:
         - [Mappa dei contesti](/architecture/context-map.md);
         - [Sviluppo e operatività](/operations/development.md);
         - [PRD di iMAGE Surfer](/references/prd.md).
      5. Ricostruisci il catalogo con `archetipo wiki --project-root /Users/gia/iMAGE_Surfer catalog`. Non scrivere né riformattare `index.md` o `log.md` a mano.

      ## Verify
      - Esegui `archetipo wiki --project-root /Users/gia/iMAGE_Surfer validate`. Attesa: `ok: true`, 7 pagine, nessun rilievo `error`.
      - Esegui `archetipo wiki --project-root /Users/gia/iMAGE_Surfer status --require-generated decisions/recoverable-file-batches`. Attesa: stato 0.
      - Esegui `grep -c "archetipo:wiki section=" docs/wiki/decisions/recoverable-file-batches.md`. Attesa: `5`.
      - Esegui `grep -q "decision_status: accepted" docs/wiki/decisions/recoverable-file-batches.md && echo ok-status`. Attesa: `ok-status`.
      - Esegui `git diff --stat docs/wiki/index.md`. Attesa: `index.md` modificato dalla CLI, con una voce per la nuova pagina.

      ## Done
      - [ ] `docs/wiki/decisions/recoverable-file-batches.md` esiste con `type: decision`, `decision_status: accepted`, `status: generated` e i cinque marcatori, tutti con contenuto sostanziale.
