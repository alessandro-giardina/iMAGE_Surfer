          - modificando un byte di `IMG_0003.xmp` in una copia, `verifyFixtures` fallisca nominando quel file.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`. Gli avvisi del linker `search path ... not found` sono innocui.
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter FixtureTests`. Attesa: tutti verdi.
      - Esegui `swift run --package-path Spikes/04-crash-recovery crashbench verify-fixtures; echo "stato $?"`. Attesa: `stato 0`.
      - Esegui `git ls-files --others --exclude-standard Spikes/04-crash-recovery/fixtures | wc -l`. Attesa: `12`, cioè i file non sono ignorati.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Package.swift Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-1 — il pacchetto si costruisce senza dipendenze, e le fixture del lotto sono file versionabili e non ignorati: cinque coppie, `batch.json` e `MANIFEST.json`.
      - [ ] AC-1 — `verify-fixtures` e `FixtureTests` falliscono quando una fixture diverge dal manifest.
      - [ ] Nessuna diagnostica di compilatore e nessun rilievo di `swift format lint --strict` sui file creati.

      ## Blockers
      None.
