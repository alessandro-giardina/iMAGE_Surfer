      Una sola esecuzione di controlli dimostra:
      - che tutti e sette i criteri di accettazione hanno evidenza verde;
      - che il pacchetto non ha diagnostiche nuove;
      - che nessun file di Spike 01 o del PRD è cambiato;
      - che il percorso di `Dimostra` funziona sul binario reale;
      - che le cinque pagine Wiki richieste sono `generated` e la Wiki è valida.

      Solo dopo questi controlli e la verifica che ogni task sia `DONE`, la spec può andare in revisione.

      ## Read
      - Questo piano: § *Baseline*, cioè le soglie e i comandi già rossi o assenti, e § *Mappa delle evidenze di accettazione*.
      - `Spikes/04-crash-recovery/RESULT.md` e `PROCEDURE.md`.

      ## Change
      - Nessun file.
      - Se un controllo fallisce, il task resta `TODO`, e il difetto si corregge nel task che possiede il file, rieseguendone la verifica.
      - **Non-obiettivi:**
        - nessuna rigenerazione della misura;
        - nessuna invocazione di `xcodebuild` o `swiftlint`, assenti per baseline.

      ## Steps
      1. Esegui, nell'ordine, tutti i comandi di § *Verify*, da `/Users/gia/iMAGE_Surfer`.
      2. Se tutti danno l'atteso, marca **questo** task `DONE`, eseguendo da `/Users/gia/iMAGE_Surfer` `archetipo task done US-004 TASK-17`.
      3. Ricarica la spec: `archetipo spec show US-004`.
      4. Verifica che **nessun** task abbia `status: TODO`.
      5. Solo a quel punto chiedi la revisione con `archetipo spec review US-004`.

      ## Verify
      - **Build.** Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`, senza errori né avvisi del compilatore. Gli avvisi del linker `search path ... not found` sono preesistenti e innocui.
      - **Suite completa.** Esegui, con un timeout di almeno 900 s, `swift test --package-path Spikes/04-crash-recovery`. Attesa: tutte le suite verdi. Sono comprese `FixtureTests`, `WorkVolumeTests`, `SnapshotTests`, `IntentLogTests`, `StepTests`, `ErrorClassifierTests`, `CrashPointsTests`, `BatchExecutorTests`, `OutcomeClassifierTests`, `RecognizerTests`, `RecoveryScenarioTests`, `CrashbenchIntegrationTests` e `ResultTraceabilityTests`.
