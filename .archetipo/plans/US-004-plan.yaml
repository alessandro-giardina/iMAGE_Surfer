  - id: TASK-05
    title: Macchina a stati del lotto, classificatore degli esiti ed elenco enumerato dei 61 punti di interruzione con arresto per SIGKILL
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      `crashbench list-points` stampa i 61 punti di interruzione derivati dal piano. `crashbench run --crash-at <id>` esegue il lotto attraverso la macchina a stati e termina il processo con `SIGKILL` esattamente nel punto scelto. Senza `--crash-at` il lotto si chiude `completato`. Gli esiti sono decisi da un classificatore puro.

      ## Read
      - `Sources/CrashKit/BatchPlan.swift`, `IntentLog.swift`, `Steps.swift` (gancio `afterTempWritten`) e `ErrorClassifier.swift`.
      - Questo piano, § *Punti di interruzione*, § *Macchina a stati e passi idempotenti* e § *Classificatore degli esiti*.

      ## Change
      - File nuovi: `Sources/CrashKit/CrashPoints.swift`, `Sources/CrashKit/OutcomeClassifier.swift`, `Sources/CrashKit/BatchExecutor.swift`, `Tests/CrashKitTests/CrashPointsTests.swift`, `Tests/CrashKitTests/BatchExecutorTests.swift`.
      - `Sources/crashbench/main.swift`: aggiungi i sottocomandi `list-points` e `run`.
      - **Non-obiettivi:**
        - nessun recupero, che è TASK-06;
        - nessun `defer`, `catch` o `atexit` nell'esecutore che scriva sul log o sul disco: un arresto deve lasciare esattamente lo stato raggiunto.

      ## Steps
      1. Definisci `CrashPoint: Codable`, con i campi `id`, `phase` (`esecuzione`, `compensazione` o `doppio`) e `description`.
         - `CrashPoints.enumerate(plan)` ricava i punti dal piano, senza ID scritti a mano, in quest'ordine:
           1. `X00-plan-torn`, `X01-plan`, `X02-recheck`, `X03-prepare`;
           2. per ogni passo da `S01` a `S10`: `Sxx-a`, poi `Sxx-m` (solo se il passo è `copy`), poi `Sxx-b` e `Sxx-c`;
           3. `S05-torn`;
           4. per i passi da `S10` a `S01`, in ordine inverso: `Kxx-a` e `Kxx-b`; poi `K00-a` e `K00-b`;
           5. `D01` e `D02`.
         - Con la fixture il totale è 4 + 32 + 1 + 22 + 2 = **61**.
         - Esponi `CrashPoints.composite`, che descrive i doppi arresti:
           - `D01`: primo arresto a `S03-b`, secondo durante il recupero con strategia `resume` a `S08-b`;
           - `D02`: primo arresto a `S03-b`, secondo durante il recupero con strategia `compensate` a `K02-a`.
      2. Implementa `CrashInjector(target: String?, mode: .kill | .throwForTest, observer: ((String) -> Void)?)`.
         - `hit(_ id:)` chiama prima l'`observer`, se presente.
         - Se `id == target`:
           - in modalità `.kill` stampa `ARRESTO <id>: <descrizione>`, chiama `fflush(stdout)` e poi `kill(getpid(), SIGKILL)`;
           - in modalità `.throwForTest` lancia `SimulatedCrash(id)`.
         - Esponi `hitTorn(_ id:)`, che restituisce `true` se il punto chiesto è `X00-plan-torn` o `S05-torn` e coincide con `target`.
      3. Implementa `OutcomeClassifier.classify(_ input: OutcomeInput) -> Outcome`, una funzione pura.
         - `OutcomeInput` ha i campi `hasPlan`, `stepStates`, `direction`, `unresolvedSystemic: [ErrorClass]`, `localSkips: [ErrorClass]`, `unrecognized: [String]`, `unclassified: [String]` e `decision`.
           - `stepStates` è un dizionario `stepId` → stato. Lo stato vale `fatto`, `non-fatto`, `saltato(classe)`, `sospeso(classe)` oppure `non-riconoscibile(traccia)`.
           - `direction` vale `forward` oppure `compensate`.
           - `decision` vale `none`, `retry` oppure `abandon`.
         - `Outcome` ha i campi `kind` e `reason`, più `trace: [String]`. `kind` vale `completato`, `compensato`, `parzialmente-recuperato`, `bloccato`, `abbandonato` oppure `NON_SUPPORTABILE`. `reason` vale `stato-non-riconoscibile` oppure `nessun-esito-applicabile` quando `kind` è `NON_SUPPORTABILE`.
         - Le regole si applicano in ordine, e la prima che corrisponde vince:
           1. `!hasPlan` oppure zero passi → `NON_SUPPORTABILE`, motivo `nessun-esito-applicabile`, traccia `"log senza piano completo: per costruzione del log di intenti nessuna azione è stata eseguita"`.
           2. `unrecognized` oppure `unclassified` non vuoti → `NON_SUPPORTABILE`, motivo `stato-non-riconoscibile`, con quelle tracce.
           3. `decision == abandon` → `abbandonato`.
           4. `unresolvedSystemic` non vuoto → `bloccato`.
           5. `localSkips` non vuoto → `parzialmente-recuperato`.
           6. direzione `forward` e ogni passo `fatto` → `completato`.
           7. direzione `compensate` e ogni passo `non-fatto` → `compensato`.
           8. ogni altro caso → `NON_SUPPORTABILE`, motivo `nessun-esito-applicabile`, con lo stato dei passi come traccia.
         - Scrivi un commento sopra la funzione: `bloccato` nasce **solo** dalla regola 4, e nessuna regola riconduce uno stato non riconoscibile a `bloccato` (AC-7).
      4. Implementa `BatchExecutor.run(plan, volume, log, injector, undoAfter: Bool)`.
         1. **Piano.** Se `hitTorn("X00-plan-torn")`, chiama `appendTorn(.plan)` e poi `hit`. Altrimenti `append(.plan)`, poi `hit("X01-plan")`.
         2. **Ricontrollo.** Ogni passo deve risultare `.notDone` a `observe`, e `batchRoot` e le cartelle di destinazione esistenti devono essere scrivibili.
            - Se qualcosa diverge: `append(.recheck(ok: false, divergences))`, poi `append(.outcome("interrotto-prima-di-agire", …))`, e l'esecuzione termina senza toccare il disco. È FR-080, e **non** è uno dei cinque esiti.
            - Altrimenti: `append(.recheck(ok: true))`, poi `hit("X02-recheck")`.
         3. **Preparazione.** Crea le cartelle di `directoriesToCreate` assenti, poi `append(.prepare(created))` e `hit("X03-prepare")`.
         4. **Passi.** Per ogni passo, in ordine:
            1. `append(.stepIntent(id, .forward))`, poi `hit("Sxx-a")`;
            2. `execute`, con `afterTempWritten: { hit("Sxx-m") }` per i passi `copy`;
            3. `hit("Sxx-b")`;
            4. `append(.stepDone)`; per `S05`, se `hitTorn("S05-torn")`, usa invece `appendTorn` seguito da `hit`;
            5. `hit("Sxx-c")`.

            Se `execute` produce uno `StepFailure`, lo passa a `ErrorClassifier`:
            - un errore **locale** diventa `append(.stepFailed(…, classe, locale))`, e l'esecuzione prosegue;
            - un errore **sistemico** diventa `append(.stepFailed(…, sistemico))`, poi `append(.outcome(bloccato))`, e l'esecuzione si ferma: è la sospensione di FR-079;
            - un errore `nonClassificato` diventa `append(.stepFailed)`, poi `append(.outcome(NON_SUPPORTABILE))`, e l'esecuzione si ferma.
         5. **Esito.** `append(.outcome(OutcomeClassifier.classify(…)))`.
         6. **Annullamento, con `undoAfter`.** È l'annullamento dell'utente di FR-083. Solo se l'esito è `completato`:
            1. `append(.undoRequested)`;
            2. per ogni passo da `S10` a `S01`: `append(.stepIntent(id, .compensate))`, poi `hit("Kxx-a")`, poi `compensate`, poi `hit("Kxx-b")`, poi `append(.stepDone(id, .compensate))`;
            3. `hit("K00-a")`, poi `compensatePrepare`, poi `hit("K00-b")`;
            4. `append(.outcome(compensato))`.
      5. Aggiungi il sottocomando `list-points [--json]`: una riga per punto, nella forma `id<TAB>fase<TAB>descrizione`.
      6. Aggiungi il sottocomando `run [--crash-at <id>] [--data-dir <p>]`.
         1. Esige un volume montato; altrimenti stampa un errore che chiede `setup` ed esce con 2.
         2. Esegue `resetBatchFolder()` e salva `<data>/state/pre-snapshot.json`.
         3. Costruisce il piano.
         4. Per un punto `K*` attiva `undoAfter`.
         5. Per `D01` e `D02` usa come bersaglio il primo arresto (`S03-b`) e scrive `<data>/state/pending-second-crash.json` con il secondo punto e la strategia; il recupero di TASK-06 lo leggerà.
         6. Un ID sconosciuto produce l'elenco dei punti ed esce con 2.
         7. Alla fine stampa `ESITO <kind>`.
      7. Scrivi `CrashPointsTests`. Verifica che:
         - ci siano 61 punti, tutti con ID unico, nell'ordine dichiarato;
         - `Sxx-m` esista solo per `S07` e `S08`;
         - ogni descrizione sia non vuota;
         - `composite` contenga esattamente `D01` e `D02`.
      8. Scrivi `BatchExecutorTests`, con `@Suite(.serialized)`, `TestVolume` e un iniettore senza bersaglio dotato di `observer`.
         - **Esecuzione completa.** L'esito è `completato`, e il log contiene nell'ordine:
           1. `plan`, `recheck` e `prepare`;
           2. dieci coppie `step-intent` / `step-done`;
           3. `outcome`.
         - **L'intento precede l'azione.** L'`observer`, a ogni `Sxx-a`, cattura un'istantanea e verifica che il file del passo sia ancora in origine.
         - **Ricontrollo fallito.** `run` accetta un gancio di sola prova, `beforeRecheck: (() -> Void)?`, chiamato fra `X01-plan` e il ricontrollo. Se il gancio modifica un byte di `lotto/IMG_0002.jpg`, l'esito è `interrotto-prima-di-agire` e nessun file si è mosso.
         - **Annullamento.** Con `undoAfter` e senza arresto, l'esito finale è `compensato`.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter "CrashPointsTests|BatchExecutorTests"`. Attesa: tutti verdi.
      - Esegui `Spikes/04-crash-recovery/.build/debug/crashbench list-points | wc -l`. Attesa: `61`.
      - Esegui:

        ```sh
        B=Spikes/04-crash-recovery/.build/debug/crashbench
        $B setup; $B run --crash-at S03-b; echo "stato $?"; tail -1 Spikes/04-crash-recovery/.data/state/intent-log.jsonl; $B teardown
        ```

        Attesa:
        - viene stampato `ARRESTO S03-b: …`;
        - lo stato è `stato 137` (128+9; zsh può stampare `killed`);
        - l'ultima riga del log è lo `step-intent` di `S03`.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-1 — il meccanismo interrompe il processo per `SIGKILL` in ciascun punto dell'elenco enumerato: 61 punti derivati dal piano, stampati da `list-points`.
      - [ ] AC-1 — il log di intenti precede ogni azione, e un ricontrollo divergente interrompe prima di agire (FR-080).
      - [ ] AC-7 — il classificatore degli esiti implementa le otto regole nell'ordine dichiarato, e `bloccato` nasce solo dalla regola 4.

      ## Blockers
      None.
