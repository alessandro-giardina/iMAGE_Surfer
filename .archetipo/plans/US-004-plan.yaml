  - id: TASK-10
    title: Esecuzione completa della matrice, misura versionata, RESULT.md con l'esito su ADR-007 e PROCEDURE.md ripetibile
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      La matrice `full` è eseguita, e l'esecuzione scelta è versionata sotto `measurements/`. `RESULT.md` pubblica l'esito del cancello: una riga per punto, compensazioni, classi di errore, punti bloccati, separazioni, esiti non supportabili ed esito su ADR-007. Ogni sua cifra viene dal JSON versionato. `PROCEDURE.md` permette a un altro sviluppatore di ripetere tutto.

      ## Read
      - `Sources/CrashKit/MeasurementResult.swift`, lo schema del JSON.
      - `Spikes/01-scale-memory/RESULT.md` e `PROCEDURE.md`, per tono, struttura e il modo in cui ogni cifra rimanda a un `measurementId`.
      - `docs/PRD.md`: righe 530 (ADR-007), 688-695 (FR-077…FR-084), 638 (FR-053), 748-749 (NFR-A2, NFR-A3) e 784 (NFR-I8).
      - Questo piano, § *Limiti dichiarati*, § *Classificazione degli errori* e § *Classificatore degli esiti*.

      ## Change
      - File nuovi: `Spikes/04-crash-recovery/RESULT.md`, `Spikes/04-crash-recovery/PROCEDURE.md` ed esattamente **un** file `Spikes/04-crash-recovery/measurements/<measurementId>.json`.
      - `Spikes/04-crash-recovery/README.md`: aggiorna i rimandi.
      - **Non-obiettivi:**
        - nessuna modifica a `docs/PRD.md`: il testo di sostituzione di ADR-007 sta in `RESULT.md` e non si applica al PRD;
        - nessuna modifica alla macchina per «far chiudere» la tabella, salvo i difetti del passo 2.

      ## Steps
      1. Esegui `.build/debug/crashbench setup`, poi `.build/debug/crashbench run-matrix --profile full --repetitions 5`. Annota la durata. Poi esegui `teardown`.
      2. Tratta così le anomalie del riepilogo.
         - **`PUNTO_NON_RAGGIUNTO`** è un difetto del banco. Correggilo nel file responsabile, aggiungi un test in `CrashbenchIntegrationTests` che lo riproduca, e riesegui il passo 1.
         - **`RICONOSCIMENTO_ERRATO`** va guardato da vicino.
           - Se il riconoscitore contraddice una regola dichiarata in questo piano, è un difetto: aggiungi un caso in `RecognizerTests` che lo riproduca, correggi e riesegui.
           - Altrimenti è un **limite misurato**: non va corretto, va riportato in § *Esiti non supportabili*, con la traccia.
         - **`NON_SUPPORTABILE`** e le celle `nonDeterministic` **sono misure**: non si correggono, si riportano.
      3. Copia il JSON scelto da `runs/` a `measurements/`. È l'unico versionato; gli altri restano in `runs/`, che è ignorato.
      4. Scrivi `RESULT.md` con queste sezioni, in quest'ordine. I titoli sono fissi, perché TASK-11 li cerca.
         - **`# Cancello 4 — Iniezione di arresti su un lotto di operazioni su file`**, con un'introduzione di tre righe.
         - **`## Configurazione`.** Riporta:
           - `measurementId`;
           - l'host dal JSON: modello, versione e build di macOS, uid;
           - il volume: APFS su immagine ASIF da 64 MB;
           - il digest del manifest delle fixture;
           - il profilo e le ripetizioni;
           - la durata.
         - **`## Limiti dichiarati`.** Elenca:
           - `SIGKILL` non equivale a una perdita di alimentazione;
           - un solo volume APFS locale, perché le altre classi spettano al cancello n°2;
           - il log JSONL non è `DurableState`, quindi ADR-003 non è provato;
           - `ctime` e `atime` sono esclusi;
           - il doppio arresto è coperto solo da `D01` e `D02`;
           - il lotto è unico, con 5 operazioni e 10 passi;
           - il Cestino è per uid.
         - **`## Punti di interruzione`** (AC-2). Una tabella con intestazione:

           `| Punto | Fase | Esito ripresa | Esito compensazione | Ripetizioni | Stato dopo ripresa | Stato dopo compensazione |`

           - Una riga per ciascuno dei 61 punti, nell'ordine di `list-points`.
           - Un esito si scrive come `completato (5/5)`. Più esiti si separano con `; `, per esempio `completato (4/5); NON_SUPPORTABILE (1/5)`.
           - Si scrive `—` dove la strategia non si applica: punti `K*` e `D02` per la ripresa, `D01` per la compensazione.
           - Lo stato di una coppia si scrive `OPn i:<pos> s:<pos>`, con le coppie separate da spazio, e `<pos>` uno fra `orig`, `dest`, `cest`, `ass` e `amb`.
           - Sotto la tabella, la legenda.
         - **`## Compensazione`** (AC-3). Una tabella con intestazione:

           `| Cella | Esito | Coincide con lo stato iniziale | Scostamenti su file | Scostamenti mtime di directory |`

           - Una riga per **ogni** cella con `compensation.attempted`.
           - «Coincide» vale `sì` oppure `no`.
           - Gli scostamenti si scrivono `percorso:campo`, separati da `, `; `nessuno` se l'elenco è vuoto.
           - Sotto la tabella, un paragrafo che **nomina** gli scostamenti ricorrenti e la loro causa (per esempio `.DS_Store` nel Cestino, `mtime` delle directory, copia nel Cestino dopo la compensazione di `OP4`), invece di riportare un esito complessivo.
         - **`## Classi di errore`** (AC-4). Una tabella con intestazione:

           `| Classe | Ambito adottato | Errore osservato | Celle provate | Esiti | Classificazione confermata |`

           - Otto righe.
           - «Errore osservato» riporta l'errno, l'errore Cocoa oppure `non applicabile`.
           - «Classificazione confermata» vale `sì` oppure `no — <motivo>`.
           - Sotto la tabella, la distinzione fra errore locale ed errore sistemico, motivata dalle celle.
         - **`## Punti bloccati in attesa dell'utente`** (AC-4). Una tabella con intestazione:

           `| Cella | Classe | Ambito | Ragione | Esito dopo retry | Esito dopo abandon |`

           - Una riga per **ogni** cella con esito `bloccato`.
           - La ragione è una frase che spiega perché l'intervento umano è legittimo, per esempio «il volume non c'è: né riprendere né compensare è possibile senza di esso».
         - **`## Separazione di immagine e sidecar`** (AC-5). Una tabella con intestazione:

           `| Cella | Coppie separate all'arresto | Rilevata dal recupero | Cosa riferisce | Separazioni residue |`

           Una riga per ogni cella con `separationsAtCrash` non vuoto.
         - **`## Esiti non supportabili`** (AC-7). Una tabella con intestazione:

           `| Cella | Motivo | Traccia |`

           - Una riga per **ogni** cella con almeno una ripetizione `NON_SUPPORTABILE`, e per ogni cella `RICONOSCIMENTO_ERRATO`.
           - Sotto la tabella, la frase esplicita che nessuna di queste celle è stata riclassificata come «bloccato in attesa dell'utente».
         - **`## Esito su ADR-007`** (AC-6).
           - Una riga `ADR-007: **confermato**` oppure `ADR-007: **emendato**`, con **uno e un solo** marcatore.
           - Se emendato, una sottosezione `### Testo di sostituzione` con il testo proposto.
           - Se i cinque esiti non reggono, una sottosezione `### Insieme di esiti sostitutivo` che cita gli ID di cella che lo motivano. Per esempio, il caso di `X00-plan-torn` (`nessun-esito-applicabile`) e l'esito `interrotto-prima-di-agire` di FR-080, che non è fra i cinque.
           - Una frase per ciascuna delle domande del cancello nel PRD (riga 293): quale esito si raggiunge da ogni punto, se la compensazione è corretta, e quali casi finiscono legittimamente in «bloccato».
         - **`## Conseguenze per la costruzione`.** Che cosa la Tappa 3 deve ereditare. Per esempio:
           - la classificazione per ambito;
           - il Cestino cercato per digest;
           - la direzione di una compensazione avviata;
           - gli scostamenti da dichiarare all'utente;
           - l'eventuale esito aggiuntivo.

         **Regole di scrittura:**
         - ogni esito, conteggio e scostamento viene dal JSON versionato;
         - nessun «garantito»: vale il vocabolario del PRD, **recuperabile** e non atomico;
         - nessun giudizio senza la cella che lo sostiene.
      5. Scrivi `PROCEDURE.md`, rivolto a un altro sviluppatore. Contiene:
         - **i prerequisiti:** macOS 15 o successivo su Apple Silicon, toolchain Swift 6 dei Command Line Tools, `diskutil image`, circa 100 MB liberi; nessun `sudo`;
         - **la build:** `swift build --package-path Spikes/04-crash-recovery`;
         - **la dimostrazione manuale di un punto**, nella sequenza:
           1. `setup`;
           2. `list-points`;
           3. `run --crash-at <id>`, osservando `zsh: killed`;
           4. `status`;
           5. `recover --strategy resume|compensate`;
           6. il ciclo `perturb`, `recover`, `decide retry|abandon`, `unperturb`;
         - **la matrice completa**, con la durata attesa;
         - **la chiusura:** `teardown`, e la pulizia con `rm -rf Spikes/04-crash-recovery/.data`;
         - **la nota sul Cestino:** il Cestino dell'utente non viene toccato, perché il Cestino usato è quello del volume di lavoro.

         Usa il binario `.build/debug/crashbench` e non `swift run`, perché preserva lo stato 137 dell'arresto.
      6. Aggiorna `README.md` con i rimandi a `PROCEDURE.md`, `RESULT.md` e `measurements/`.

      ## Verify
      - Esegui `git ls-files --others --exclude-standard Spikes/04-crash-recovery/measurements | wc -l`. Attesa: `1`.
      - Esegui `grep -cE "ADR-007: \*\*(confermato|emendato)\*\*" Spikes/04-crash-recovery/RESULT.md`. Attesa: `1`.
      - Esegui `for s in Configurazione "Limiti dichiarati" "Punti di interruzione" Compensazione "Classi di errore" "Punti bloccati" "Separazione di immagine" "Esiti non supportabili" "Esito su ADR-007" "Conseguenze per la costruzione"; do grep -q "^## $s" Spikes/04-crash-recovery/RESULT.md || echo "manca $s"; done`. Attesa: nessun output.
      - Esegui `git status --porcelain -- docs/PRD.md`. Attesa: nessun output.
      - Esegui `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0`.

      La verifica completa della corrispondenza fra documento e JSON è TASK-11.

      ## Done
      - [ ] AC-2 — § *Punti di interruzione* ha una riga per ciascuno dei 61 punti, con l'esito per strategia, le ripetizioni e lo stato di immagine e sidecar.
      - [ ] AC-3 — § *Compensazione* dichiara per ogni cella compensata se lo stato coincide con quello di partenza, e nomina ogni scostamento.
      - [ ] AC-4 — § *Classi di errore* riporta l'ambito adottato per le otto classi e se ha retto; § *Punti bloccati in attesa dell'utente* nomina ogni cella bloccata con la ragione, distinguendo locale e sistemico.
      - [ ] AC-5 — § *Separazione di immagine e sidecar* riporta se il recupero rileva la separazione e cosa riferisce.
      - [ ] AC-6 — § *Esito su ADR-007* ha un solo marcatore. Se emendato, ha il testo di sostituzione, ed eventualmente l'insieme di esiti sostitutivo con le celle che lo motivano.
      - [ ] AC-7 — § *Esiti non supportabili* elenca ogni cella `NON_SUPPORTABILE` o `RICONOSCIMENTO_ERRATO` con la traccia, e nessuna è riclassificata come bloccata.
      - [ ] `PROCEDURE.md` è eseguibile da un altro sviluppatore senza `sudo`, e la misura versionata è una sola.

      ## Blockers
      None.
