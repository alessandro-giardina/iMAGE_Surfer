  - id: TASK-02
    title: Volume di lavoro su immagine disco APFS e istantanea confrontabile campo per campo
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il banco crea, monta e smonta senza privilegi un volume APFS dedicato. Vi ripristina la cartella di prova dalle fixture e cattura un'istantanea della cartella e del Cestino del volume. Il confronto fra due istantanee nomina ogni scostamento per percorso e per campo.

      ## Read
      - Questo piano, § *Baseline*: le righe `diskutil image` e `FileManager.trashItem` riportano comandi, tempi, posizione `.Trashes/502`, `.DS_Store` nel Cestino e `.Trashes` non elencabile.
      - `Spikes/04-crash-recovery/Sources/CrashKit/CrashPaths.swift` e `Fixtures.swift`, prodotti da TASK-01.

      ## Change
      - File nuovi: `Sources/CrashKit/WorkVolume.swift`, `Sources/CrashKit/Snapshot.swift`, `Tests/CrashKitTests/WorkVolumeTests.swift`, `Tests/CrashKitTests/SnapshotTests.swift`.
      - `Sources/crashbench/main.swift`: aggiungi i sottocomandi `setup`, `teardown`, `reset`, `snapshot` e l'opzione globale `--data-dir <percorso>`.
      - `Tests/CrashKitTests/TestSupport.swift`: aggiungi l'helper `TestVolume`.
      - **Non-obiettivi:**
        - nessun uso di `hdiutil`, deprecato;
        - nessun uso di `sudo` o di `mdutil`;
        - nessuna chiamata a `trashItem` in `SnapshotTests`;
        - nessuna rimozione al di fuori della directory dati o del volume montato.

      ## Steps
      1. Implementa `WorkVolume(dataDirectory: URL = CrashPaths.defaultDataDirectory)`. Tutto il suo stato sta sotto `dataDirectory`: `work.asif`, `mnt/` e `state/`.
         - **`ensureImage()`:** se `work.asif` manca, esegue `diskutil image create blank --format ASIF --size 64m --volumeName CrashBench --fs APFS <data>/work.asif`.
         - **`attach()`:** è idempotente. Se `isMounted` è vero non fa nulla; altrimenti crea `mnt/` ed esegue `diskutil image attach --nobrowse --mountPoint <data>/mnt <data>/work.asif`.
         - **`eject()`:** se `isMounted` è vero esegue `diskutil eject <data>/mnt`; altrimenti non fa nulla.
         - **`volumeUUID(of:)`:** restituisce `URLResourceValues.volumeUUIDString` del percorso.
         - **`isMounted`:** è vero se l'UUID di `mnt` è diverso dall'UUID di `dataDirectory`.
         - **Percorsi del volume:**
           - `batchRoot` è `<mnt>/lotto`;
           - `quarantine` è `<mnt>/.quarantena`: sta sullo stesso volume, così spostare un file in quarantena e riportarlo conserva l'inode;
           - `trashDirectory` è `<mnt>/.Trashes/<getuid()>`.
         - **`resetBatchFolder()`:**
           - fallisce con un errore esplicito se il volume non è montato, senza toccare nulla;
           - altrimenti rimuove `batchRoot`, il contenuto di `trashDirectory` (se esiste), `quarantine` e `<data>/state/*`;
           - ricrea `batchRoot` copiando `fixtures/folder/*` con `copyfile(..., COPYFILE_ALL)`, e crea `quarantine` e `state/`.
         - **Errori di `diskutil`:** un `Process` che esce con stato diverso da 0 produce un errore che include stdout e stderr.
      2. Implementa `Snapshot.capture(roots: [String: URL])` e la scorciatoia `capture(volume:)`, che equivale a `["lotto": batchRoot, "@cestino": trashDirectory]`.
         - **Cosa registra.** Per ogni voce, in modo ricorsivo:
           - percorso relativo prefissato dalla chiave;
           - tipo (`file` o `directory`);
           - `size`;
           - `sha256`, solo per i file;
           - `mode` (`st_mode`) e `flags` (`st_flags`);
           - `mtime` e `birthtime` in nanosecondi;
           - `inode`;
           - `xattrs`, un dizionario nome → SHA-256 del valore.
         - **Campi esclusi, con un commento che lo dichiara:** `st_atime` e `st_ctime`. `ctime` cambia a ogni rinomina per costruzione.
         - **`.DS_Store` non è escluso.** La baseline mostra che il Cestino ne crea uno, ed è uno scostamento da riportare.
         - La radice di una chiave assente produce zero voci, non un errore.
      3. Implementa `Snapshot.diff(_ before:, _ after:) -> [Deviation]`.
         - `Deviation` ha i campi `path`, `field`, `before`, `after`.
         - `field` è uno fra `aggiunto`, `rimosso`, `size`, `sha256`, `mode`, `flags`, `mtime`, `birthtime`, `inode`, `xattr`.
         - L'elenco è ordinato per percorso e per campo, ed è vuoto se le istantanee sono uguali.
         - Aggiungi `Deviation.isDirectoryMtime`, vero per uno scostamento `mtime` su una voce di tipo `directory`.
      4. Aggiungi i sottocomandi. Tutti accettano `--data-dir`, che vale per default `CrashPaths.defaultDataDirectory`.
         - `setup` esegue `ensureImage`, `attach` e `resetBatchFolder`, poi stampa il punto di montaggio e l'UUID.
         - `teardown` esegue `eject`.
         - `reset` esegue `resetBatchFolder`.
         - `snapshot --out <file>` scrive il JSON con chiavi ordinate.
      5. Aggiungi a `TestSupport` l'helper `TestVolume(name:)`. Crea `CrashPaths.defaultDataDirectory/tests/<name>-<UUID>`, poi esegue `ensureImage`, `attach` e `resetBatchFolder`. Espone `close()`, che esegue `eject` e rimuove la directory. Ogni test che lo usa chiama `defer { volume.close() }`.
      6. Scrivi `WorkVolumeTests`, con `@Suite(.serialized)`. Verifica che:
         - dopo l'apertura `isMounted` sia vero, e l'UUID di `mnt` sia diverso da quello dell'ospite;
         - `batchRoot` contenga esattamente i 10 file della fixture, con i digest del manifest;
         - `trashItem` su `lotto/IMG_0005.jpg` produca un percorso sotto `trashDirectory`;
         - dopo `eject`, `isMounted` sia falso e `mnt` sia una directory del volume ospite;
         - `resetBatchFolder` con il volume smontato lanci un errore e non crei `lotto` sull'ospite.
      7. Scrivi `SnapshotTests`, su una directory temporanea del volume ospite e senza Cestino. Verifica che:
         - due catture senza modifiche diano un diff vuoto;
         - una rinomina dia `rimosso` più `aggiunto`, con lo stesso `inode` e lo stesso `sha256`;
         - `utimensat` sul file dia solo `mtime`;
         - `chmod` dia solo `mode`;
         - `setxattr` dia solo `xattr`;
         - un byte modificato dia `sha256`, `size` o `mtime` sul file, più `mtime` della directory se cambia.

      ## Verify
      - Esegui `swift build --package-path Spikes/04-crash-recovery`. Attesa: `Build complete!`.
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter "WorkVolumeTests|SnapshotTests"`. Attesa: tutti verdi.
      - Esegui:

        ```sh
        B=Spikes/04-crash-recovery/.build/debug/crashbench
        $B setup && ls Spikes/04-crash-recovery/.data/mnt/lotto | wc -l && $B teardown
        ```

        Attesa: `10`, e un'espulsione senza errori.
      - Esegui `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0` dopo `teardown` e dopo i test, cioè nessun volume rimasto montato.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-1 — il volume di lavoro si ricrea da zero senza privilegi, e la cartella di prova si ripristina a ogni esecuzione dalle fixture versionate.
      - [ ] AC-3, AC-5 — l'istantanea registra posizione, contenuto e metadati di ogni file della cartella e del Cestino del volume, e il confronto nomina ogni scostamento per campo. `atime` e `ctime` sono esclusi in modo dichiarato.
      - [ ] Il Cestino dell'utente non viene mai toccato. Nessun test lascia volumi montati.

      ## Blockers
      None.
