  ---

  ## Mappa delle evidenze di accettazione

  L'evidenza finale di questo cancello è in parte un documento. Il rischio è doppio:

  - un documento può *affermare* un esito che nessuna esecuzione ha prodotto;
  - una macchina può *dichiarare* un esito che il disco smentisce.

  Due oracoli rispondono a questi rischi:

  - la **tracciabilità eseguibile**: ogni riga di `RESULT.md` deve trovare la sua cella nel JSON versionato, in entrambe le direzioni;
  - l'**istantanea del banco** come verità indipendente dalla macchina sotto test.

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Repository senza `Spikes/04-crash-recovery/` | Unità e integrazione sul binario reale | <ul><li>`crashbench verify-fixtures` esce con 0 e fallisce se un byte di una fixture cambia.</li><li>`crashbench list-points` stampa 61 punti, derivati dal piano.</li><li>Per i punti campione, `run --crash-at <id>` termina con `uncaughtSignal` 9 osservato dal padre e stampa `ARRESTO <id>`.</li><li>Il log mostra ogni `step-intent` prima della modifica corrispondente sul disco.</li><li>`git check-ignore` esclude `.data` e `runs`, mentre `fixtures/` è versionato.</li></ul> | TASK-01, TASK-03, TASK-05; verificato da TASK-09 e TASK-17 |
  | AC-2 | Fixture ripristinata su volume dedicato | Integrazione (matrice) e tracciabilità | <ul><li>La tabella § *Punti di interruzione* ha esattamente i 61 ID dell'elenco enumerato.</li><li>Per ogni riga, l'esito con i conteggi, le ripetizioni (5) e le posizioni di immagine e sidecar coincidono con le celle del JSON in `measurements/`.</li><li>Le posizioni del JSON vengono dall'istantanea dopo il recupero.</li><li>Ognuno dei cinque esiti è raggiunto almeno in uno scenario di `RecoveryScenarioTests`, con l'asserzione sull'istantanea e non sulla sola riga stampata.</li></ul> | TASK-06, TASK-08, TASK-10; verificato da TASK-07, TASK-09, TASK-11 |
  | AC-3 | Istantanea presa prima dell'avvio del lotto | Integrazione (matrice) e tracciabilità | <ul><li>Ogni cella con compensazione tentata ha una riga in § *Compensazione*.</li><li>«Coincide» vale `sì` se e solo se `Snapshot.diff(pre, post)` è vuoto.</li><li>Ogni scostamento del JSON compare nella riga con percorso e campo.</li></ul> | TASK-02, TASK-06, TASK-08, TASK-10; verificato da TASK-07 e TASK-11 |
  | AC-4 | Perturbazioni applicate fra arresto e recupero | Integrazione (classificatore su errori reali) e tracciabilità | <ul><li>`ErrorClassifierTests` produce ogni classe da un errore reale: `ENOENT` con volume montato dà `L-missing`, `ENOENT` dopo `eject` dà `G-volume-missing`.</li><li>§ *Classi di errore* ha 8 righe con l'ambito uguale a `ErrorClass.scope`.</li><li>Le righe di § *Punti bloccati in attesa dell'utente* coincidono con le celle `bloccato` del JSON, ciascuna con ragione, ambito ed esiti di `retry` e `abandon`.</li></ul> | TASK-04, TASK-08, TASK-10; verificato da TASK-07 e TASK-11 |
  | AC-5 | Arresti fra il passo dell'immagine e quello del sidecar | Integrazione e tracciabilità | <ul><li>Le separazioni all'arresto sono calcolate **dall'istantanea**, non dal riconoscitore, e confrontate con `SEPARAZIONI-ALL-AVVIO` stampato dal recupero.</li><li>Le righe di § *Separazione di immagine e sidecar* coincidono con le celle che hanno separazioni all'arresto, con «Rilevata» uguale a `separationDetected`.</li><li>Il caso `S03-c` (immagine di OP2 spostata, sidecar no) è verificato sul binario reale.</li></ul> | TASK-06, TASK-08, TASK-10; verificato da TASK-07, TASK-09, TASK-11 |
  | AC-6 | `RESULT.md` già redatto | Ispezione documentale con controllo eseguibile | <ul><li>§ *Esito su ADR-007* contiene **uno e un solo** marcatore fra `**confermato**` ed `**emendato**`.</li><li>Se emendato, contiene il testo di sostituzione.</li><li>Se il JSON ha celle `nessun-esito-applicabile`, la sezione ne cita almeno una come traccia dell'insieme sostitutivo proposto.</li></ul> | TASK-10; verificato da TASK-11 |
  | AC-7 | Stati non riconoscibili costruiti, e celle reali della matrice | Unità (classificatore) e tracciabilità | <ul><li>`OutcomeClassifierTests`: uno stato non riconoscibile anche in presenza di un errore sistemico dà `NON_SUPPORTABILE`, mai `bloccato`.</li><li>Le righe di § *Esiti non supportabili* coincidono con le celle `NON_SUPPORTABILE` del JSON, con motivo e traccia.</li><li>Simmetria: nessuna cella `NON_SUPPORTABILE` compare fra i punti bloccati.</li></ul> | TASK-06, TASK-10; verificato da TASK-07 e TASK-11 |

  **Nessun oracolo è nascosto da un test double.** Il banco usa il filesystem reale, il Cestino reale del volume di lavoro, un volume che si smonta davvero e un `SIGKILL` reale. L'unico sostituto è l'iniettore di prova di `RecoveryScenarioTests`, e serve a non uccidere il processo di test:

  - invece del segnale, lancia un errore `SimulatedCrash`;
  - l'esecutore non ha `defer` né `catch` che scrivano sul log o sul disco, quindi il comportamento osservabile è lo stesso;
  - l'arresto reale è comunque provato sul binario in TASK-09.

  Il componente responsabile di un criterio non viene mai sostituito.

  ---

  ## Strategia di test

  Il banco è uno strumento di verifica. Uno strumento sbagliato produce esiti plausibili e falsi, che poi chiudono un ADR. La strategia mette quindi sotto test **lo strumento**, e non solo il suo prodotto.

  - **Unità (Swift Testing).**
    - **Log di intenti:** round trip di ogni tipo di record; record troncato riconosciuto, conservato e riparato; riga corrotta in mezzo che dà errore.
    - **Istantanea:** un diff per campo da mutazioni note.
    - **Classificatore degli esiti:** una riga per regola, più i casi di precedenza.
    - **Elenco dei punti:** 61 ID unici, nell'ordine dichiarato.
  - **Integrazione sul volume dedicato.** Ogni suite che monta un volume usa una propria directory dati, `.data/tests/<suite>-<UUID>`, ed è `@Suite(.serialized)`. L'espulsione è garantita con `defer`.
    - **Idempotenza:** ogni passo eseguito o compensato due volte non cambia l'istantanea.
    - **Classificazione:** ogni classe di errore viene prodotta da un errore reale.
    - **Esiti:** ognuno dei cinque esiti, più i due motivi di `NON_SUPPORTABILE`, è raggiunto da uno scenario e asserito sull'istantanea.
  - **Integrazione sul binario reale.** L'arresto per `SIGKILL` è osservato da un processo padre. Il recupero gira in un nuovo processo, e il suo output ha un formato fisso. La matrice `smoke` produce un JSON conforme allo schema, con le ripetizioni richieste e nessuna cella `PUNTO_NON_RAGGIUNTO`.
  - **Tracciabilità del documento.** `ResultTraceabilityTests` confronta ogni sezione di `RESULT.md` con il JSON versionato, in entrambe le direzioni, inclusa la simmetria di AC-7. Un caso di controllo altera in memoria una riga e pretende che il confronto la rilevi: un oracolo che non può fallire non dimostra niente.
  - **Ripetibilità dichiarata.** La matrice `full` ripete ogni cella 5 volte. Le ripetizioni discordanti non vengono mediate: la cella è marcata `nonDeterministica` e `RESULT.md` la riporta come tale.
  - **Durata.** La matrice `full` si esegue a mano in TASK-10. La suite di test usa solo il profilo `smoke`. Ogni comando `swift test` del piano ha un timeout esplicito di almeno 600 s.

  **Nessuna pipeline di integrazione continua.** Portare i test di iniezione di arresti in CI a ogni push è esplicitamente fuori ambito, e appartiene alla Tappa 3.

  ### Rinuncia ai test end-to-end di browser

  **Motivo:** non applicabile per natura. iMAGE Surfer è un'applicazione nativa macOS, e questo cancello non produce alcuna superficie di prodotto: niente rotte, niente browser, niente sessione utente. Nemmeno XCUITest è in gioco: non c'è interfaccia, e `xcodebuild` non è disponibile.

  **Livello di evidenza usato al suo posto:** l'integrazione sul binario reale (TASK-09) e la matrice in processi figli (TASK-08). Ogni AC ha il proprio oracolo in quella catena, e nessuno dipende dall'ispezione visiva.

  **Filmabilità.** Il percorso di `Dimostra` è filmabile come sessione di terminale:

  1. `crashbench run --crash-at <id>`, con il processo che muore (`zsh: killed`);
  2. `crashbench recover`, con l'esito e le posizioni a schermo;
  3. l'apertura di `RESULT.md`.

  La configurazione ha `e2e.record_demo_video: false`. La decisione di registrare o saltare spetta ad `archetipo-review`.

  **Nessun mockup:** nessuna superficie visibile all'utente.

  ---

  ## Impatto sulla Wiki

  ```yaml
  wiki_impact:
    read: [references/prd]
    update: [overview, engineering/code-map, operations/development, architecture/context-map]
    create: [decisions/recoverable-file-batches]
