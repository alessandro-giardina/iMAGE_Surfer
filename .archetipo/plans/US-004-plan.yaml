  - id: TASK-07
    title: Oracoli del riconoscimento e degli esiti - cinque esiti raggiunti e asseriti sull'istantanea, separazioni, e stato non riconoscibile mai bloccato
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Una suite dimostra quattro cose:
      - ciascuno dei cinque esiti, e ciascuno dei due motivi di `NON_SUPPORTABILE`, è raggiungibile;
      - l'esito dichiarato coincide con l'istantanea del disco;
      - la compensazione si confronta campo per campo con lo stato di partenza;
      - le separazioni vengono rilevate, e uno stato non riconoscibile non diventa mai `bloccato`.

      ## Read
      - `Sources/CrashKit/OutcomeClassifier.swift`: le otto regole e il loro ordine.
      - `Sources/CrashKit/Recognizer.swift` e `Recovery.swift`.
      - `Sources/CrashKit/Perturbations.swift`: `apply`, `remove`, la regola del bersaglio.
      - `Sources/CrashKit/Snapshot.swift`: `diff`, `isDirectoryMtime`.
      - `Sources/CrashKit/CrashPoints.swift`: `CrashInjector` in modalità `.throwForTest`.

      ## Change
      - File nuovi: `Tests/CrashKitTests/OutcomeClassifierTests.swift`, `Tests/CrashKitTests/RecognizerTests.swift`, `Tests/CrashKitTests/RecoveryScenarioTests.swift`.
      - Correzioni ai sorgenti **ammesse solo** in `Recognizer.swift`, `Recovery.swift` e `OutcomeClassifier.swift`, e solo quando un test di questo task mostra che il codice viola una regola **dichiarata in questo piano**. Ogni correzione va motivata nel messaggio di commit.
      - **Non-obiettivi:** non si cambiano le regole per far passare un test, e non si indeboliscono le asserzioni sull'istantanea.

      ## Steps
      1. Scrivi `OutcomeClassifierTests`, con test parametrici `@Test(arguments:)` su `OutcomeInput` costruiti a mano.
         - Una riga per ciascuna delle regole da 1 a 8, con l'esito atteso.
         - Più quattro casi di precedenza:
           - un passo `non-riconoscibile` **e** un errore sistemico presente danno `NON_SUPPORTABILE` (regola 2), **non** `bloccato`;
           - `decision == abandon` con un passo `non-riconoscibile` dà `NON_SUPPORTABILE`;
           - zero passi dà la regola 1;
           - direzione `compensate` con un passo ancora `fatto` e nessun errore dà la regola 8.
         - Un test di proprietà enumera tutte le combinazioni di `unrecognized` vuoto o non vuoto, `unresolvedSystemic` vuoto o non vuoto, e `decision`. Verifica che `kind == bloccato` implichi sempre `unrecognized` e `unclassified` vuoti.
      2. Scrivi `RecognizerTests`, con `@Suite(.serialized)` e `TestVolume`. Ogni stato è costruito eseguendo `BatchExecutor` con un iniettore `.throwForTest` e poi modificando il disco a mano.
         - **Il disco prevale sul log.** Arresto a `S03-b`, cioè azione eseguita e fatto non registrato: il passo è `fatto`, e compare una `DIVERGENZA` fra log e disco.
         - **File in due posizioni.** Arresto a `S03-c`, poi copia manuale di `selezione/IMG_0002.jpg` in `lotto/IMG_0002.jpg`. Il file ha lo stesso digest in origine e in destinazione, quindi `S03` è `non-riconoscibile`, con una traccia che contiene entrambe le posizioni.
         - **Collisione nel Cestino.** Arresto a `S09-b`, con una voce `IMG_0005.jpg` di contenuto diverso già presente nel Cestino prima del lotto: `S09` è `fatto`, e la voce trovata è quella con il digest giusto, il cui nome porta il suffisso orario.
         - **Due voci con lo stesso digest.** Una copia manuale della voce nel Cestino rende `S09` `non-riconoscibile`.
         - **Separazione.** Arresto a `S03-c` dà `COPPIA OP2 immagine=dest sidecar=orig SEPARATA`.
         - **Record troncato.** L'arresto a `X00-plan-torn` lascia un log senza piano completo: `recordTroncato` è vero, il frammento è salvato in `state/torn-*.txt` e lo stato è `noPlan`.
      3. Scrivi `RecoveryScenarioTests`, con `@Suite(.serialized)` e `TestVolume`, interamente in-process con `.throwForTest`.
         - **Struttura di ogni scenario.**
           1. Prende un'istantanea `pre` prima del lotto e una `post` dopo il recupero.
           2. Asserisce l'esito **e** l'istantanea. L'istantanea è l'oracolo; la riga `ESITO` è l'affermazione da verificare.
         - **Gli scenari.**

           | Esito atteso | Arresto | Azioni dopo l'arresto | Asserzioni sull'istantanea `post` |
           |---|---|---|---|
           | `completato` | `S04-b` | `resume` | percorsi e digest uguali allo stato atteso del lotto completato, calcolato applicando il piano a `pre`; `OP4` presente sia in origine sia in `consegna/` |
           | `compensato` | `S04-b` | `compensate` | `diff(pre, post)` non contiene scostamenti su file (`sha256`, `inode`, `size`, `mode`, `flags`, `xattr`, `aggiunto`, `rimosso`); `selezione/` è stata rimossa, perché creata dal lotto e vuota; gli scostamenti `isDirectoryMtime` sono ammessi e stampati |
           | `parzialmente-recuperato` | `S06-b` | perturbazione `L-locked`, che per la regola del bersaglio colpisce `S09`; poi `resume` | `S07`, `S08` e `S10` fatti; `S09` saltato con `L-locked`, locale; `COPPIA OP5 … SEPARATA`, con l'immagine in origine e il sidecar nel Cestino |
           | `bloccato` | `S06-b` | perturbazione `G-folder-readonly`; poi `resume` | `post` uguale all'istantanea presa subito dopo la perturbazione: dopo la sospensione nessun file si è mosso. Poi `remove` e `decide retry` danno `completato` |
           | `abbandonato` | `S06-b` | perturbazione `G-volume-missing`; `resume` dà `bloccato`; poi `decide abandon` | nessun file si è mosso; dopo `remove`, le righe `COPPIA` stampate coincidono con le posizioni dell'istantanea |
           | `NON_SUPPORTABILE`, motivo `stato-non-riconoscibile` | `S03-c` | copia manuale dell'immagine in origine; poi `resume` | l'esito **non è** `bloccato`, e la traccia contiene le due posizioni |
           | `NON_SUPPORTABILE`, motivo `nessun-esito-applicabile` | `X00-plan-torn` | `resume` | `diff(pre, post)` vuoto sui file |

         - **Il caso del piano troncato.** Lo stato è riconoscibile e coincide con quello di partenza, ma nessuno dei cinque esiti lo descrive. Il test fissa il comportamento dichiarato; l'interpretazione per ADR-007 spetta a TASK-10.
      4. Per ogni scenario, quando l'asserzione fallisce, stampa l'elenco completo degli scostamenti: deve essere diagnosticabile senza rieseguire.

      ## Verify
      - Esegui, con timeout 600 s, `swift test --package-path Spikes/04-crash-recovery --filter "OutcomeClassifierTests|RecognizerTests|RecoveryScenarioTests"`. Attesa: tutti verdi.
      - Esegui, con timeout 900 s, `swift test --package-path Spikes/04-crash-recovery`. Attesa: l'intera suite è verde, senza regressioni nelle suite dei task precedenti.
      - Esegui `mount | grep -c "04-crash-recovery/.data"`. Attesa: `0`.
      - Esegui `swift format lint --strict --recursive Spikes/04-crash-recovery/Sources Spikes/04-crash-recovery/Tests`. Attesa: stato 0.

      ## Done
      - [ ] AC-2 — ciascuno dei cinque esiti è raggiunto da uno scenario, ed è asserito sull'istantanea del disco, non sulla sola riga stampata.
      - [ ] AC-3 — la compensazione è confrontata campo per campo con l'istantanea precedente all'avvio del lotto, e gli scostamenti ammessi sono solo `mtime` di directory, stampati.
      - [ ] AC-4 — un errore sistemico porta a `bloccato`, e `retry` e `abandon` portano rispettivamente a `completato` e `abbandonato`. Un errore locale porta a `parzialmente-recuperato`.
      - [ ] AC-5 — la separazione di `OP2` a `S03-c` e quella residua di `OP5` sono rilevate e riferite con le posizioni.
      - [ ] AC-7 — uno stato non riconoscibile produce `NON_SUPPORTABILE` anche in presenza di un errore sistemico o di una decisione di abbandono, e mai `bloccato`.

      ## Blockers
      None.
