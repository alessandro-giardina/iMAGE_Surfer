  - id: TASK-08
    title: Test di integrazione del banco sul profilo smoke con validazione dello schema dei risultati
    type: Test
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Un test dimostra che ogni sottocomando del banco produce misure vere e non solo uno stato di uscita zero: JSON conforme allo schema, ripetizioni effettivamente eseguite, e ogni campo di dispersione presente e finito.

      ## Read
      - `Spikes/01-scale-memory/Sources/BenchKit/MeasurementResult.swift` — lo schema da validare.
      - `Spikes/01-scale-memory/Sources/bench/main.swift` — i cinque sottocomandi e le loro opzioni.
      - `Spikes/01-scale-memory/dataset.json` — `smokeProfile`.

      ## Change
      - Nuovo `Spikes/01-scale-memory/Tests/BenchKitTests/BenchIntegrationTests.swift`.
      - **Non-obiettivi:** nessuna asserzione su valori assoluti di tempo o memoria — il tempo e la memoria sono l'oggetto della misura, non del test, e un'asserzione su una soglia qui renderebbe il test dipendente dalla macchina. Nessuna esecuzione del profilo pieno.

      ## Steps
      1. Predisponi il dataset `smoke` una volta per l'intera suite, in una directory temporanea, invocando il generatore in-process (non come processo esterno) per tenere il test rapido e deterministico.
      2. Per ognuno dei cinque sottocomandi — `first-screen`, `selection-latency`, `scroll-memory`, `retention-band`, `item-cost` — esegui il banco sul profilo `smoke` e asserisci **sull'esito osservabile**:
         a. Il JSON emesso decodifica in `MeasurementResult` senza errori e `schema` è esattamente `"image-surfer/spike-01/measurement/v1"`.
         b. `measurementId` non è vuoto e `host.assertComplete()` non lancia.
         c. `repetitions.count` è **esattamente** il numero richiesto sulla riga di comando. È l'asserzione centrale del test: un banco che gira, stampa e non misura passerebbe un controllo sullo stato di uscita e fallisce qui.
         d. Per ogni grandezza dichiarata dal sottocomando, il blocco `dispersion` esiste e ogni campo — `n`, `min`, `median`, `p95`, `max`, `mean`, `stddev`, `iqr` — è presente e **finito**: nessun `NaN`, nessun infinito. Un `NaN` che arrivasse fino a `RESULT.md` diventerebbe una cifra falsa in un documento di esito.
         e. `dispersion["…"]!.n == repetitions.count` per ogni grandezza: la dispersione deve essere calcolata su tutte le ripetizioni, non su un sottoinsieme.
      3. Asserzioni specifiche per sottocomando, sul merito e non sulla forma:
         - `first-screen`: `thumbnailsReadyMs <= firstScreenMs` in ogni ripetizione, perché la composizione non può precedere la disponibilità delle anteprime; e le ripetizioni hanno usato cartelle **diverse**, verificato leggendo il parametro registrato.
         - `selection-latency`: il numero di spostamenti misurati corrisponde a quello richiesto, ed è registrata la profondità di coda che dimostra la saturazione prima della misura; una misura di latenza «sotto carico» eseguita a code vuote sarebbe la misura sbagliata, e questo controllo lo impedisce.
         - `scroll-memory`: `peakFootprintBytes > host` baseline registrata, `slopeDistinguishableFromZero` presente come booleano, e l'intervallo di confidenza presente.
         - `retention-band`: 15 righe, `exitBand > enterBand` su ognuna, `regeneratedSmall` e `regeneratedMedium` presenti; e il campo `recommendation` presente, valorizzato o esplicitamente nullo con motivo.
         - `item-cost`: una riga per cella non vuota, `perItemLimitBytes > p95` su ogni riga, e la stringa della formula presente.
      4. Aggiungi un test negativo che invoca il banco **senza** manifest del dataset e pretende stato di uscita 1 con un messaggio che nomina `gen-dataset`: la procedura deve essere eseguibile da un altro sviluppatore, e un banco che fallisce in modo opaco su dataset assente non lo è.
      5. Aggiungi un test negativo su opzione sconosciuta, che pretende stato 2 e la stampa dell'uso.
      6. Esegui `swift format --in-place --recursive Spikes/01-scale-memory/Tests`.

      ## Verify
      - Esegui: `swift test --package-path Spikes/01-scale-memory`
      - Attesa: tutti i test passano, inclusi quelli di TASK-04. La suite completa resta entro qualche minuto perché usa solo il profilo `smoke`.
      - Esegui: `swift build --package-path Spikes/01-scale-memory`
      - Attesa: `Build complete!`, zero errori e zero avvisi.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Tests`
      - Attesa: stato 0.

      ## Done
      - [ ] AC-3 — i sottocomandi `first-screen`, `selection-latency` e `scroll-memory` producono ripetizioni nel numero richiesto con dispersione completa e finita, verificato dal test e non dallo stato di uscita.
      - [ ] AC-4 — `item-cost` produce una riga per cella con limite per elemento maggiore del p95 e formula registrata.
      - [ ] AC-5 — `retention-band` produce 15 righe con soglie distinte e i due conteggi di rigenerazione.
      - [ ] La latenza della selezione è misurata a code dimostrabilmente sature, verificato dal parametro di profondità registrato.
      - [ ] Nessun campo di dispersione può essere `NaN` o infinito senza far fallire il test.
      - [ ] Il banco invocato senza dataset esce 1 nominando `gen-dataset`; con opzione sconosciuta esce 2 stampando l'uso.
      - [ ] `swift test` verde e `swift format lint --strict` a stato 0.

      ## Blockers
      None.
