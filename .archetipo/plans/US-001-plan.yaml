      - `Spikes/01-scale-memory/Sources/BenchKit/Dispersion.swift`, `FootprintSampler.swift`, `HostFingerprint.swift` — le firme create in TASK-03.
      - `Spikes/01-scale-memory/Sources/BenchKit/DatasetConfig.swift` e `ImageSynthesis.swift` — i tipi creati in TASK-02.
      - `Spikes/01-scale-memory/dataset.json` — i conteggi dichiarati, incluso `smokeProfile`.

      ## Change
      - Nuovi file in `Spikes/01-scale-memory/Tests/BenchKitTests/`: `DispersionTests.swift`, `FootprintSamplerTests.swift`, `HostFingerprintTests.swift`, `DatasetConfigTests.swift`, `GeneratorTests.swift`.
      - Rimuovi il test segnaposto di TASK-01 se ridondante.
      - **Non-obiettivi:** nessun test che generi il dataset completo; nessun test che dipenda da tempi di esecuzione della macchina (il tempo è oggetto di misura, non di asserzione).

      ## Steps
      1. `DispersionTests.swift`: verifica su serie a valori noti. Con `[1, 2, 3, 4, 5]` attendi mediana 3, media 3, deviazione standard campionaria `sqrt(2.5)` entro 1e-9, IQR calcolato secondo la convenzione documentata. Aggiungi i casi limite: `n = 1` restituisce `stddev == 0` e `iqr == 0` senza errore; array vuoto restituisce `nil`; serie di valori identici restituisce `stddev == 0` e `p95` pari al valore. Aggiungi un caso su serie di 100 valori `1…100` che fissa per iscritto il p95 atteso secondo la convenzione scelta, così un cambio silenzioso di interpolazione fallisce il test invece di cambiare le cifre di `RESULT.md`.
      2. `FootprintSamplerTests.swift`: **è il test che protegge dal difetto peggiore dello spike**, un campionatore che restituisce sempre zero e rende nulle tutte le misure di memoria del cancello. Rileva la baseline, avvia il campionatore a 5 ms, alloca e **tocca** un blocco di almeno 256 MB (scrivi almeno un byte per pagina, altrimenti la memoria non entra nel footprint), attendi qualche campione, rilascia, ferma il campionatore. Asserisci: `trace.peak - trace.baseline >= 200 MB` e `trace.samples.count >= 5`. Aggiungi un test della pendenza su una traccia sintetica costruita a mano con crescita nota, verificando che `slopeBytesPerHour` la ritrovi entro il 10% e che su una traccia piatta l'intervallo di confidenza al 95% contenga lo zero.
      3. `HostFingerprintTests.swift`: raccogli l'impronta e asserisci che `assertComplete()` non lancia, che `physicalMemoryBytes > 0`, `activeProcessorCount > 0`, `model` e `osBuildVersion` non vuoti, e `volumeFileSystemType` non vuoto. Aggiungi un test che costruisce un'impronta con `model` vuoto e pretende che `assertComplete()` lanci nominando `model`.
      4. `DatasetConfigTests.swift`: decodifica `dataset.json` reale dal repository e asserisci che `scrollFolder.distribution` sommi esattamente a 50.000, che ogni `firstScreenFolders.distribution` sommi esattamente a 3.000, che `smokeProfile.scrollFolder.total` sia 240, e che le celle siano 12. Aggiungi un caso su una configurazione malformata in linea, con una distribuzione che non somma al totale, e pretendi un errore di decodifica il cui messaggio nomina la cella incoerente.
      5. `GeneratorTests.swift`: genera in una directory temporanea con il profilo `smoke` e asserisci sull'esito osservabile, non sullo stato di uscita:
         - `dataset-manifest.json` esiste e `totals.total == 240`;
         - i conteggi per cella del manifest combaciano con `smokeProfile`;
         - le cartelle di prima schermata sono 2, ciascuna con 24 file, e i file sono **effettivamente unici**: confronta i digest SHA-256 dei primi 64 KB e pretendi zero collisioni;
         - dentro `scroll-50k` esistono cloni: prendi due file della stessa cella prodotti come cloni e pretendi `st_ino` **diversi** ma contenuto identico, così il test distingue un clone da una copia sbagliata e da un file mancante;
         - per ogni cella con formato `jpeg` o `heic` il manifest riporta `bytesPerMegapixelAchieved` entro `tolerance` del target, oppure `toleranceMiss: true`: il test accetta entrambe le cose ma non un campo assente.
         - il pre-volo: invoca la stima dello spazio con un valore di disponibilità iniettato più basso della soglia e pretendi l'errore, verificando che il messaggio riporti stima e disponibile.
      6. Esegui `swift format --in-place --recursive Spikes/01-scale-memory/Tests`.

      ## Verify
      - Esegui: `swift test --package-path Spikes/01-scale-memory`
      - Attesa: tutti i test passano. La baseline registra `swift test` come non eseguibile prima di TASK-01 e verde con un solo test dopo: questo è il primo momento in cui la suite ha contenuto reale, e l'attesa è verde.
      - Esegui: `swift build --package-path Spikes/01-scale-memory`
      - Attesa: `Build complete!`, zero errori e zero avvisi.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Tests`
      - Attesa: stato 0.

      ## Done
      - [ ] AC-1 — i test dimostrano che il generatore produce le segmentazioni dichiarate, con unicità verificata per digest e clonazione verificata per inode distinto a contenuto identico.
      - [ ] AC-2 — un'impronta hardware incompleta fa fallire `assertComplete()`, e il test lo dimostra nominando il campo.
      - [ ] AC-3 — la statistica di dispersione è verificata su serie a valori noti, inclusa la convenzione di p95 fissata per iscritto.
      - [ ] Il campionatore di footprint rileva un'allocazione toccata di almeno 256 MB: un campionatore muto fallisce il test invece di produrre misure nulle.
      - [ ] `swift test --package-path Spikes/01-scale-memory` verde e `swift format lint --strict` a stato 0.

      ## Blockers
      None.
