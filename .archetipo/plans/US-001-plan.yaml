      - Attesa: nessun risultato.
      - Esegui: `grep -n "path: \." docs/wiki/engineering/code-map.md`
      - Attesa: nessun risultato — l'ancoraggio alla radice è stato sostituito.
      - Esegui: `ls docs/wiki/domains 2>/dev/null | wc -l`
      - Attesa: `0` oppure directory assente — nessuna pagina di dominio è stata creata.
      - Esegui: `git diff --name-only docs/wiki`
      - Attesa: solo `docs/wiki/engineering/code-map.md` (più `index.md` se hai cambiato `description`).

      ## Done
      - [ ] Il cambiamento di conoscenza è registrato: la pagina non afferma più che il repository contenga un solo file né che non esista codice non mappato.
      - [ ] `Spikes/01-scale-memory/` è rappresentato come codice non mappato, dichiarato usa-e-getta e fuori dalla mappa dei domini, con collegamento a `decisions/work-admission-budget`.
      - [ ] La tabella dei domini resta vuota e **nessuna pagina di dominio è stata creata**.
      - [ ] L'ancoraggio è restretto: `sources` non contiene più `path: .`.
      - [ ] Il primo passo eseguito è stato `archetipo wiki reset engineering/code-map`; il blocco `review` non è stato modificato a mano.
