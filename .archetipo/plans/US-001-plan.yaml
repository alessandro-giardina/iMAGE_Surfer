  - id: TASK-09
    title: Esecuzione completa del banco e RESULT.md con hardware, misure grezze, stime di costo e banda di ritenzione
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-08
    body: |-
      ## Objective
      Il banco è eseguito una volta sul profilo pieno sull'hardware dichiarato, le esecuzioni citate sono versionate, e `RESULT.md` pubblica hardware, misure grezze, tabella delle stime di costo e ampiezza della banda di ritenzione.

      ## Read
      - `Spikes/01-scale-memory/PROCEDURE.md` — la sequenza di comandi da eseguire, così come è stata scritta per un altro sviluppatore.
      - I JSON prodotti in `Spikes/01-scale-memory/runs/` dopo l'esecuzione — sono la sola fonte delle cifre.
      - `docs/PRD.md` righe 732, 734, 740-743 — i testi di NFR-P1, NFR-P3, NFR-P9, NFR-P10, NFR-P12 da confrontare con le misure.

      ## Change
      - Nuovo `Spikes/01-scale-memory/RESULT.md` — sezioni *Hardware di misura*, *Misure grezze*, *Stime di costo in memoria*, *Banda di ritenzione*, *Limiti della misura*.
      - Nuova directory `Spikes/01-scale-memory/measurements/` con i JSON **selezionati**, versionati.
      - Genera `Spikes/01-scale-memory/.data/` (non versionato).
      - **Non-obiettivi:** in questo task **non** si scrive l'esito su ADR-009 e sugli NFR — appartiene a TASK-10. Non modificare `docs/PRD.md`: il testo di sostituzione vive in `RESULT.md`, non viene applicato al documento di prodotto.

      ## Steps
      1. Genera il dataset completo seguendo `PROCEDURE.md` alla lettera, senza scorciatoie: `swift run --package-path Spikes/01-scale-memory gen-dataset --profile full`. Attendi circa 20-40 minuti e circa 140 GB. Se il pre-volo rifiuta, riduci `firstScreenFolders.count` documentando la riduzione nei *Limiti della misura* — non aggirare il pre-volo.
      2. Prima di misurare, porta la macchina in condizioni dichiarabili e registrale: alimentazione di rete collegata, modalità a basso consumo disattivata, nessun'altra applicazione utente attiva. Lo stato termico viene comunque registrato a ogni ripetizione dal kernel.
      3. Esegui i cinque sottocomandi sul profilo pieno nell'ordine di `PROCEDURE.md`, con `--repetitions 5` dove previsto e `--long-session 60`. Esegui `first-screen` **due volte, una per percorso di anteprima** (`--thumbnail-path quicklook` e `--thumbnail-path imageio`): la sonda di pianificazione ha dato 89,4 ms contro 49,5 ms per elemento, e su 3.000 immagini la differenza può decidere il verdetto su NFR-P1. Entrambe le esecuzioni vanno pubblicate.
      4. Copia in `measurements/` i JSON delle esecuzioni che `RESULT.md` cita, con nome che contiene il sottocomando e il prefisso di `measurementId`. Lascia in `runs/` tutto il resto. Verifica che `measurements/` **sia** tracciabile da Git: `.gitignore` esclude `runs/` e `.data/`, non `measurements/`.
      5. Scrivi `RESULT.md` § **Hardware di misura**: modello, CPU, conteggio di core prestazionali ed efficienti, memoria fisica, tipo di filesystem e flag SSD del volume del dataset, spazio libero, versione e build di macOS, versione di Swift e dell'SDK, stato di alimentazione e modalità a basso consumo. Copia i valori dal blocco `host` del JSON, non da conoscenza a memoria. Aggiungi la frase che AC-2 richiede: **ogni cifra di questo documento è attribuita a questa configurazione e a nessun'altra.**
      6. Scrivi § **Misure grezze** con una tabella per ciascuna delle quattro misure di AC-3 — tempo alla prima schermata su 3.000 immagini (entrambi i percorsi di anteprima, e separatamente `thumbnailsReadyMs` e `firstScreenMs`), latenza dello spostamento della selezione sotto lavoro in sottofondo, occupazione di picco su 50.000 con scorrimento continuo, andamento in sessione di lunga durata. Ogni riga porta: `n`, mediana, p95, minimo, massimo, deviazione standard, IQR, e il `measurementId`. Per la sessione lunga riporta pendenza, intervallo di confidenza al 95% e se è distinguibile da zero — non scrivere «stabile» al posto del numero.
      7. Scrivi § **Stime di costo in memoria** (AC-4): una tabella con una riga per cella non vuota di tipo di lavoro × formato × classe di risoluzione, e per ogni riga: mediana e p95 del picco transitorio, delta trattenuto, **stima adottata** pari al p95 arrotondato per eccesso, **margine di sicurezza** espresso come rapporto fra stima adottata e mediana, **limite per singolo elemento** con la formula dichiarata, e `measurementId` della misura che la calibra. Aggiungi la riga degli elementi anomali. Nel testo che precede la tabella, dichiara esplicitamente il vincolo sull'hardware: la macchina di misura ha 32 GB e non è il Mac con meno memoria in target, quindi il margine di sicurezza deve coprire quello scarto, e va detto quanto.
      8. Scrivi § **Banda di ritenzione** (AC-5): la tabella dello spazzolamento con le coppie (entrata, uscita), footprint di regime e conteggi di rigenerazione, poi la **coppia dichiarata** con le sue due soglie distinte, motivata citando il costo di ricalcolo misurato dell'oscillazione di ±0,25 schermate e il footprint che quella scelta comporta. Se il banco ha restituito `recommendation: nil`, scrivi qui il fatto e lascia la conseguenza a TASK-10: non allargare lo spazzolamento per ottenere una raccomandazione.
      9. Scrivi § **Limiti della misura**, per intero e senza attenuazioni: (a) la cartella da 50.000 file usa cloni APFS, quindi la lettura a freddo è **sottostimata** su quella cartella, mentre le cartelle da 3.000 file sono uniche e non clonate e la misura di NFR-P1 non ne è affetta; (b) la macchina di misura ha 32 GB e il PRD prescrive di misurare dal Mac con meno memoria in target in su; (c) il contenuto è sintetico, calibrato per byte per megapixel fotografici, con i valori effettivi nel manifest; (d) Xcode non è installato, quindi nessuna misura passa da `xcodebuild` e nessun test di interfaccia XCUITest esiste; (e) eventuali ripetizioni eseguite sotto limitazione termica, elencate se presenti.
      10. Verifica a mano, prima di chiudere, che ogni cifra scritta nel documento sia rintracciabile in un file di `measurements/`. Il controllo automatico arriva in TASK-16, ma non consegnare un documento che sai già non lo passerebbe.

      ## Verify
      - Esegui: `ls Spikes/01-scale-memory/measurements/*.json | wc -l`
      - Attesa: almeno 6 file (i cinque sottocomandi più la seconda esecuzione di `first-screen`).
      - Esegui: `git check-ignore -q Spikes/01-scale-memory/.data && git check-ignore -q Spikes/01-scale-memory/runs && echo "dati ignorati"`
      - Attesa: stampa `dati ignorati`.
      - Esegui: `git ls-files --others --exclude-standard Spikes/01-scale-memory/measurements | wc -l`
      - Attesa: un valore maggiore di zero — i JSON selezionati sono visibili a Git, quindi versionabili, e non esclusi.
      - Esegui: `swift test --package-path Spikes/01-scale-memory`
      - Attesa: verde, come in TASK-08. L'esecuzione del profilo pieno non deve aver richiesto modifiche al codice; se le ha richieste, i test le coprono.
      - Ispezione manuale di `RESULT.md`: le quattro sezioni esistono, ogni tabella ha la colonna `measurementId` popolata, e la sezione *Limiti della misura* contiene tutti e cinque i punti dell'elenco.

      ## Done
      - [ ] AC-2 — § *Hardware di misura* dichiara modello, memoria e tipo di disco, con i valori copiati dal blocco `host` del JSON, e la frase di attribuzione esplicita.
      - [ ] AC-3 — § *Misure grezze* riporta tutte e quattro le misure con `n`, mediana, p95, deviazione standard, IQR e `measurementId`; la sessione lunga riporta pendenza e intervallo di confidenza, non un giudizio qualitativo.
      - [ ] AC-4 — § *Stime di costo in memoria* pubblica la tabella segmentata con stima adottata, margine di sicurezza, limite per singolo elemento e `measurementId` per riga, più la riga degli anomali, e dichiara come il margine copre lo scarto di hardware.
      - [ ] AC-5 — § *Banda di ritenzione* dichiara le due soglie distinte e le motiva con il costo di ricalcolo misurato dell'oscillazione piccola.
      - [ ] I JSON citati sono versionati sotto `measurements/`; dataset ed esecuzioni di scarto restano esclusi.
      - [ ] `docs/PRD.md` non è stato modificato.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: RESULT.md - esito su ADR-009, NFR-P1, NFR-P9, NFR-P10 e registrazione delle soglie non supportabili
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      `RESULT.md` chiude il cancello: ognuna delle quattro voci risulta **confermata** oppure **emendata** con testo di sostituzione e valori misurati, e ogni soglia non raggiungibile è registrata come **non supportabile** con la misura che lo dimostra.

      ## Read
      - `Spikes/01-scale-memory/RESULT.md` — le sezioni scritte in TASK-09; le cifre vengono da lì e da `measurements/`.
      - `docs/PRD.md` riga 532 (ADR-009), riga 732 (NFR-P1), riga 740 (NFR-P9), riga 741 (NFR-P10) — i testi **esatti** da confermare o sostituire. Copiali, non riassumerli a memoria: un testo di sostituzione che parte da una parafrasi non è un emendamento.
      - `docs/PRD.md` riga 286 — «un cancello può concludere che qualcosa non è supportabile: è un esito legittimo, non un fallimento».

      ## Change
      - `Spikes/01-scale-memory/RESULT.md` — aggiunge § *Esito*, § *Soglie non supportabili* e § *Conseguenze per la costruzione*.
      - **Non-obiettivi:** non modificare `docs/PRD.md`. Non modificare nessuna pagina Wiki: appartiene ai task da TASK-11 a TASK-15. E soprattutto: **non ripetere alcuna misura su una configurazione hardware diversa** da quella dichiarata in § *Hardware di misura*, per nessun motivo, incluso il caso in cui una soglia risulti mancata. AC-7 lo vieta esplicitamente: una soglia non raggiungibile sull'hardware dichiarato è un esito valido che chiude il cancello, non un risultato da riprovare altrove fino a ottenere una conferma.

      ## Steps
      1. Scrivi § **Esito** con esattamente quattro voci, una per ADR-009, NFR-P1, NFR-P9, NFR-P10. Ogni voce ha questa forma fissa, così che sia leggibile a colpo d'occhio e verificabile da un controllo automatico:
         - il nome della voce;
         - il marcatore **confermato** oppure **emendato** in grassetto, uno dei due e mai entrambi né nessuno;
         - la soglia o l'affermazione dichiarata nel PRD, citata testualmente;
         - la cifra misurata che decide, con il suo `measurementId`;
         - se **emendato**, il **testo di sostituzione** completo, scritto come andrebbe nel PRD, con i valori numerici misurati al posto delle soglie dichiarate.
      2. Regola di decisione, da applicare e non da interpretare a posteriori:
         - **NFR-P1** è confermato se il p95 di `firstScreenMs` sulle cinque ripetizioni sta entro 1 secondo, per almeno uno dei due percorsi di anteprima; in quel caso dichiara **quale** percorso lo regge, perché la scelta fra QuickLook e ImageIO diventa un vincolo per la costruzione. Se nessuno dei due lo regge, è emendato con il valore misurato.
         - **NFR-P9** ha due parti indipendenti e vanno decise separatamente: il tetto di picco, che diventa la cifra misurata di `peakFootprintBytes` più il margine dichiarato; e l'assenza di crescita monotona, decisa su `slopeDistinguishableFromZero` e sull'intervallo di confidenza, non sul segno della pendenza. Se una delle due parti non regge, la voce è emendata e il testo di sostituzione dice quale.
         - **NFR-P10** è confermato se le stime per cella hanno una dispersione tale che il p95 con il margine dichiarato copre il massimo osservato, ed esiste un limite per elemento che intercetta la cella degli anomali. Se il p95 con margine non copre il massimo osservato in qualche cella, la voce è emendata e il testo di sostituzione dichiara il margine effettivamente necessario.
         - **ADR-009** è confermato se le tre precedenti reggono **e** la banda di ritenzione ha una coppia di soglie che azzera il ricalcolo sull'oscillazione piccola. Altrimenti è emendato, e il testo di sostituzione riscrive le parti di ADR-009 che le misure contraddicono, in particolare l'ampiezza della banda e la struttura delle stime.
      3. Scrivi § **Soglie non supportabili** (AC-7). Per ogni soglia dichiarata nel PRD che l'hardware dichiarato non raggiunge: il requisito, la cifra misurata con `measurementId`, la constatazione **non supportabile su questa configurazione**, e la **modifica proposta al requisito** — un valore alternativo, una condizione, o una riduzione di ambito. Se nessuna soglia è mancata, scrivi la sezione con la frase esplicita che nessuna soglia è risultata non supportabile: la sezione presente e vuota è informazione, la sezione assente è ambiguità. Aggiungi la frase che chiude la regola di AC-7: **l'esito è valido e chiude il cancello; nessuna misura è stata ripetuta su una configurazione diversa da quella dichiarata.**
      4. Scrivi § **Conseguenze per la costruzione**: le decisioni che le Tappe successive erediteranno, in forma di elenco breve e azionabile — percorso di anteprima da adottare, stime per cella e loro margine, limite per elemento, coppia di soglie della banda, e il tetto di memoria dichiarato con l'hardware a cui è attribuito. È la sezione da cui TASK-11 trae il contenuto della pagina di decisione della Wiki.
      5. Se la costruzione dello scope va rivista, registralo qui: il PRD alla riga 192 dichiara che l'*Area 12 — Editing di base* e il punteggio estetico sono i due candidati al rinvio «da rivedere alla fine del cancello n°1». Se le stime misurate non reggono lo scope, scrivilo come osservazione con la misura che la sostiene. Non aprire spec né modificare il backlog: qui si registra, non si decide il piano di prodotto.
      6. Rileggi il documento intero verificando che ogni cifra abbia un `measurementId` e che nessuna cifra sia stata scritta a memoria o arrotondata senza dirlo.

      ## Verify
      - Esegui: `grep -c -E '\*\*(confermato|emendato)\*\*' Spikes/01-scale-memory/RESULT.md`
      - Attesa: almeno 4 — una occorrenza per voce di esito.
      - Esegui: `for v in "ADR-009" "NFR-P1" "NFR-P9" "NFR-P10"; do grep -q "$v" Spikes/01-scale-memory/RESULT.md && echo "$v presente" || echo "$v MANCANTE"; done`
      - Attesa: quattro righe `presente`, nessuna `MANCANTE`.
      - Esegui: `grep -q "Soglie non supportabili" Spikes/01-scale-memory/RESULT.md && echo sezione-presente`
      - Attesa: stampa `sezione-presente`, sia che soglie mancate esistano sia che non esistano.
      - Esegui: `git diff --stat docs/PRD.md`
      - Attesa: nessun output — il PRD non è stato modificato.
      - Esegui: `git status --porcelain docs/wiki`
      - Attesa: nessun output — nessuna pagina Wiki è stata toccata in questo task.
      - Esegui: `swift test --package-path Spikes/01-scale-memory`
      - Attesa: verde, invariato rispetto a TASK-08. Questo task tocca solo Markdown e non deve poter rompere la suite.

      ## Done
      - [ ] AC-6 — § *Esito* contiene esattamente quattro voci, una per ADR-009, NFR-P1, NFR-P9 e NFR-P10, ciascuna con uno e un solo marcatore **confermato** o **emendato**.
      - [ ] AC-6 — ogni voce **emendato** porta il testo di sostituzione completo con i valori numerici misurati al posto delle soglie dichiarate, e ogni voce cita il `measurementId` della misura che decide.
      - [ ] AC-7 — § *Soglie non supportabili* esiste in ogni caso; ogni soglia mancata è registrata con la misura che lo dimostra e la modifica proposta al requisito.
      - [ ] AC-7 — il documento dichiara che nessuna misura è stata ripetuta su configurazione diversa da quella dichiarata, e nessun file di `measurements/` riporta un `host` diverso da quello di § *Hardware di misura*.
      - [ ] § *Conseguenze per la costruzione* elenca le decisioni ereditate dalle Tappe successive.
