spec_code: US-001
body: |-
  # US-001: Cancello 1 - misurare scala e memoria su 50.000 file e chiudere ADR-009 — Piano di implementazione

  **Generato da:** Team di pianificazione ARchetipo
  **Data:** 2026-08-26

  ---

  ## Spec

  **Epica:** EP-001 — Tappa 0 - Cancelli tecnici
  **Priorità:** HIGH | **Punti:** 5 | **Ambito:** MVP

  **Storia utente**

  Come Leonardo, architetto di iMAGE Surfer, voglio misurare su hardware dichiarato il comportamento in latenza e in memoria di una cartella da 50.000 immagini, e derivarne le stime di costo e l'ampiezza della banda di ritenzione, così che ADR-009 - e con esso NFR-P1, NFR-P9 e NFR-P10 - sia confermato oppure emendato con numeri misurati, prima che venga scritta una riga del pacchetto che ne dipende.

  **Criteri di accettazione**

  - AC-1 — `Spikes/01-scale-memory/` con procedura di generazione del dataset eseguibile da un altro sviluppatore; insieme da 50.000 file segmentato per formato e classe di risoluzione; procedura e configurazione versionate, file generati no.
  - AC-2 — `RESULT.md` dichiara l'hardware di misura (modello, memoria, tipo di disco) e attribuisce ogni cifra a quella configurazione.
  - AC-3 — `RESULT.md` riporta tempo alla prima schermata su 3.000 immagini, latenza dello spostamento della selezione sotto lavoro in sottofondo, occupazione di picco su 50.000 con scorrimento continuo, e andamento in sessione di lunga durata; ciascuna con ripetizioni e dispersione.
  - AC-4 — Tabella di stime di costo in memoria per tipo di lavoro × formato × classe di risoluzione, con margine di sicurezza e limite per singolo elemento per riga, ricondotta alla misura che la calibra.
  - AC-5 — Ampiezza della banda di ritenzione con soglie distinte di entrata e uscita, motivata dal costo di ricalcolo misurato di un piccolo movimento di scorrimento.
  - AC-6 — Esito su ADR-009, NFR-P1, NFR-P9, NFR-P10: **confermato** oppure **emendato** con testo di sostituzione e valori misurati.
  - AC-7 — Una soglia non raggiungibile è registrata come **non supportabile** con la misura che lo dimostra e la modifica proposta; l'esito chiude il cancello senza ripetere la misura su altra configurazione.

  **Fuori ambito.** Nessuna implementazione del pacchetto `Work/`: code, politica di ammissione, cache di anteprime e banda di ritenzione sono materiale del banco, non forma definitiva. Nessuna interfaccia utente di prodotto, nessuna pipeline di integrazione continua, nessun altro cancello.


  ---

  ## Soluzione tecnica

  Il cancello è uno **spike misurativo**, non una funzione: il prodotto del lavoro è un numero misurato e un esito scritto. Il repository non contiene codice applicativo, quindi tutto nasce da zero sotto `Spikes/01-scale-memory/`, isolato dal futuro albero di prodotto e dichiaratamente usa-e-getta.

  - **Pacchetto SwiftPM puro, senza dipendenze esterne.** L'ispezione dell'ambiente ha rilevato che **Xcode non è installato**: è attiva solo l'istanza Command Line Tools e `xcodebuild` fallisce. Il banco è quindi un pacchetto SwiftPM costruito con `swift build`, con zero dipendenze dichiarate (nessun `swift-argument-parser`, nessun GRDB): la costruzione resta ermetica e offline, e non introduce nel repository un progetto Xcode che il PRD prevede solo per il prodotto. Una sonda compilata ha confermato che l'SDK dei Command Line Tools (26.5) espone AppKit, QuickLookThumbnailing, ImageIO, CoreImage, Vision, CoreML e QuartzCore, e che `task_info(TASK_VM_INFO)` restituisce `phys_footprint`.
  - **`QLThumbnailGenerator` funziona da un eseguibile non impacchettato.** Verificato dalla sonda: una JPEG 4000×3000 produce un'anteprima 512×384 in **89,4 ms** a freddo, contro **49,5 ms** della decodifica ridimensionata `CGImageSourceCreateThumbnailAtIndex`. Il banco misura entrambi i percorsi come tipi di lavoro distinti, perché la differenza è già rilevante per NFR-P1 e per la scelta di ADR-009.
  - **Tre eseguibili e una libreria.** `gen-dataset` genera il dataset; `bench` esegue le misure per sottocomando; `BenchKit` è la libreria che contiene il campionatore di memoria, la statistica delle ripetizioni, l'impronta hardware e lo schema JSON dei risultati; `BenchKitTests` la verifica con Swift Testing. Il banco implementa code, politica di ammissione, cache di anteprime e banda di ritenzione **nella forma minima che serve a misurarle**, e questo materiale non deve essere riutilizzato: il fuori-ambito della spec lo vieta esplicitamente.
  - **Host AppKit come strumentazione, non come interfaccia.** AC-3 richiede il tempo alla *prima schermata di anteprime* e la latenza dello *spostamento della selezione*: nessuna delle due esiste senza una finestra con griglia e selezione. Il banco apre quindi un `NSWindow` con `NSCollectionView` dentro un `NSScrollView`, dimensionato su una porta di vista dichiarata. È strumentazione di misura sotto `Spikes/`, non superficie di prodotto: non c'è mockup, non c'è design system, non c'è nulla da riusare. La misura headless è stata scartata perché ometterebbe il costo di composizione e presentazione del fotogramma, e sottostimare NFR-P1 significherebbe **confermare una soglia che il prodotto poi manca** — l'esito peggiore possibile per un cancello.
  - **Oracolo del fotogramma.** «Prima schermata visibile» è definito come il completamento della transazione Core Animation nella quale viene assegnata l'ultima anteprima degli elementi che intersecano la porta di vista iniziale, catturato con `CATransaction.setCompletionBlock`. Il banco registra **anche** il timestamp di «anteprime pronte» prima della composizione, così il costo di presentazione resta visibile e la cifra resta onesta invece di essere una media di due grandezze diverse.
  - **Dataset da 50.000 file con cloni APFS, e cartelle uniche dove l'I/O è l'oggetto della misura.** 50.000 file interi peserebbero oltre 350 GB. `clonefile(2)` (`cp -c`) produce file distinti per identità, nome e inode a costo di blocchi quasi nullo — verificato funzionante su questo volume APFS — ma i cloni **condividono i blocchi fisici** e sottostimano la lettura a freddo. Il piano separa quindi i due regimi: la cartella da 3.000 immagini di NFR-P1 è generata **unica e non clonata**, in **cinque cartelle disgiunte** perché ogni ripetizione parta davvero a cache fredda (senza `sudo purge`, che renderebbe la procedura non eseguibile da un altro sviluppatore); i cloni restano nella cartella da 50.000 file, dove l'oggetto della misura è l'occupazione di memoria e il costo di decodifica, entrambi interamente reali. La sottostima dell'I/O a freddo sulla cartella da 50.000 file è un limite dichiarato in `RESULT.md`, non un dettaglio taciuto.
  - **Contenuto sintetico a byte-per-megapixel fotografici.** Con rumore puro una JPEG da 12 MP pesa 9,3 MB invece dei circa 4 MB di una fotografia reale, e la misura di I/O si gonfia. Il generatore sintetizza un composito a banda limitata (gradiente a bassa frequenza, texture a media frequenza, una regione di dettaglio ad alta frequenza) e regola la qualità di codifica per centrare un obiettivo dichiarato di byte per megapixel per formato entro ±20%, registrando nel manifest il valore effettivamente ottenuto. Il seme è versionato: il dataset è riproducibile.
  - **Memoria misurata come `phys_footprint`.** Unica grandezza usata, campionata su un thread dedicato: 50 ms per le misure di scorrimento e sessione lunga, 5 ms per il costo per elemento. Per il costo per elemento il banco riporta **due** numeri distinti — il picco transitorio durante l'elemento (la grandezza che serve all'ammissione, perché l'ammissione precede l'esecuzione) e il delta trattenuto dopo il drenaggio del pool (la grandezza che rivela crescita di cache o perdite). ADR-009 ha bisogno di entrambi.
  - **Ogni cifra tracciabile.** Ogni esecuzione emette JSON con un `measurementId`, l'impronta hardware completa e i campioni. Le esecuzioni selezionate per `RESULT.md` sono **versionate** sotto `Spikes/01-scale-memory/measurements/`, così ogni riga del documento è verificabile; solo il dataset generato e le esecuzioni di scarto restano fuori dal controllo di versione.

  ### Decisioni architetturali

  **Supera la soglia ADR: la politica di ammissione del lavoro con banda di ritenzione.** È l'oggetto stesso del cancello, riguarda una politica tecnica trasversale usata da più capacità previste (anteprime, metadati, duplicati, qualità), e la Wiki oggi non contiene **nessuna** pagina `type: decision` mentre `architecture/context-map` registra ADR-009 fra le incertezze aperte. Il piano crea quindi `decisions/work-admission-budget`.

  - *Contesto.* L'ammissione precede l'esecuzione, quindi il costo va stimato e non misurato al momento dell'ammissione; le stime dichiarate nel PRD sono ipotesi non calibrate; una media misurata non protegge dall'elemento anomalo.
  - *Opzione scelta.* Code specializzate per tipo sotto un budget di memoria comune, con stime **conservative pari al p95 misurato per cella** (tipo di lavoro × formato × classe di risoluzione), margine di sicurezza dichiarato per riga, **limite per singolo elemento** derivato dalla coda osservata degli anomali, e banda di ritenzione con soglie distinte di entrata e uscita la cui ampiezza è scelta come la più piccola che azzera il ricalcolo su un'oscillazione di scorrimento di ±0,25 schermate.
  - *Alternative valutate.* (a) *Punto unico di ammissione* con una stima per pixel: scartata perché le dimensioni in pixel non stimano il costo di un modello di visione, di una texture o di un contenitore multipagina, e perché concentra in un componente la conoscenza di ogni tipo di lavoro. (b) *Rilascio immediato di ciò che esce dalla porta di vista*, senza banda: scartata già dal PRD 1.3 e qui misurata per confermare il motivo — un piccolo movimento di scorrimento butta via lavoro appena svolto, e il costo di quel ricalcolo è esattamente la misura che il piano usa per dimensionare la banda. (c) *Stima come media anziché p95*: scartata perché non protegge dall'anomalo; il banco genera deliberatamente elementi anomali (TIFF 16000×12000) per calibrare il limite per elemento su una coda reale e non sul solo corpo ben educato della distribuzione.
  - *Conseguenze.* Le stime sono parametri prodotti da questo cancello e rivedibili con la misura a posteriori; l'ampiezza della banda è memoria occupata di proposito e va calibrata insieme al budget (NFR-P12), non scelta come costante di interfaccia; il test di lunga durata diventa parte del contratto e non un test facoltativo.
  - *Intento di verifica.* Le misure di `bench item-cost`, `bench scroll-memory` e `bench retention-band`, versionate sotto `measurements/`, e le righe di esito di `RESULT.md`.

  **Non superano la soglia ADR** e restano registrate qui: la scelta SwiftPM invece di progetto Xcode (imposta dall'ambiente, reversibile, materiale usa-e-getta), il cloning APFS del dataset (tecnica di misura con limite dichiarato), e l'host AppKit di strumentazione (nessun effetto su dato persistente, confine di integrazione o topologia).

  ### Vincolo dichiarato sull'hardware di misura

  La macchina disponibile è un **Apple M1 Pro con 32 GB** di memoria, APFS su SSD, macOS 26.6.1. Il PRD prescrive di misurare «dal Mac con meno memoria in target in su»: un tetto di memoria non si scopre su una macchina che non lo raggiunge mai. Questo **non** blocca il cancello — AC-2 chiede di dichiarare l'hardware e attribuirgli ogni cifra — ma vincola due cose, che i task rendono obbligatorie: `RESULT.md` dichiara lo scarto fra macchina di misura e Mac di riferimento più piccolo in target, e il margine di sicurezza delle stime di AC-4 deve coprire esplicitamente quello scarto invece di ignorarlo. Una conferma di NFR-P9 ottenuta su 32 GB e presentata come valida per ogni configurazione sarebbe formalmente conforme e sostanzialmente falsa.


  ---

  ## Baseline

  Misurata sotto `/Users/gia/iMAGE_Surfer` prima di progettare i task. Nessun comando del progetto esiste ancora: il repository contiene solo documentazione e configurazione di processo.

  | Controllo | Risultato prima dell'implementazione | Conseguenza sulla pianificazione |
  |---|---|---|
  | `swift build` (radice) | **Rosso, atteso:** `error: Could not find Package.swift in this directory or any of its parent directories.` | Nessun pacchetto esiste. TASK-01 crea il primo manifest; da lì in poi la verifica è `swift build --package-path Spikes/01-scale-memory` e l'attesa è verde. Nessun task promette verde per la radice. |
  | `swift test --package-path Spikes/01-scale-memory` | **Non eseguibile:** il percorso non esiste | Diventa eseguibile dopo TASK-01. TASK-04 è il primo task autorizzato ad attendersi test verdi. |
  | `xcodebuild -version` | **Rosso, prerequisito di ambiente:** `tool 'xcodebuild' requires Xcode, but active developer directory '/Library/Developer/CommandLineTools' is a command line tools instance` | **Vincolo, non difetto da correggere.** Nessun task usa `xcodebuild`, nessun progetto Xcode, nessun XCUITest. Il banco è SwiftPM. Se in futuro Xcode viene installato il piano resta valido. |
  | `swift format lint --strict` | **Verde su repository vuoto** (nessun `.swift` presente); `swift format --version` → `6.3.0`, disponibile come sottocomando della toolchain | È il controllo di stile del piano. Ogni task che tocca Swift lo esegue sui file che ha modificato. |
  | `swiftlint` | **Assente:** `swiftlint not found` | Il PRD lo prescrive per il prodotto, ma non è installato. **Nessun task promette un controllo SwiftLint**: lo stile è garantito da `swift format lint --strict`. |
  | `swift --version` | **Verde:** Apple Swift 6.3.3, target `arm64-apple-macosx26.0` | Concorrenza stretta di Swift 6 disponibile; i target del banco la abilitano. |
  | Sonda SDK compilata | **Verde:** AppKit, QuickLookThumbnailing, ImageIO, CoreImage, Vision, CoreML, QuartzCore presenti in `MacOSX.sdk` 26.5; `task_info(TASK_VM_INFO)` → `kr=0`; `QLThumbnailGenerator` funzionante da eseguibile non impacchettato (89,4 ms, JPEG 12 MP, a freddo); codifica ImageIO verde per JPEG/HEIC/PNG/TIFF; `cp -c` (clone APFS) → stato 0 | Tutti i meccanismi portanti del banco sono stati verificati **prima** di pianificarli. Nessun task deve riscoprire la disponibilità di un framework. |
  | `git status --porcelain` | **Pulito** | Ogni task parte da albero pulito. La verifica di AC-1 su `git check-ignore` è affidabile. |
  | `archetipo wiki validate` | **Verde:** `ok: true`, 5 pagine, nessun rilievo | I task Wiki devono lasciarla verde. |
  | `archetipo wiki status` | **Verde:** 5 pagine, tutte `generated`, nessun `issues` | Nessuna pagina è `reviewed`, quindi `wiki reset` sarà un'operazione idempotente e senza effetto — resta comunque il primo passo obbligatorio di ogni task che modifica una pagina esistente, perché lo stato può cambiare prima dell'esecuzione. |
  | `df -h /System/Volumes/Data` | **679 GB liberi** su 926 GB | Il dataset richiede circa 140 GB. Passa con ampio margine, ma TASK-02 include un pre-volo che verifica lo spazio e fallisce con un messaggio esplicito invece di riempire il disco. |

  **Prerequisiti di ambiente, distinti dai difetti di codice.** macOS 15 o successivo su Apple Silicon (presente: macOS 26.6.1, M1 Pro); toolchain Swift 6 dai Command Line Tools (presente: 6.3.3); volume APFS con supporto ai cloni (presente); circa 200 GB liberi dichiarati per margine (presenti 679 GB). Nessun servizio da avviare, nessuna variabile d'ambiente, nessuna rete. Non serve installare Xcode, e il piano non lo richiede in nessun punto.

  **Nessun file toccato dal piano parte con diagnostica preesistente:** tutti i file Swift del piano sono nuovi, quindi la soglia è zero diagnostiche di compilatore e zero rilievi di `swift format lint --strict` sui file creati.


  ---

  ## Mappa delle evidenze di accettazione

  L'evidenza finale di questo cancello è in parte un documento, e questo crea un rischio preciso: un documento può *affermare* una cifra che nessuna esecuzione ha prodotto. L'oracolo scelto contro quel rischio è la **tracciabilità eseguibile**: ogni cifra di `RESULT.md` porta un `measurementId` che deve esistere in un JSON versionato sotto `measurements/`, e un controllo automatico lo verifica. Nessun criterio è dimostrato dalla sola esistenza di un file.

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Repository pulito, nessun pacchetto | Integrazione + unità | `swift run gen-dataset --profile smoke` termina con stato 0; `dataset-manifest.json` riporta conteggi per cella identici a `dataset.json`; `git check-ignore -q Spikes/01-scale-memory/.data` esce 0 mentre `git ls-files Spikes/01-scale-memory/dataset.json` stampa il percorso; sul profilo pieno il manifest riporta `total: 50000` e 12 celle non vuote | TASK-02, verificato da TASK-04 |
  | AC-2 | Manifest generato | Unità + tracciabilità | L'impronta hardware emessa contiene modello, `hw.memsize`, versione e build di macOS, tipo di filesystem e flag SSD, tutti non vuoti; `RESULT.md` § *Hardware di misura* riporta gli stessi valori del JSON versionato, e il controllo di tracciabilità di TASK-16 fallisce se una cifra del documento non ha `measurementId` corrispondente | TASK-03 e TASK-09, verificato da TASK-04 e TASK-16 |
  | AC-3 | Cinque cartelle uniche da 3.000 file; cartella da 50.000 file | Integrazione (banco) | Quattro misure presenti nel JSON, ciascuna con `n >= 5`, `median`, `p95`, `stddev`, `iqr`: `firstScreenMs`, `selectionLatencyMs` (n=200 spostamenti sotto carico), `peakFootprintBytes` su scorrimento continuo di 50.000, `longSessionSlopeBytesPerHour` con intervallo di confidenza. `RESULT.md` riporta le stesse quattro cifre con ripetizioni e dispersione | TASK-05, TASK-06, TASK-09; verificato da TASK-08 e TASK-16 |
  | AC-4 | Pool di elementi unici per cella + elementi anomali | Integrazione (banco) | Il JSON di `bench item-cost` contiene una riga per ogni cella non vuota di tipo di lavoro × formato × classe, con `n >= 20`, `median`, `p95`, `max`, `stddev` del delta di footprint transitorio **e** trattenuto; `RESULT.md` pubblica la tabella con, per riga, stima adottata, margine di sicurezza, limite per singolo elemento e `measurementId` della misura che la calibra | TASK-07 e TASK-09; verificato da TASK-08 e TASK-16 |
  | AC-5 | Cartella da 50.000 file | Integrazione (banco) | Il JSON di `bench retention-band` contiene, per ogni coppia (entrata, uscita) dello spazzolamento, footprint di regime e numero di anteprime rigenerate da un'oscillazione di ±0,25 e ±1 schermate; `RESULT.md` dichiara la coppia scelta con le due soglie distinte e la motiva citando il conteggio di rigenerazione misurato | TASK-06 e TASK-09; verificato da TASK-08 e TASK-16 |
  | AC-6 | `RESULT.md` con misure e stime già scritte | Ispezione documentale con controllo eseguibile | `RESULT.md` contiene quattro righe di esito, una per ADR-009, NFR-P1, NFR-P9, NFR-P10, ciascuna marcata **confermato** oppure **emendato**; ogni riga *emendato* porta il testo di sostituzione e il valore numerico misurato. Il controllo di TASK-16 fallisce se una delle quattro voci manca o non porta nessuno dei due marcatori | TASK-10, verificato da TASK-16 |
  | AC-7 | Esito già redatto | Ispezione documentale con controllo eseguibile | Se una soglia non è raggiunta sull'hardware dichiarato, `RESULT.md` la elenca in § *Soglie non supportabili* con `measurementId` della misura che lo dimostra e la modifica proposta al requisito. Il controllo verifica la regola nei due versi: nessuna soglia mancata può essere assente dalla sezione, e nessuna esecuzione su hardware diverso da quello dichiarato in § *Hardware di misura* può comparire fra i `measurements/` citati | TASK-10, verificato da TASK-16 |

  **Nessun oracolo è nascosto da un test double.** Il banco non usa mock: misura QuickLook, ImageIO, Vision e il filesystem reali. I soli valori sostituiti nei test unitari sono gli ingressi della statistica (serie note a media e dispersione calcolate a mano) e un'allocazione deliberata per verificare che il campionatore di footprint la rilevi — in nessun caso il componente responsabile di un criterio di accettazione viene sostituito.


  ---

  ## Strategia di test

  Il banco è uno strumento di misura, e uno strumento di misura sbagliato produce numeri plausibili e falsi che poi chiudono un ADR. La strategia mette quindi sotto test **lo strumento**, non solo il suo prodotto, su tre livelli.

  - **Unità (Swift Testing) sulla statistica e sul campionatore.** La statistica delle ripetizioni è verificata su serie con mediana, p95, deviazione standard e IQR calcolati a mano, inclusi i casi limite `n=1` e valori identici. Il campionatore di footprint è verificato allocando deliberatamente un blocco di dimensione nota e pretendendo che il picco osservato lo contenga: senza questo test un campionatore che restituisce sempre zero passerebbe inosservato e ogni misura di memoria del cancello sarebbe nulla.
  - **Unità sul generatore.** Conteggi per cella coerenti con `dataset.json`, somma pari al totale dichiarato, byte per megapixel entro la tolleranza dichiarata per formato, unicità effettiva del pool non clonato (confronto di digest sui primi kilobyte), distinzione di inode fra cloni, e il pre-volo che rifiuta di generare quando lo spazio libero non basta.
  - **Integrazione del banco sul profilo `--smoke`.** Un dataset minuscolo (poche decine di file) per cui tutti i sottocomandi di `bench` girano in pochi secondi. L'asserzione non è «il comando esce 0» ma: il JSON emesso valida contro lo schema, contiene esattamente le ripetizioni richieste, e ogni campo di dispersione è presente e finito. È il test che protegge dalla regressione più insidiosa dello spike — un banco che gira, stampa, e non misura niente.
  - **Verifica di tracciabilità sul documento.** Un controllo eseguibile confronta `RESULT.md` con i JSON versionati sotto `measurements/`: ogni `measurementId` citato esiste, ogni cifra riportata corrisponde al valore nel JSON, le quattro voci di esito di AC-6 esistono e portano un marcatore, e ogni soglia mancata compare fra le non supportabili. È l'unico modo per cui un criterio dimostrato da un documento abbia un oracolo e non una lettura.
  - **Ripetibilità dichiarata.** Ogni misura di AC-3 ha `n >= 5` e ogni cella di AC-4 `n >= 20`. Lo stato termico, l'alimentazione e la modalità a basso consumo sono registrati a ogni ripetizione: una serie eseguita sotto limitazione termica va riconosciuta come tale e non mediata con le altre.

  **Test di lunga durata.** La sessione lunga di AC-3 gira 60 minuti nel profilo pieno e 5 minuti nel profilo di sviluppo. Non entra in nessuna pipeline: l'introduzione della pipeline di integrazione continua è esplicitamente fuori ambito per questa spec, e il test di lunga durata che il PRD prescrive in CI appartiene alla costruzione del prodotto, non al cancello.

  ### Rinuncia ai test end-to-end di browser

  **Motivo:** non applicabile per natura. iMAGE Surfer è un'applicazione nativa macOS e questo cancello non produce alcuna superficie di prodotto: non esiste rotta, non esiste browser, non esiste sessione utente. Nemmeno XCUITest è in gioco, per due ragioni indipendenti: il cancello non produce interfaccia utente di prodotto da coprire, e `xcodebuild` non è disponibile in questo ambiente (solo Command Line Tools).

  **Livello di evidenza usato al suo posto:** il banco stesso. L'host AppKit non è la cosa sotto test, è lo strumento di misura: la sua correttezza è garantita dal fatto che ogni criterio di accettazione è dimostrato da un JSON con dispersione e ripetizioni, verificato dal test di integrazione sul profilo `--smoke`, e ricondotto al documento dal controllo di tracciabilità. Ogni AC affetto — AC-3, AC-4, AC-5 — ha il proprio oracolo in quella catena e nessuno dipende dall'ispezione visiva di una finestra.

  **Filmabilità.** Il percorso di `Dimostra` è filmabile come sessione di terminale: esecuzione della procedura, esecuzione del banco con le misure grezze a schermo, apertura di `RESULT.md`, e `git check-ignore` sul dataset. La configurazione di progetto ha `e2e.record_demo_video: false` e la decisione finale di registrare o saltare appartiene ad `archetipo-review`, non a questa pianificazione.


  ---

  ## Impatto sulla Wiki

  ```yaml
  wiki_impact:
    read: [references/prd]
    update: [overview, engineering/code-map, operations/development, architecture/context-map]
    create: [decisions/work-admission-budget]
  ```

  `archetipo wiki affected` sui percorsi attesi (`Spikes/01-scale-memory/Package.swift`, `RESULT.md`, `PROCEDURE.md`, `.gitignore`) ha restituito quattro candidati. La discriminante applicata a ciascuno non è «il file che ha prodotto la corrispondenza è importante» ma **«questa spec fa qualcosa che questa pagina afferma?»** — e qui il caso è netto, perché tutte e quattro le pagine core sono ancorate alla radice del progetto (`.`) proprio per l'affermazione *non esiste ancora codice*, che questa spec rende falsa. Una riga di motivazione per pagina:

  - **`overview`** — la sezione *Stack* afferma «lo stack è prescritto dal PRD e non ancora presente nel repository. Nessun manifest di build, nessuna configurazione di progetto e nessun file sorgente sono stati rilevati», e la *Nota sull'ancoraggio delle evidenze* prescrive di restringere l'ancoraggio «appena esistono directory sorgente reali». Questa spec introduce il primo manifest SwiftPM e i primi file sorgente Swift del repository: entrambe le affermazioni decadono e la condizione della nota si verifica. → **update**.
  - **`engineering/code-map`** — afferma «la tabella è vuota per constatazione», «l'ispezione ha rilevato un solo file nel repository (`docs/PRD.md`)» e «nessun codice non mappato». Sono affermazioni su *insiemi* di file, e diventano false per la comparsa di codice in qualunque punto dell'albero, incluso `Spikes/`. → **update**.
  - **`operations/development`** — afferma «nel repository non esiste alcuna toolchain… zero manifest, zero configurazioni, zero automazioni e zero test. Non esiste un comando di build, non esiste un comando di test, e non esiste nulla da eseguire». Dopo questa spec esistono tutti e tre: `swift build`, `swift test` e un banco da eseguire. La stessa pagina ospita la tabella dei quattro cancelli e la frase «soglie dichiarate e non misure ottenute», che per il cancello n°1 cessa di valere. → **update**.
  - **`architecture/context-map`** — l'area prevista *Ammissione del lavoro* è registrata con evidenza «nessuna» e la sezione *Incertezze* dichiara ADR-009 fra i cinque ADR provvisori «subordinati all'esito di quattro cancelli tecnici». Questa spec chiude ADR-009 e produce le stime calibrate che quell'area attendeva: entrambe le affermazioni cambiano. → **update**.
  - **`references/prd`** — è la rappresentazione del PRD come concetto di riferimento, con `docs/PRD.md` come sorgente originale. La spec **non modifica il PRD**: `RESULT.md` porta il testo di sostituzione degli ADR emendati, non lo applica al documento di prodotto. La pagina ha informato la pianificazione (ADR-009, ADR-015, NFR-P1, NFR-P6, NFR-P9, NFR-P10, NFR-P12) ma nessuna sua affermazione decade. → **read**, non `update`.
  - **`decisions/work-admission-budget`** — non esiste e va creata: la ricerca `archetipo wiki search --type decision` ha restituito zero pagine, quindi non c'è nessun ID stabile da riusare, e la decisione supera la soglia ADR per i motivi già argomentati nella soluzione tecnica. È la sede durevole della politica misurata, quella che gli implementatori delle Tappe successive consulteranno al posto di `Spikes/01-scale-memory/RESULT.md`. → **create**.

  Ogni ID in `update` e `create` ha un task dedicato che ne nomina l'ID canonico. I quattro task di aggiornamento portano `archetipo wiki --project-root /Users/gia/iMAGE_Surfer reset <page-id>` come **primo passo** e pretendono `state: generated` in `archetipo wiki status` fra i criteri di completamento: non si modifica a mano il blocco `review` — si usa `archetipo wiki reset`.

  _Piano generato da ARchetipo Planning — 2026-08-26_
