  - id: TASK-03
    title: Kernel di misura BenchKit - campionatore phys_footprint, statistica delle ripetizioni, impronta hardware, schema JSON
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `BenchKit` offre un campionatore di memoria, una statistica di dispersione, un'impronta hardware completa e uno schema JSON di risultato, così che ogni banco successivo produca cifre attribuibili e ripetute senza reimplementare nulla.

      ## Read
      - `Spikes/01-scale-memory/Package.swift` — il target `BenchKit`.
      - `docs/PRD.md` righe 740-743 — NFR-P9, NFR-P10, NFR-P12, per le grandezze che il kernel deve saper esprimere.
      - Nota già verificata in fase di pianificazione: `task_info(mach_task_self_, task_flavor_t(TASK_VM_INFO), …)` restituisce `kr = 0` e un `phys_footprint` valido su questo ambiente. Non serve riscoprirlo.

      ## Change
      - Nuovi file in `Spikes/01-scale-memory/Sources/BenchKit/`: `FootprintSampler.swift`, `Dispersion.swift`, `HostFingerprint.swift`, `MeasurementResult.swift`, `ResultWriter.swift`.
      - **Non-obiettivi:** nessun banco, nessuna finestra, nessuna generazione di dataset in questo task; nessuna grandezza di memoria diversa da `phys_footprint`.

      ## Steps
      1. `FootprintSampler.swift`: attore o classe `Sendable` che campiona `phys_footprint` via `task_info(TASK_VM_INFO)` su un thread dedicato a intervallo configurabile (parametro `intervalMs`, usato a 50 ms per scorrimento e sessione lunga, a 5 ms per il costo per elemento). Espone `start()`, `stop() -> FootprintTrace`, e `current() -> UInt64`. `FootprintTrace` contiene i campioni con timestamp monotono (`DispatchTime.now().uptimeNanoseconds`), `peak`, `first`, `last`, e `baseline` impostato dal chiamante prima dell'avvio. Usa `phys_footprint` come **unica** grandezza di memoria: non mescolare `resident_size`, che misura una cosa diversa.
      2. Aggiungi a `FootprintTrace` il calcolo `slopeBytesPerHour` con regressione lineare ai minimi quadrati sui campioni, più `slopeConfidenceInterval95` (errore standard della pendenza × 1,96). Serve a NFR-P9, che chiede l'assenza di crescita monotona: una pendenza il cui intervallo di confidenza contiene lo zero non è crescita, e va riportata come tale invece di essere arrotondata a «stabile».
      3. `Dispersion.swift`: `struct Dispersion` con `n`, `min`, `median`, `p95`, `max`, `mean`, `stddev` (deviazione standard campionaria, denominatore `n-1`), `iqr`. Inizializzatore da `[Double]`. Definisci i percentili con interpolazione lineare fra ranghi e documenta la convenzione in commento: due implementazioni di p95 diverse producono cifre diverse nello stesso documento, e questo cancello pubblica p95 come stima adottata. Con `n == 1` restituisci `stddev = 0` e `iqr = 0` senza divisione per zero; con array vuoto restituisci `nil`.
      4. `HostFingerprint.swift`: `struct HostFingerprint: Codable` raccolta a ogni esecuzione, tutti i campi non vuoti:
         - `model` da `sysctlbyname("hw.model")`, `cpuBrand` da `machdep.cpu.brand_string`.
         - `physicalMemoryBytes` da `hw.memsize`, `performanceCores` da `hw.perflevel0.logicalcpu`, `efficiencyCores` da `hw.perflevel1.logicalcpu`, `activeProcessorCount`.
         - `osProductVersion` e `osBuildVersion` da `ProcessInfo.processInfo.operatingSystemVersionString` e `sysctlbyname("kern.osversion")`.
         - `swiftVersion` compilata staticamente, `sdkVersion` letta da `/usr/bin/xcrun --show-sdk-version` con fallback a stringa vuota **solo** se il comando fallisce.
         - `volumeFileSystemType` e `volumeIsSolidState` per il volume che contiene il dataset, `volumeAvailableBytes`.
         - `thermalState` da `ProcessInfo.processInfo.thermalState`, `lowPowerModeEnabled`, `onACPower` da `IOPSCopyPowerSourcesInfo`.
         Aggiungi `func assertComplete() throws` che fallisce nominando ogni campo vuoto o pari a zero: AC-2 chiede che l'hardware sia dichiarato, e un campo vuoto silenzioso è un'attribuzione mancante.
      5. `MeasurementResult.swift`: `struct MeasurementResult: Codable` con `schema: "image-surfer/spike-01/measurement/v1"`, `measurementId` (UUID stringa, stampato anche a terminale), `bench` (nome del sottocomando), `startedAt`, `finishedAt`, `profile`, `datasetManifestDigest`, `host: HostFingerprint`, `parameters: [String: String]`, `repetitions: [Repetition]` e `dispersion: [String: Dispersion]`. `Repetition` contiene `index`, i valori misurati come `[String: Double]`, `thermalStateAtStart` e `thermalStateAtEnd`: una ripetizione eseguita sotto limitazione termica va riconoscibile e non mediata alla cieca con le altre.
      6. `ResultWriter.swift`: scrive il risultato in `runs/<bench>-<timestamp>-<measurementId prefix>.json` con `JSONEncoder` a chiavi ordinate e output leggibile, e stampa a terminale un riepilogo compatto — `measurementId`, e per ogni grandezza `n`, mediana, p95 e deviazione standard. Il riepilogo a terminale è ciò che il revisore osserva nel percorso di `Dimostra`: deve contenere le cifre grezze, non un messaggio di successo.
      7. Esegui `swift format --in-place --recursive` sui percorsi modificati.

      ## Verify
      - Esegui: `swift build --package-path Spikes/01-scale-memory`
      - Attesa: `Build complete!`, zero errori e zero avvisi. Il target `BenchKit` compila in modalità Swift 6 con concorrenza stretta.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources`
      - Attesa: stato 0.
      - I test del kernel appartengono a TASK-04: qui non ci sono ancora asserzioni sul comportamento, e non promettere test verdi oltre a quello segnaposto di TASK-01.

      ## Done
      - [ ] AC-2 — `HostFingerprint` raccoglie modello, memoria fisica, tipo di filesystem e flag SSD del volume, versione e build di macOS, e `assertComplete()` fallisce nominando qualunque campo vuoto.
      - [ ] AC-3 — `Dispersion` espone `n`, mediana, p95, deviazione standard e IQR, con convenzione di percentile documentata; `FootprintTrace` espone picco e pendenza con intervallo di confidenza al 95%.
      - [ ] `phys_footprint` è l'unica grandezza di memoria usata dal kernel.
      - [ ] `ResultWriter` stampa a terminale le cifre grezze con `measurementId`, non un messaggio di esito.
      - [ ] `swift format lint --strict` esce 0 sui file creati.

      ## Blockers
      None.
    ref: TASK-03
