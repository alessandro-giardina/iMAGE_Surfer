      ## Objective
      Ogni cifra di `RESULT.md` è dimostrata rintracciabile in un JSON versionato, la suite e i controlli di stile e di Wiki sono verdi, e nessun task resta `TODO` prima che la spec venga inviata in revisione.

      ## Read
      - `Spikes/01-scale-memory/RESULT.md` — il documento da verificare.
      - I file di `Spikes/01-scale-memory/measurements/` — le sole fonti ammesse per le cifre del documento.
      - La sezione *Baseline* del piano — le attese di ogni comando, per non promettere verde dove la baseline è rossa.

      ## Change
      - Nuovo `Spikes/01-scale-memory/Tests/BenchKitTests/ResultTraceabilityTests.swift`.
      - **Non-obiettivi:** nessuna modifica a `RESULT.md`, alle pagine Wiki o al codice del banco in questo task. Se il controllo di tracciabilità trova una discrepanza, la correzione appartiene al task che ha prodotto il difetto — TASK-09 per le misure, TASK-10 per l'esito — e questo cancello riporta il difetto invece di rattopparlo.

      ## Steps
      1. Scrivi `ResultTraceabilityTests.swift`. È l'oracolo eseguibile dei criteri dimostrati da un documento, e verifica quattro cose leggendo `RESULT.md` e i JSON di `measurements/`:
         a. **Esistenza dei riferimenti.** Estrai con espressione regolare ogni `measurementId` citato nel documento e pretendi che ognuno esista in almeno un file di `measurements/`. Un identificatore citato e assente è una cifra inventata.
         b. **Corrispondenza delle cifre.** Per ogni tabella delle sezioni *Misure grezze* e *Stime di costo in memoria*, confronta i valori scritti con quelli del JSON corrispondente, con tolleranza pari alla precisione di arrotondamento dichiarata nel documento. Un valore che non combacia fallisce il test nominando riga e grandezza.
         c. **Completezza dell'esito (AC-6).** Pretendi che esistano esattamente quattro voci di esito, una per `ADR-009`, `NFR-P1`, `NFR-P9`, `NFR-P10`, e che ciascuna porti **uno e un solo** marcatore fra **confermato** ed **emendato**. Pretendi che ogni voce **emendato** contenga un testo di sostituzione non vuoto e almeno un valore numerico.
         d. **Coerenza dell'hardware (AC-7).** Pretendi che ogni file di `measurements/` riporti un blocco `host` con `model`, `physicalMemoryBytes` e `osBuildVersion` **identici** a quelli dichiarati in § *Hardware di misura*. È il controllo che rende verificabile il divieto di AC-7: una misura ripetuta su una configurazione diversa per ottenere una conferma comparirebbe qui come `host` divergente e farebbe fallire il cancello.
         e. **Simmetria delle soglie non supportabili (AC-7).** Per ogni voce di esito marcata **emendato** perché una soglia dichiarata non è raggiunta, pretendi una voce corrispondente nella sezione *Soglie non supportabili*. Il controllo vale nei due versi: nessuna soglia mancata può mancare dalla sezione.
      2. Esegui `swift format --in-place --recursive Spikes/01-scale-memory/Tests`.
      3. Esegui i controlli finali nell'ordine sotto la voce *Verify*. Non dedurre la suite finale dalle convenzioni del progetto: sono elencati per intero perché la baseline ha rilevato che due strumenti attesi — `xcodebuild` e `swiftlint` — non esistono su questa macchina, e nessuno dei due va invocato.
      4. Solo dopo che ogni controllo è verde, marca **questo** task come `DONE`.
      5. Poi, e solo poi, ricarica la spec e verifica lo stato di tutti i task: `archetipo spec show US-001` da `/Users/gia/iMAGE_Surfer`. Nessun task deve risultare `TODO`.
      6. Solo se nessun task è `TODO`, invoca `archetipo spec review US-001` da `/Users/gia/iMAGE_Surfer`. L'ordine è vincolante: eseguire i controlli, marcare questo task `DONE`, ricaricare la spec, confermare che nessun task è rimasto `TODO`, e soltanto allora chiedere la revisione. Chiedere la revisione con un task ancora `TODO` è un difetto di processo.

      ## Verify
      - Esegui: `swift build --package-path Spikes/01-scale-memory`
      - Attesa: `Build complete!`, zero errori e **zero avvisi**. Tutti i file Swift del piano sono nuovi, quindi la soglia è zero diagnostiche e non «nessuna diagnostica nuova».
      - Esegui: `swift test --package-path Spikes/01-scale-memory`
      - Attesa: **tutti** i test verdi — unità di TASK-04, integrazione di TASK-08 e tracciabilità di questo task.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources Spikes/01-scale-memory/Tests`
