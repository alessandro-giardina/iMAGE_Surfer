      ## Objective
      I test dimostrano che lo strumento di misura misura: la statistica calcola i valori attesi su serie note, il campionatore rileva un'allocazione deliberata, e il generatore produce le segmentazioni dichiarate con file effettivamente unici o effettivamente clonati.

