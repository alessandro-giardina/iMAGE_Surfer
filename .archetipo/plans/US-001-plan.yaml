  - id: TASK-06
    title: bench scroll-memory su 50.000 file con sessione di lunga durata e bench retention-band con isteresi
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Il banco misura l'occupazione di picco su 50.000 immagini con scorrimento continuo, l'andamento in sessione di lunga durata, e il costo di ricalcolo di un piccolo movimento di scorrimento per ogni coppia di soglie della banda di ritenzione.

      ## Read
      - `Spikes/01-scale-memory/Sources/BenchKit/BenchHost.swift` e `ThumbnailPipeline.swift` — l'host e le code create in TASK-05.
      - `Spikes/01-scale-memory/Sources/BenchKit/FootprintSampler.swift` — picco e pendenza con intervallo di confidenza.
      - `docs/PRD.md` righe 737, 740, 743 — NFR-P6 (banda con soglie distinte di entrata e uscita, un piccolo movimento non perde il lavoro appena svolto), NFR-P9 (tetto di picco e assenza di crescita monotona), NFR-P12 (l'ampiezza della banda è un parametro del budget, non una costante di interfaccia).

      ## Change
      - Nuovi file in `Spikes/01-scale-memory/Sources/BenchKit/`: `RetentionBand.swift`, `ScrollMemoryBench.swift`, `RetentionBandBench.swift`.
      - `Spikes/01-scale-memory/Sources/bench/main.swift` — aggiunge i due sottocomandi.
      - `Spikes/01-scale-memory/PROCEDURE.md` — riempie i `TODO` relativi.
      - **Non-obiettivi:** la banda implementata qui è materiale del banco e non la forma definitiva; non estrarla in un pacchetto riutilizzabile. Non introdurre alcuna pipeline di integrazione continua: il test di lunga durata di questo cancello si esegue a mano, e la CI è fuori ambito per questa spec.

      ## Steps
      1. `RetentionBand.swift`: la forma minima della banda con isteresi. Un elemento **entra** nell'insieme trattenuto quando la sua distanza dalla porta di vista è inferiore a `enterBand` schermate, e viene **rilasciato** solo quando supera `exitBand` schermate, con `exitBand > enterBand`. Il rilascio avvolge ogni elemento in un blocco esplicito che azzera il riferimento all'immagine. Espone due contatori osservabili, indispensabili alla misura di AC-5: `regeneratedCount`, quante anteprime sono state ricalcolate perché rilasciate e poi richieste di nuovo, e `retainedCount`.
      2. `ScrollMemoryBench.swift`, misura di picco su `scroll-50k`:
         a. Avvia il campionatore a 50 ms e registra la baseline prima di aprire la cartella.
         b. Scorri programmaticamente a velocità dichiarata (default 3 schermate al secondo, parametro `--scroll-speed`) dall'inizio alla fine della cartella e poi indietro fino all'inizio, così che ogni elemento entri ed esca dalla banda almeno una volta.
         c. Riporta `peakFootprintBytes`, `plateauFootprintBytes` (mediana dei campioni dell'ultimo terzo della corsa) e `marginalBytesPer1000Items` calcolato sul tratto centrale, dove il regime è stabile.
         d. Ripeti `--repetitions` volte (default 5) ricostruendo l'host fra le corse, e riporta la dispersione.
      3. `ScrollMemoryBench.swift`, sessione di lunga durata: modalità `--long-session <minuti>` (default 60 nel profilo pieno, 5 nel profilo di sviluppo, 1 nel profilo `smoke`). Alterna raffiche di scorrimento e periodi di quiete a proporzione dichiarata, campiona a 50 ms per tutta la durata, e riporta `longSessionSlopeBytesPerHour` con l'intervallo di confidenza al 95% calcolato dal kernel, il picco, e il footprint finale contro quello iniziale. **La conclusione va formulata sull'intervallo di confidenza, non sul segno della pendenza:** NFR-P9 chiede l'assenza di crescita monotona, e una pendenza il cui intervallo contiene lo zero non è crescita. Riporta esplicitamente `slopeDistinguishableFromZero: Bool`.
      4. `RetentionBandBench.swift`, spazzolamento delle soglie. Per ogni combinazione di `enterBand ∈ {0,5, 1, 2, 3, 4}` schermate e `delta ∈ {0,5, 1, 2}` con `exitBand = enterBand + delta`:
         a. Porta la vista al centro della cartella da 50.000 file e attendi il regime; registra `steadyFootprintBytes` e `retainedCount`.
         b. **Oscillazione piccola:** azzera `regeneratedCount`, scorri di +0,25 schermate e torna a −0,25 per 10 cicli, e registra `regeneratedSmall` e il tempo di parete e il costo in memoria della rigenerazione. È la misura che AC-5 pretende come motivazione dell'ampiezza scelta.
         c. **Oscillazione media:** ripeti con ±1 schermata e registra `regeneratedMedium`.
         d. Emetti una riga per combinazione, con `enterBand`, `exitBand`, `steadyFootprintBytes`, `retainedCount`, `regeneratedSmall`, `regeneratedMedium`, `regenerationWallClockMs`.
         e. Calcola e riporta nel risultato la **coppia raccomandata**: la più piccola `(enterBand, exitBand)` per cui `regeneratedSmall == 0`, indicando il costo in memoria di regime che quella coppia comporta. Se nessuna combinazione azzera `regeneratedSmall`, riporta `recommendation: nil` con il motivo: è un esito legittimo che TASK-10 tratterà come soglia non supportabile, non un errore da aggirare allargando lo spazzolamento.
      5. Aggiungi a `main.swift` i sottocomandi `scroll-memory` (con `--long-session <minuti>`, `--scroll-speed`, `--repetitions`) e `retention-band`, con le stesse opzioni comuni e la stessa verifica del manifest già presente in TASK-05.
      6. Riempi i `TODO` di `PROCEDURE.md` per questi sottocomandi, indicando che la sessione di lunga durata occupa 60 minuti nel profilo pieno.
      7. Esegui `swift format --in-place --recursive` sui percorsi modificati.

      ## Verify
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench scroll-memory --profile smoke --data /tmp/spike01-smoke --repetitions 2 --long-session 1 --out /tmp/spike01-runs`
      - Attesa: stato 0; il JSON contiene `peakFootprintBytes`, `plateauFootprintBytes`, `marginalBytesPer1000Items` con dispersione a `n == 2`, e il blocco di sessione lunga con `longSessionSlopeBytesPerHour`, l'intervallo di confidenza e `slopeDistinguishableFromZero`. Tutti i valori finiti; il picco superiore alla baseline.
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench retention-band --profile smoke --data /tmp/spike01-smoke --out /tmp/spike01-runs`
      - Attesa: stato 0; il JSON contiene 15 righe (5 valori di `enterBand` × 3 di `delta`), ciascuna con `regeneratedSmall` e `regeneratedMedium` presenti, e un campo `recommendation` presente — valorizzato o esplicitamente nullo con motivo.
      - Esegui: `swift build --package-path Spikes/01-scale-memory && swift test --package-path Spikes/01-scale-memory`
      - Attesa: build senza errori né avvisi; test di TASK-04 ancora verdi.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources`
      - Attesa: stato 0.
      - **Non** eseguire il profilo `full`: appartiene a TASK-09.

      ## Done
      - [ ] AC-3 — `bench scroll-memory` produce l'occupazione di picco su 50.000 immagini con scorrimento continuo, con ripetizioni e dispersione.
      - [ ] AC-3 — la sessione di lunga durata produce l'andamento dell'occupazione con pendenza, intervallo di confidenza al 95% e `slopeDistinguishableFromZero`, invece di un giudizio «stabile» non quantificato.
      - [ ] AC-5 — `bench retention-band` produce, per ogni coppia di soglie distinte di entrata e uscita, il footprint di regime e il numero di anteprime rigenerate da un'oscillazione di ±0,25 e ±1 schermate, con il costo di parete della rigenerazione.
      - [ ] AC-5 — il risultato include la coppia raccomandata secondo la regola dichiarata, oppure `recommendation: nil` con il motivo se nessuna combinazione azzera il ricalcolo sull'oscillazione piccola.
      - [ ] Nulla è stato creato fuori da `Spikes/01-scale-memory/` e nessuna pipeline di CI è stata introdotta.
      - [ ] `swift build` e `swift test` verdi, `swift format lint --strict` a stato 0.

      ## Blockers
      None.
