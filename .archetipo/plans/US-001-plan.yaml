  - id: TASK-11
    title: Wiki - crea la pagina di decisione decisions/work-admission-budget
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      La Wiki contiene `decisions/work-admission-budget`, prima pagina `type: decision` del progetto, che registra come conoscenza durevole la politica di ammissione del lavoro con banda di ritenzione chiusa da questo cancello.

      ## Read
      - `.claude/skills/archetipo-wiki/references/wiki-contract.md` righe 74-101 — il contratto delle pagine `type: decision`: frontmatter, `decision_status`, i cinque marcatori di sezione obbligatori, e la regola che le pagine di decisione richiedono evidenza di repository in `sources`.
      - `Spikes/01-scale-memory/RESULT.md` § *Esito* e § *Conseguenze per la costruzione* — la sostanza della decisione e i valori misurati.
      - `docs/wiki/architecture/context-map.md` sezione *Incertezze* — la voce che dichiara ADR-009 provvisorio, a cui questa pagina risponde.
      - `docs/wiki/index.md` — per capire come il catalogo raggruppa i concetti; **non modificarlo a mano**, lo scrive la CLI.

      ## Change
      - Nuovo `docs/wiki/decisions/work-admission-budget.md`.
      - `docs/wiki/index.md` — **solo** tramite `archetipo wiki catalog`, mai a mano.
      - **Non-obiettivi:** nessun `wiki reset` in questo task, la pagina non esiste ancora e non ha stato di revisione da azzerare. Non toccare le altre quattro pagine: hanno un task ciascuna. Non modificare `docs/PRD.md`.

      ## Steps
      1. Crea `docs/wiki/decisions/work-admission-budget.md` con questo frontmatter, adattando i valori a quanto misurato:
         - `type: decision`
         - `title: Ammissione del lavoro con stime calibrate e banda di ritenzione`
         - `description:` una riga che nomina la politica scelta e il fatto che è calibrata su misura.
         - `decision_status: accepted`
         - `status: generated`
         - `sources:` con evidenza di repository reale, come il contratto richiede — `Spikes/01-scale-memory/RESULT.md` con `role: verification`, il file di `Spikes/01-scale-memory/measurements/` della misura di costo per elemento con `role: verification`, e `Spikes/01-scale-memory/Sources/BenchKit/RetentionBand.swift` con `role: implementation`. Non citare `docs/PRD.md` come implementazione: è intento, non evidenza.
      2. Scrivi il corpo sotto i cinque marcatori obbligatori, nell'ordine del contratto, ciascuno con contenuto sostanziale:
         - `<!-- archetipo:wiki section=context -->` — le forze: l'ammissione precede l'esecuzione quindi il costo va stimato e non misurato al momento dell'ammissione; le soglie del PRD erano dichiarate e non misurate; una media misurata non protegge dall'elemento anomalo; la memoria è il rischio di esaurimento silenzioso identificato dal PRD.
         - `<!-- archetipo:wiki section=decision -->` — l'opzione scelta con i **valori misurati**: code specializzate per tipo sotto budget comune, stima adottata pari al p95 per cella, margine di sicurezza dichiarato, limite per singolo elemento con la sua formula, e la coppia di soglie della banda di ritenzione. Riporta le cifre da `RESULT.md`, non descrizioni qualitative.
         - `<!-- archetipo:wiki section=alternatives -->` — almeno due alternative reali con il motivo dello scarto: punto unico di ammissione con stima per pixel, scartato perché i pixel non stimano il costo di un modello di visione o di un contenitore multipagina e perché concentra in un componente la conoscenza di ogni tipo di lavoro; rilascio immediato di ciò che esce dalla porta di vista senza banda, scartato con il costo di ricalcolo misurato dell'oscillazione piccola come prova; stima come media anziché p95, scartata con il massimo osservato nella cella degli anomali come prova.
         - `<!-- archetipo:wiki section=consequences -->` — vantaggi e svantaggi, incluse le implicazioni operative: la banda è memoria occupata di proposito; le stime sono rivedibili con la misura a posteriori; il test di lunga durata è parte del contratto; e **il vincolo di attribuzione** — le cifre valgono per l'hardware dichiarato in `RESULT.md`, che ha 32 GB e non è il Mac con meno memoria in target, quindi il margine di sicurezza copre quello scarto e va rivisto quando si misurerà su una configurazione più piccola.
         - `<!-- archetipo:wiki section=verification -->` — cita `Spikes/01-scale-memory/RESULT.md`, i file di `measurements/` e i sottocomandi del banco che producono l'evidenza.
      3. Se `RESULT.md` ha registrato ADR-009 come **emendato**, la pagina descrive la politica **emendata** e dice esplicitamente in `context` che sostituisce la formulazione dichiarata nel PRD, citando entrambe. Non esiste una pagina `type: decision` precedente da marcare `superseded`: la ricerca in fase di pianificazione ha restituito zero pagine di decisione, quindi non c'è storia da collegare.
      4. Ricostruisci il catalogo: `archetipo wiki catalog` da `/Users/gia/iMAGE_Surfer`. Non scrivere né riformattare `index.md` o `log.md` a mano — la CLI è l'unico scrittore.

      ## Verify
      - Esegui da `/Users/gia/iMAGE_Surfer`: `archetipo wiki validate`
      - Attesa: `ok: true`, 6 pagine, nessun rilievo bloccante. La baseline registrava 5 pagine tutte valide: il conteggio sale a 6 e la validità resta.
      - Esegui: `archetipo wiki status`
      - Attesa: `decisions/work-admission-budget` presente con `state: generated` e nessun `issues`.
      - Esegui: `grep -c "archetipo:wiki section=" docs/wiki/decisions/work-admission-budget.md`
      - Attesa: 5 — i cinque marcatori del contratto delle decisioni.
      - Esegui: `grep -q "decision_status: accepted" docs/wiki/decisions/work-admission-budget.md && echo ok-status`
      - Attesa: stampa `ok-status`.
      - Esegui: `git diff --stat docs/wiki/index.md`
      - Attesa: `index.md` risulta modificato — dalla CLI, non a mano — e contiene una voce per la nuova pagina.

      ## Done
      - [ ] `docs/wiki/decisions/work-admission-budget.md` esiste con `type: decision`, `decision_status: accepted`, `status: generated` e i cinque marcatori di sezione tutti con contenuto sostanziale.
      - [ ] Il cambiamento di conoscenza è registrato: la politica di ammissione passa da ipotesi provvisoria del PRD a decisione chiusa con valori misurati, con le cifre prese da `RESULT.md` e non descrizioni qualitative.
      - [ ] `sources` cita evidenza di repository reale — `RESULT.md`, un file di `measurements/`, `RetentionBand.swift` — e non `docs/PRD.md` come implementazione.
      - [ ] La sezione `consequences` dichiara il vincolo di attribuzione all'hardware di misura.
      - [ ] `archetipo wiki validate` restituisce `ok: true` e `archetipo wiki status` riporta la pagina come `generated`.
      - [ ] `index.md` è stato aggiornato da `archetipo wiki catalog` e non a mano.

      ## Blockers
      None.
