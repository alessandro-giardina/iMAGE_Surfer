  - id: TASK-02
    title: dataset.json versionato e generatore gen-dataset con manifest e pre-volo sullo spazio
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `swift run gen-dataset` produce l'insieme da 50.000 file segmentato per formato e classe di risoluzione, più le cartelle uniche per la misura di prima schermata, e scrive un manifest che rende ogni conteggio verificabile.

      ## Read
      - `Spikes/01-scale-memory/Package.swift` — i target creati in TASK-01.
      - `Spikes/01-scale-memory/PROCEDURE.md` — i segnaposto `TODO(TASK-02)` da riempire.
      - `docs/PRD.md` riga 508 — «I cancelli tecnici richiedono in aggiunta materiale non versionabile — un insieme di 50.000 file… la cui procedura di generazione e configurazione è versionata sotto `Spikes/`».

      ## Change
      - Nuovo `Spikes/01-scale-memory/dataset.json` — configurazione **versionata**.
      - Nuovi file in `Spikes/01-scale-memory/Sources/BenchKit/`: `DatasetConfig.swift`, `ImageSynthesis.swift`, `DatasetManifest.swift`.
      - `Spikes/01-scale-memory/Sources/gen-dataset/main.swift` — sostituisce il segnaposto.
      - `Spikes/01-scale-memory/PROCEDURE.md` — riempie i `TODO(TASK-02)`.
      - **Non-obiettivi:** nessuna misura di prestazione in questo task; nessuna scrittura fuori dalla directory di uscita; non versionare i file generati.

      ## Steps
      1. Scrivi `dataset.json` con `schema: "image-surfer/spike-01/dataset/v1"`, `seed: 20260826`, e:
         - `resolutionClasses`: `S: [1600, 1200]` (2 MP), `M: [4032, 3024]` (12 MP), `L: [8000, 6000]` (48 MP).
         - `bytesPerMegapixelTarget`: `jpeg: 0.35`, `heic: 0.18`, `png: 1.5`, `tiff: 3.0` (in MB/MP), con `tolerance: 0.20`.
         - `scrollFolder`: `name: "scroll-50k"`, `total: 50000`, `uniquePerCell: 250`, `cloneRemainder: true`, e `distribution` per formato e classe: `jpeg {S: 6000, M: 21000, L: 3000}`, `heic {S: 2500, M: 9000, L: 1000}`, `png {S: 3000, M: 1800, L: 200}`, `tiff {S: 1500, M: 900, L: 100}`. La somma è esattamente 50.000.
         - `firstScreenFolders`: `count: 5`, `size: 3000`, `unique: true`, `cloneRemainder: false`, `distribution` con la stessa asimmetria: `jpeg {S: 360, M: 1260, L: 180}`, `heic {S: 150, M: 540, L: 60}`, `png {S: 180, M: 108, L: 12}`, `tiff {S: 90, M: 54, L: 6}`. La somma è esattamente 3.000 per cartella.
         - `itemCostPool`: `uniquePerCell: 25`.
         - `anomalousItems`: `[{format: "tiff", pixels: [16000, 12000], count: 3}]`.
         - `smokeProfile`: gli stessi campi ridotti — `scrollFolder.total: 240`, `uniquePerCell: 4`, `firstScreenFolders {count: 2, size: 24}`, `itemCostPool.uniquePerCell: 2`, `anomalousItems[0].count: 1`.
      2. In `DatasetConfig.swift` definisci i tipi `Decodable` che rispecchiano lo schema, con validazione all'atto della decodifica: la somma di `distribution` deve combaciare con `total`/`size`, altrimenti errore esplicito che nomina la cella incoerente.
      3. In `ImageSynthesis.swift` implementa la sintesi del contenuto. **Non usare rumore puro:** una JPEG da 12 MP di rumore pesa circa 9,3 MB contro i circa 4 MB di una fotografia reale, e gonfierebbe la misura di I/O. Componi invece, in un `CGContext` sRGB a 8 bit per componente, tre strati: un gradiente a bassa frequenza, una texture a media frequenza generata da un PRNG deterministico seminato con `seed` combinato all'indice del file, e una regione di dettaglio ad alta frequenza pari a circa un decimo dell'area. Codifica con `CGImageDestinationCreateWithURL` verso `public.jpeg`, `public.heic`, `public.png`, `public.tiff`. Per JPEG e HEIC calibra `kCGImageDestinationLossyCompressionQuality` con una ricerca binaria di al massimo 6 iterazioni su un campione per cella, per centrare `bytesPerMegapixelTarget` entro `tolerance`; riusa la qualità trovata per tutti i file della cella. Registra nel manifest il valore di qualità e i byte per megapixel effettivamente ottenuti.
      4. In `main.swift` di `gen-dataset` implementa la riga di comando **senza librerie esterne**, parsando `CommandLine.arguments`: `--config <path>` (default `dataset.json` accanto all'eseguibile o passato per percorso), `--out <path>` (default `Spikes/01-scale-memory/.data`), `--profile full|smoke` (default `full`), `--force`. Su argomento sconosciuto stampa l'uso ed esci con stato 2.
      5. Implementa il **pre-volo**, prima di scrivere qualunque file: stima lo spazio richiesto sommando, per ogni cella, `conteggioUnico × megapixel × bytesPerMegapixelTarget`; leggi lo spazio libero con `URL.resourceValues(forKeys: [.volumeAvailableCapacityForImportantUsageKey])`; se lo spazio libero è inferiore a `stima × 1,3` termina con stato 1 e un messaggio che riporta stima, disponibile e il suggerimento di ridurre `firstScreenFolders.count`. Verifica anche che il volume di uscita supporti i cloni, provando un `clonefile` su un file temporaneo e ricadendo su copia piena con avviso esplicito se fallisce.
      6. Genera in questo ordine, parallelizzando la codifica su `ProcessInfo.processInfo.activeProcessorCount` con un `TaskGroup` a larghezza limitata:
         a. `firstScreenFolders`: `count` cartelle `p1-run-01/ … p1-run-05/`, ciascuna con `size` file **tutti unici e mai clonati**, disgiunte fra loro. È il regime in cui l'I/O a freddo è l'oggetto della misura: nessun clone qui.
         b. `scrollFolder`: per ogni cella genera `uniquePerCell` file unici, poi porta la cella al conteggio dichiarato con cloni APFS via `clonefile(2)`, ciascuno con nome distinto.
         c. `itemCostPool/`: `uniquePerCell` file unici per cella, tutti non clonati.
         d. `anomalous/`: gli elementi anomali dichiarati.
      7. Scrivi `dataset-manifest.json` nella directory di uscita (quindi **non** versionato) con: `schema`, `configDigest` (SHA-256 di `dataset.json`), `seed`, `profile`, `generatedAt`, e per ogni cella `format`, `resolutionClass`, `pixels`, `uniqueCount`, `cloneCount`, `totalCount`, `bytesTotal`, `bytesPerMegapixelAchieved`, `encoderQuality`. Aggiungi in testa `totals` con `total`, `uniqueTotal`, `cloneTotal`, `bytesTotal`. Se una cella non centra la tolleranza, registra `toleranceMiss: true` sulla cella e stampa un avviso, senza fallire.
      8. Riempi i `TODO(TASK-02)` di `PROCEDURE.md` con i comandi esatti, lo spazio atteso e il tempo atteso.
      9. Esegui `swift format --in-place --recursive` sui percorsi modificati.

      ## Verify
      - Esegui: `swift build --package-path Spikes/01-scale-memory`
      - Attesa: `Build complete!`, zero errori e zero avvisi.
      - Esegui: `swift run --package-path Spikes/01-scale-memory gen-dataset --profile smoke --out /tmp/spike01-smoke --force`
      - Attesa: stato 0 in meno di un minuto; `/tmp/spike01-smoke/dataset-manifest.json` esiste; `totals.total` è 240 e `firstScreenFolders` sono 2 cartelle da 24 file.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources`
      - Attesa: stato 0.
      - Esegui: `git check-ignore -q Spikes/01-scale-memory/.data && echo IGNORATO`
      - Attesa: stampa `IGNORATO`. Se la directory non esiste ancora, creala vuota con `mkdir -p` prima del controllo.
      - **Non** eseguire il profilo `full` in questo task: la generazione completa appartiene a TASK-09, che la esegue una volta sola.

      ## Done
      - [ ] AC-1 — `dataset.json` e il generatore sono versionati; il generatore produce l'insieme segmentato per formato e classe di risoluzione ed è eseguibile da un altro sviluppatore seguendo solo `PROCEDURE.md`.
      - [ ] AC-1 — `dataset-manifest.json` riporta conteggi per cella, unici e cloni distinti, e la somma dichiarata; sul profilo `smoke` i conteggi combaciano con `smokeProfile`.
      - [ ] AC-1 — `git check-ignore -q Spikes/01-scale-memory/.data` esce 0 mentre `git ls-files Spikes/01-scale-memory/dataset.json` stampa il percorso.
      - [ ] Il pre-volo rifiuta la generazione con messaggio esplicito quando lo spazio libero è inferiore a 1,3 volte la stima.
      - [ ] Le cartelle di prima schermata contengono file unici e mai clonati; i cloni esistono solo dentro `scroll-50k`.

      ## Blockers
      None.
