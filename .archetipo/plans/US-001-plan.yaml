      - Esegui: `swift build` dalla radice del repository.
      - Attesa: **resta rosso** con `error: Could not find Package.swift…`, esattamente come registrato nella baseline. È corretto e non va corretto: il repository non ha un pacchetto alla radice. Non trattarlo come regressione.
      - **Non eseguire** `xcodebuild` né `swiftlint`: la baseline li ha rilevati assenti, e invocarli produrrebbe un rosso che non riguarda questo lavoro.
      - Esegui da `/Users/gia/iMAGE_Surfer`: `archetipo wiki validate`
      - Attesa: `ok: true`, 6 pagine, nessun rilievo bloccante (la baseline registrava 5 pagine valide).
      - Esegui: `archetipo wiki status`
      - Attesa: 6 pagine, **tutte** `generated`, nessuna `stale`, nessuna `attention`, nessun `issues`. Una pagina `stale` significa che un task l'ha modificata senza il `reset` iniziale.
      - Esegui: `git status --porcelain`
      - Attesa: solo i file previsti dal piano. In particolare nessun file dentro `Spikes/01-scale-memory/.data` o `runs` deve comparire come non tracciato.
      - Esegui: `git check-ignore -q Spikes/01-scale-memory/.data && git check-ignore -q Spikes/01-scale-memory/runs && echo "dati esclusi"`
      - Attesa: stampa `dati esclusi`.
