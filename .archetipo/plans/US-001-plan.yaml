  - id: TASK-15
    title: Wiki - aggiorna architecture/context-map con ADR-009 chiuso e l'area Ammissione del lavoro calibrata
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
      - TASK-11
    body: |-
      ## Objective
      La mappa dei contesti non elenca più ADR-009 fra gli ADR provvisori, e l'area prevista *Ammissione del lavoro* riporta l'evidenza che ora esiste — la sua politica misurata — restando priva di dominio.

      ## Read
      - `docs/wiki/architecture/context-map.md` — la riga *Ammissione del lavoro* della tabella delle aree previste, con evidenza «nessuna»; la sezione *Incertezze*, in particolare «Cinque ADR sono dichiarati provvisori dal PRD stesso… ADR-007 (recuperabilità dei lotti), 009 (code e budget), 011, 012 e 013 sono subordinati all'esito di quattro cancelli tecnici»; e l'ultima voce delle incertezze, che elenca gli assunti da validare, fra cui «costo in memoria per tipo di lavoro» e «ampiezza della banda di ritenzione».
      - `docs/wiki/decisions/work-admission-budget.md` — la pagina creata in TASK-11, da collegare.
      - `Spikes/01-scale-memory/RESULT.md` § *Esito* e § *Conseguenze per la costruzione*.

      ## Change
      - `docs/wiki/architecture/context-map.md` — la riga *Ammissione del lavoro* della tabella, la sezione *Infrastruttura condivisa* e la sezione *Incertezze*.
      - **Non-obiettivi:** **non creare una pagina di dominio per l'area Ammissione del lavoro.** Esistono la decisione e le sue cifre, non il codice di prodotto che ne dimostri il comportamento: la pagina non assegna domini senza codice, e il banco è dichiaratamente usa-e-getta. Non toccare le righe delle altre undici aree previste, che restano senza evidenza. Non toccare le altre pagine Wiki. Il frontmatter `sources` di questa pagina resta ancorato a `.`: la sua affermazione centrale — nessun contesto è evidenziato da codice — è **ancora vera** e decade appunto quando compare codice di prodotto in qualunque punto dell'albero.

      ## Steps
      1. **Primo passo, obbligatorio:** `archetipo wiki --project-root /Users/gia/iMAGE_Surfer reset architecture/context-map` da `/Users/gia/iMAGE_Surfer`.
      2. Nella tabella delle aree previste, aggiorna **solo** la riga *Ammissione del lavoro*. La colonna «Evidenza attuale» passa da «nessuna» a una descrizione precisa di ciò che ora esiste: nessun codice di prodotto, ma una politica misurata e chiusa, con rimando a `[Ammissione del lavoro con stime calibrate e banda di ritenzione](/decisions/work-admission-budget.md)`. Aggiorna anche la colonna «Responsabilità attesa» se le misure hanno cambiato la formulazione — per esempio se l'ampiezza della banda è ora un valore dichiarato invece di un'incognita.
      3. Nella sezione *Infrastruttura condivisa*, la voce che descrive l'ammissione del lavoro come «code specializzate per tipo sotto una politica di budget comune con costi misurati» va allineata all'esito: i costi sono ora **stime calibrate su misura**, con i valori in `RESULT.md`. Se ADR-009 è risultato **emendato**, riporta qui la formulazione emendata e non quella del PRD.
      4. Nella sezione *Incertezze*, il lavoro sostanziale:
         a. La voce sui cinque ADR provvisori diventa una voce su **quattro**: rimuovi ADR-009 dall'elenco e aggiungi la frase che lo dichiara chiuso dal cancello n°1, con l'esito e il rimando. Non riscrivere la voce come se nulla fosse cambiato: la pagina dichiara questa come «la principale incertezza della mappa», e una delle cinque è caduta.
         b. Nell'ultima voce, l'elenco degli assunti da validare: rimuovi «costo in memoria per tipo di lavoro» e «ampiezza della banda di ritenzione», ora misurati, e lascia intatti tutti gli altri.
         c. Se `RESULT.md` ha registrato soglie **non supportabili**, aggiungile come nuova voce di incertezza con la modifica proposta al requisito: una soglia caduta non è un'incertezza risolta, è un vincolo nuovo.
      5. Aggiungi la pagina di decisione all'elenco *Concetti collegati*.
      6. Se modifichi `description` nel frontmatter — plausibile, perché contiene «cinque ADR sono ancora provvisori» — esegui `archetipo wiki catalog` per rigenerare `index.md`, mai a mano.

      ## Verify
      - Esegui da `/Users/gia/iMAGE_Surfer`: `archetipo wiki status`
      - Attesa: `architecture/context-map` riporta `state: generated` e nessun `issues`.
      - Esegui: `archetipo wiki validate`
      - Attesa: `ok: true`, nessun rilievo bloccante.
      - Esegui: `grep -n "Cinque ADR" docs/wiki/architecture/context-map.md`
      - Attesa: nessun risultato — l'affermazione è stata sostituita con quella su quattro ADR.
      - Esegui: `grep -c "ADR-009" docs/wiki/architecture/context-map.md`
      - Attesa: almeno 1, in un contesto che lo dichiara chiuso e non provvisorio. Verifica leggendo la riga, non solo contandola.
      - Esegui: `grep -q "work-admission-budget" docs/wiki/architecture/context-map.md && echo collegata`
      - Attesa: stampa `collegata`.
      - Esegui: `ls docs/wiki/domains 2>/dev/null | wc -l`
      - Attesa: `0` oppure directory assente.
      - Esegui: `git diff --name-only docs/wiki`
      - Attesa: solo `docs/wiki/architecture/context-map.md` (più `index.md` se hai cambiato `description`).

      ## Done
      - [ ] Il cambiamento di conoscenza è registrato: ADR-009 non è più elencato fra gli ADR provvisori, e la voce dichiara che il cancello n°1 lo ha chiuso con il suo esito.
      - [ ] La riga *Ammissione del lavoro* riporta l'evidenza che esiste — la politica misurata — e collega `decisions/work-admission-budget`; le altre undici righe non sono state toccate.
      - [ ] Gli assunti «costo in memoria per tipo di lavoro» e «ampiezza della banda di ritenzione» sono stati rimossi dall'elenco di quelli da validare; gli altri restano.
      - [ ] Le eventuali soglie non supportabili di `RESULT.md` sono registrate come nuova incertezza con la modifica proposta.
      - [ ] **Nessuna pagina di dominio è stata creata** e il frontmatter resta ancorato a `.`, perché l'affermazione «nessun contesto è evidenziato da codice di prodotto» è ancora vera.
      - [ ] Il primo passo eseguito è stato `archetipo wiki reset architecture/context-map`; il blocco `review` non è stato modificato a mano.
      - [ ] `archetipo wiki status` riporta la pagina come `state: generated` e `archetipo wiki validate` resta `ok: true`.

      ## Blockers
      None.
