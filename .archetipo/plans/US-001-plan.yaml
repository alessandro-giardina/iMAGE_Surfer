    body: |-
      ## Objective
      La pagina `engineering/code-map` non afferma più che il repository contenga un solo file e nessun codice, e rappresenta il banco del cancello n°1 come codice non appartenente a nessun dominio.

      ## Read
      - `docs/wiki/engineering/code-map.md` — le tre affermazioni che decadono: «la tabella è vuota per constatazione», «l'ispezione ha rilevato un solo file nel repository (`docs/PRD.md`)», «nessun codice non mappato»; e la nota di chiusura «va restretta alle directory sorgente reali appena esistono».
      - La struttura effettiva di `Spikes/01-scale-memory/Sources/` e `Tests/` dopo i task precedenti.

      ## Change
      - `docs/wiki/engineering/code-map.md` — sezioni *Da dominio a codice*, *Codice non mappato*, *Copertura*, e il frontmatter `sources`.
      - **Non-obiettivi:** **non creare pagine di dominio.** Il banco è materiale di misura usa-e-getta e non dimostra il comportamento di nessuna capacità di prodotto: promuoverlo a dominio significherebbe trasformare un'affermazione del PRD in un'osservazione di codice, esattamente ciò che la pagina evita per contratto. Non toccare le altre pagine.

      ## Steps
      1. **Primo passo, obbligatorio:** `archetipo wiki --project-root /Users/gia/iMAGE_Surfer reset engineering/code-map` da `/Users/gia/iMAGE_Surfer`.
      2. Nella sezione *Da dominio a codice*, correggi la premessa. La tabella dei domini **resta vuota**, ma non più «per constatazione di assenza totale di codice»: riscrivi la motivazione come «esiste codice, e non appartiene a nessun dominio di prodotto». Sostituisci l'affermazione «l'ispezione ha rilevato un solo file nel repository (`docs/PRD.md`)» con lo stato reale.
      3. Nella sezione *Codice non mappato*, aggiungi la voce che ora esiste: `Spikes/01-scale-memory/` — banco di misura del cancello n°1, pacchetto SwiftPM con la libreria `BenchKit` e gli eseguibili `gen-dataset` e `bench`, con la suite `BenchKitTests`. Dichiara nella stessa voce che è **deliberatamente fuori dalla mappa dei domini** e usa-e-getta, e collega `[Ammissione del lavoro con stime calibrate e banda di ritenzione](/decisions/work-admission-budget.md)` come la conoscenza durevole che ne è derivata: il codice è scartabile, la decisione che ha prodotto no.
      4. Aggiorna il paragrafo sulla struttura di directory prevista dal PRD: continua a non esistere su disco, e va detto che `Spikes/` non la anticipa.
      5. Nella sezione *Copertura*, sostituisci «l'ispezione ha restituito zero confini fisici e zero candidati di capacità» con lo stato reale: esistono ora file sorgente ma nessun confine di capacità di prodotto. Aggiorna la nota finale sull'ancoraggio applicandola: nel frontmatter `sources` sostituisci `path: .` con `Spikes/01-scale-memory` con `role: implementation`, mantenendo `docs` con `role: documentation-inventory`.
      6. Se modifichi `description` nel frontmatter, esegui `archetipo wiki catalog` per rigenerare `index.md`, mai a mano.

      ## Verify
