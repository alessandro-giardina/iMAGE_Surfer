  - id: TASK-12
    title: Wiki - aggiorna overview con la comparsa del primo codice Swift e restringi l'ancoraggio
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      La pagina `overview` non afferma più che il repository sia privo di codice sorgente, e il suo ancoraggio alle evidenze è restretto come la pagina stessa prescriveva.

      ## Read
      - `docs/wiki/overview.md` — in particolare la sezione *Stack* («lo stack è prescritto dal PRD e non ancora presente nel repository. Nessun manifest di build, nessuna configurazione di progetto e nessun file sorgente sono stati rilevati dall'ispezione») e la *Nota sull'ancoraggio delle evidenze* nella sezione *Ambito della mappa ed esclusioni* («appena esistono directory sorgente reali, l'ancoraggio va restretto a quelle directory»).
      - `Spikes/01-scale-memory/Package.swift` e `Spikes/01-scale-memory/RESULT.md` — l'evidenza da citare.

      ## Change
      - `docs/wiki/overview.md` — sezioni *Stack* e *Ambito della mappa ed esclusioni*, e il frontmatter `sources`.
      - **Non-obiettivi:** non toccare le altre pagine, hanno un task ciascuna. Non modificare a mano il blocco `review` — si usa `archetipo wiki reset`. Non riscrivere le sezioni *Scopo del sistema* e *Attori*: l'intento di prodotto non cambia per effetto di questo cancello.

      ## Steps
      1. **Primo passo, obbligatorio:** `archetipo wiki --project-root /Users/gia/iMAGE_Surfer reset overview` da `/Users/gia/iMAGE_Surfer`. Modificare una pagina `reviewed` la deriva a `stale`, e l'unica transizione che riporta a `generated` è il reset. Il comando è idempotente rispetto all'ordine e va eseguito anche se la pagina risulta già `generated`, perché lo stato può essere cambiato dopo la pianificazione.
      2. Nella sezione *Stack*, correggi l'affermazione centrale: esiste ora codice Swift nel repository. La tabella dello stack ha una colonna «Stato nel repository» oggi valorizzata a `assente` su ogni riga: aggiorna **solo** le righe che il cancello dimostra, e distingui esplicitamente il **materiale di misura sotto `Spikes/`** dal **codice di prodotto, che continua a non esistere**. Le righe interessate sono almeno: Linguaggio (Swift 6.3.3 presente, usato dal banco), Anteprime e immagini (QuickLook Thumbnailing e ImageIO usati dal banco, con la cifra di confronto misurata), Visione artificiale (Vision usata come carico di misura). Lascia `assente` tutto ciò che il cancello non ha toccato — SwiftUI, GRDB, XPC, sidecar, osservazione del filesystem — e non dedurre presenza da intento.
      3. Aggiungi una frase che registra il fatto nuovo e ne delimita la portata: il primo codice del repository è il banco di misura del cancello n°1, è dichiaratamente usa-e-getta, e non anticipa la struttura di pacchetti prevista dal PRD.
      4. Aggiorna la *Nota sull'ancoraggio delle evidenze* applicando ciò che prescrive: la condizione «appena esistono directory sorgente reali» si è verificata. Riscrivila per dire che l'ancoraggio è ora restretto, e nel frontmatter `sources` **sostituisci** la voce `path: .` con `role: repository-inventory` con voci più precise: `Spikes/01-scale-memory` con `role: implementation` e `docs/PRD.md` con `role: product-intent`. L'ancoraggio alla radice esisteva per sostenere l'affermazione «non esiste codice»: caduta quell'affermazione, l'ancoraggio va restretto o la pagina diventerebbe `evidence-changed` a ogni file aggiunto in qualunque punto dell'albero.
      5. Aggiorna la sezione *Stato dell'intento* dentro *Ambito della mappa ed esclusioni*: dei quattro cancelli, il n°1 ha ora un esito scritto. Nomina `Spikes/01-scale-memory/RESULT.md` e riporta in una riga se ADR-009 è risultato confermato o emendato, collegando `[Ammissione del lavoro con stime calibrate e banda di ritenzione](/decisions/work-admission-budget.md)`.
      6. Aggiungi la nuova pagina di decisione all'elenco *Concetti collegati*.
      7. Aggiorna il campo `description` del frontmatter solo se l'affermazione centrale della pagina è cambiata abbastanza da renderlo fuorviante; se lo modifichi, esegui `archetipo wiki catalog` per rigenerare `index.md`, mai a mano.

      ## Verify
      - Esegui da `/Users/gia/iMAGE_Surfer`: `archetipo wiki status`
      - Attesa: `overview` riporta `state: generated` e nessun `issues`.
      - Esegui: `archetipo wiki validate`
      - Attesa: `ok: true`, nessun rilievo bloccante.
      - Esegui: `grep -n "Nessun manifest di build" docs/wiki/overview.md`
      - Attesa: nessun risultato — l'affermazione falsa non è più nella pagina.
      - Esegui: `grep -n "path: \." docs/wiki/overview.md`
      - Attesa: nessun risultato — l'ancoraggio alla radice è stato sostituito.
      - Esegui: `grep -q "work-admission-budget" docs/wiki/overview.md && echo collegata`
      - Attesa: stampa `collegata`.
      - Esegui: `git diff --name-only docs/wiki`
      - Attesa: solo `docs/wiki/overview.md` (più `index.md` se hai cambiato `description` ed eseguito `catalog`). Nessun'altra pagina toccata.

      ## Done
      - [ ] Il cambiamento di conoscenza è registrato: la pagina non afferma più che nessun file sorgente esista, e distingue il materiale di misura sotto `Spikes/` dal codice di prodotto che continua a non esistere.
      - [ ] Le righe della tabella dello stack sono aggiornate **solo** dove il cancello porta evidenza; le altre restano `assente`.
      - [ ] L'ancoraggio è restretto: `sources` non contiene più `path: .` e cita `Spikes/01-scale-memory`.
      - [ ] La pagina nomina `Spikes/01-scale-memory/RESULT.md`, riporta l'esito su ADR-009 e collega `decisions/work-admission-budget`.
      - [ ] Il primo passo eseguito è stato `archetipo wiki reset overview`; il blocco `review` non è stato modificato a mano.
      - [ ] `archetipo wiki status` riporta `overview` come `state: generated` e `archetipo wiki validate` resta `ok: true`.

      ## Blockers
      None.
