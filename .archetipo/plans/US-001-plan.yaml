  - id: TASK-07
    title: bench item-cost - costo in memoria per tipo di lavoro, formato e classe di risoluzione, e limite per singolo elemento
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il banco misura il costo in memoria di un singolo elemento per ogni combinazione di tipo di lavoro, formato e classe di risoluzione, e dalla coda osservata deriva il limite per singolo elemento.

      ## Read
      - `Spikes/01-scale-memory/Sources/BenchKit/FootprintSampler.swift` e `Dispersion.swift` — campionatore a 5 ms e statistica.
      - `Spikes/01-scale-memory/Sources/BenchKit/ThumbnailPipeline.swift` — i tipi di lavoro già definiti in TASK-05, da riusare come tassonomia.
      - `docs/PRD.md` riga 532 (ADR-009) e riga 741 (NFR-P10) — «le stime sono conservative, segmentate per tipo di lavoro, formato, classe di risoluzione e hardware, calibrate su misure reali, dotate di margine di sicurezza… e affiancate da un limite per singolo elemento che interrompe l'elemento anomalo anziché il processo».

      ## Change
      - Nuovi file in `Spikes/01-scale-memory/Sources/BenchKit/`: `ItemCostBench.swift`, `WorkKind.swift`.
      - `Spikes/01-scale-memory/Sources/bench/main.swift` — aggiunge il sottocomando `item-cost` e la modalità di esecuzione per cella in sottoprocesso.
      - `Spikes/01-scale-memory/PROCEDURE.md` — riempie i `TODO` relativi.
      - **Non-obiettivi:** nessuna politica di ammissione definitiva; nessuna scelta della stima adottata in questo task — qui si misura, la stima e il margine si dichiarano in TASK-09 e TASK-10.

      ## Steps
      1. `WorkKind.swift`: enumerazione dei tipi di lavoro corrispondenti alle code di ADR-009, ciascuno con l'operazione misurata dichiarata in commento:
         - `io` — apertura del file e lettura delle chiavi di risorsa (`.fileSize`, `.contentModificationDate`, `.fileResourceIdentifierKey`), senza decodifica.
         - `decode` — `CGImageSourceCreateThumbnailAtIndex` a dimensione dichiarata pari al lato dell'elemento per il fattore di scala.
         - `quicklook` — `QLThumbnailGenerator.generateBestRepresentation` con `representationTypes: .thumbnail`.
         - `vision` — `VNGenerateImageFeaturePrintRequest` più `VNDetectFaceLandmarksRequest` sulla stessa immagine.
         - `store` — scrittura dell'anteprima prodotta su un file di cache e rilettura.
      2. `ItemCostBench.swift`: misura una **cella** per invocazione, dove una cella è la terna (tipo di lavoro, formato, classe di risoluzione). Per ogni cella, su `n` elementi distinti del pool `itemCostPool` (default `n = 20`, minimo accettato 20 nel profilo pieno):
         a. Avvia il campionatore a 5 ms; attendi che il footprint sia in quiete e registra `baseline` come mediana di 20 campioni consecutivi entro l'1% l'uno dall'altro, con scadenza.
         b. Esegui l'operazione su un solo elemento dentro un `autoreleasepool` esplicito; al termine drena il pool e attendi che il footprint torni entro `baseline + 1 MB`, con scadenza di 5 secondi.
         c. Registra **due** grandezze distinte per l'elemento: `transientPeakDeltaBytes`, il picco durante l'operazione meno la baseline — è la grandezza che serve all'ammissione, perché l'ammissione precede l'esecuzione; e `retainedDeltaBytes`, il footprint dopo il drenaggio meno la baseline — è la grandezza che rivela crescita di cache o mancato rilascio. ADR-009 ha bisogno di entrambe e pubblicarne una sola falserebbe la tabella di AC-4.
         d. Se il footprint non rientra entro la scadenza, registra `didNotSettle: true` sull'elemento e prosegui: un elemento che non rilascia è un dato, non un errore da nascondere.
         e. Registra anche `wallClockMs` per elemento.
      3. Esecuzione di tutte le celle: `bench item-cost --all` **rilancia se stesso come sottoprocesso una cella per volta** (`bench item-cost --cell <work>:<format>:<class>`) e unisce i JSON parziali. La separazione di processo è deliberata: il footprint è una grandezza dell'intero processo, e misurare celle diverse nello stesso processo contaminerebbe la baseline con la cache accumulata dalle celle precedenti. Salta e registra come vuote le celle senza dati nel pool.
      4. Elementi anomali: esegui una passata dedicata su `anomalous/` (i TIFF 16000×12000 generati in TASK-02) per ogni tipo di lavoro, e registrala come cella `anomalous` separata. Serve a calibrare il limite per elemento su una coda reale: un limite derivato solo dal corpo ben educato della distribuzione non protegge da ciò che deve fermare.
      5. Derivazione del limite per singolo elemento, calcolata dal banco e registrata nel risultato: per ogni cella `perItemLimitBytes = max(p95 × 4, maxObserved × 1,5)`, arrotondato per eccesso al MB. Registra nel risultato la formula come stringa, insieme ai valori che l'hanno prodotta: la tabella di AC-4 deve poter citare la misura che la calibra, e una formula implicita nel codice non è citabile.
      6. Aggiungi a `main.swift` il sottocomando `item-cost` con `--all`, `--cell <work>:<format>:<class>`, `--n <ripetizioni>`, e le opzioni comuni. Prima di misurare invoca `HostFingerprint.assertComplete()`.
      7. Riempi i `TODO` di `PROCEDURE.md` per questo sottocomando, indicando che `--all` lancia una cella per sottoprocesso e il tempo atteso.
      8. Esegui `swift format --in-place --recursive` sui percorsi modificati.

      ## Verify
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench item-cost --cell decode:jpeg:M --n 20 --data /tmp/spike01-smoke --out /tmp/spike01-runs`
      - Attesa: stato 0; il JSON contiene 20 elementi con `transientPeakDeltaBytes` e `retainedDeltaBytes` presenti e finiti, dispersione con `n == 20`, `median`, `p95`, `max`, `stddev`, e `perItemLimitBytes` con la formula registrata come stringa.
      - Attesa aggiuntiva sul merito: `transientPeakDeltaBytes` mediano è maggiore di zero. Un valore pari a zero significa che il campionatore non sta osservando l'operazione, e va trattato come difetto di questo task, non come misura.
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench item-cost --all --profile smoke --data /tmp/spike01-smoke --out /tmp/spike01-runs`
      - Attesa: stato 0; il JSON unito contiene una riga per ogni cella non vuota, ciascuna con il proprio `measurementId` di sottoprocesso, più la cella `anomalous`.
      - Esegui: `swift build --package-path Spikes/01-scale-memory && swift test --package-path Spikes/01-scale-memory`
      - Attesa: build senza errori né avvisi; test di TASK-04 ancora verdi.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources`
      - Attesa: stato 0.

      ## Done
      - [ ] AC-4 — `bench item-cost` produce una riga per ogni cella non vuota di tipo di lavoro × formato × classe di risoluzione, con `n >= 20` nel profilo pieno e dispersione completa.
      - [ ] AC-4 — ogni cella riporta separatamente il picco transitorio e il delta trattenuto, non un solo numero di memoria.
      - [ ] AC-4 — il limite per singolo elemento è derivato con formula dichiarata e registrata nel risultato insieme ai valori che l'hanno prodotta, ed è calibrato anche sulla cella degli elementi anomali.
      - [ ] Ogni cella è misurata in un sottoprocesso dedicato, così che la baseline non sia contaminata dalle celle precedenti.
      - [ ] `swift build` e `swift test` verdi, `swift format lint --strict` a stato 0.

      ## Blockers
      None.
