  - id: TASK-05
    title: Host AppKit del banco con bench first-screen su 3.000 immagini e bench selection-latency sotto carico
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il banco misura il tempo alla prima schermata di anteprime su 3.000 immagini e la latenza dello spostamento della selezione mentre il lavoro in sottofondo è attivo, entrambe con ripetizioni e dispersione.

      ## Read
      - `Spikes/01-scale-memory/Sources/BenchKit/MeasurementResult.swift`, `Dispersion.swift`, `HostFingerprint.swift`, `ResultWriter.swift` — il kernel di TASK-03.
      - `Spikes/01-scale-memory/dataset.json` — `firstScreenFolders`, `viewport` implicito nei parametri di questo task.
      - `docs/PRD.md` righe 732 e 734 — NFR-P1 (prima schermata entro 1 secondo su 3.000 immagini) e NFR-P3 (spostamento della selezione entro 100 ms anche sotto lavoro in sottofondo).

      ## Change
      - Nuovi file in `Spikes/01-scale-memory/Sources/BenchKit/`: `BenchHost.swift`, `ThumbnailPipeline.swift`, `FirstScreenBench.swift`, `SelectionLatencyBench.swift`.
      - `Spikes/01-scale-memory/Sources/bench/main.swift` — dispatch dei sottocomandi, sostituisce il segnaposto.
      - `Spikes/01-scale-memory/PROCEDURE.md` — riempie i `TODO(TASK-05..07)` per questi due sottocomandi.
      - **Non-obiettivi:** questo host è **strumentazione di misura**, non interfaccia di prodotto. Non creare nulla sotto `Packages/` o `App/`, nessun design system, nessuna astrazione riutilizzabile, nessun tema. Il fuori-ambito della spec vieta di costruire code, ammissione, cache e banda nella forma definitiva: qui vivono nella forma minima che serve a misurarle, e restano dentro `Spikes/`.

      ## Steps
      1. `BenchHost.swift`: costruisci l'host AppKit da un eseguibile non impacchettato. `NSApplication.shared`, `setActivationPolicy(.regular)`, `activate()`, un `NSWindow` di dimensione dichiarata dai parametri (default 1512×982, la porta di vista di riferimento), un `NSScrollView` con dentro un `NSCollectionView` a `NSCollectionViewFlowLayout`, dimensione elemento 240×240 e spaziatura 8. Con questi valori la porta di vista iniziale contiene 6 colonne × 5 righe = 30 elementi: calcola il numero effettivo dalla geometria invece di fissarlo a costante, e registralo nei `parameters` del risultato. L'elemento mostra un `NSImageView` con segnaposto grigio finché l'anteprima non arriva.
      2. `ThumbnailPipeline.swift`: la forma minima della politica di ammissione, sufficiente a misurare. Code separate per tipo di lavoro (`io`, `quicklook`, `decode`, `vision`) con larghezza configurabile — default pari a `performanceCores` — e priorità inferiore all'interazione. Due percorsi di produzione dell'anteprima, selezionabili da parametro `--thumbnail-path quicklook|imageio`: `QLThumbnailGenerator.generateBestRepresentation` con `representationTypes: .thumbnail`, e `CGImageSourceCreateThumbnailAtIndex` con `kCGImageSourceThumbnailMaxPixelSize` pari al lato dell'elemento per il fattore di scala dello schermo. Entrambi i percorsi vanno misurati: in fase di pianificazione una sonda ha dato 89,4 ms per QuickLook contro 49,5 ms per ImageIO sulla stessa JPEG da 12 MP, e la differenza è rilevante per NFR-P1.
      3. `FirstScreenBench.swift`: per ogni ripetizione usa **una cartella di prima schermata diversa e mai toccata** (`p1-run-01`, `p1-run-02`, …). È il modo con cui la ripetizione parte a cache fredda senza `sudo purge`, che renderebbe la procedura non eseguibile da un altro sviluppatore. Sequenza della singola ripetizione:
         a. `t0` = istante in cui parte l'enumerazione della cartella (`FileManager.enumerator` con `.skipsHiddenFiles` e prefetch delle chiavi di risorsa necessarie). L'enumerazione non deve bloccare: registra separatamente `firstUrlsReadyMs`, il tempo perché i primi `visibleCount` URL siano disponibili.
         b. Assegna le anteprime man mano che arrivano. Quando viene assegnata l'anteprima **dell'ultimo** elemento che interseca la porta di vista iniziale, registra `thumbnailsReadyMs` e, **nella stessa transazione**, installa `CATransaction.setCompletionBlock` che registra `firstScreenMs`. La definizione di «prima schermata visibile» è il completamento di quella transazione, ed è dichiarata così nel risultato.
         c. Registra entrambe le cifre. Non pubblicare una sola grandezza: la differenza fra `thumbnailsReadyMs` e `firstScreenMs` è il costo di composizione, e tacerla renderebbe la misura di NFR-P1 ottimistica.
         d. Fra ripetizioni ricostruisci l'host da zero e attendi che il footprint torni entro il 10% della baseline, con scadenza di 30 secondi; se non rientra, marca la ripetizione con `footprintDidNotSettle: true` invece di proseguire in silenzio.
      4. `SelectionLatencyBench.swift`: misura sotto carico reale, su `scroll-50k`.
         a. Satura le code: avvia la produzione di anteprime su tutta la cartella da 50.000 file e, in parallelo, un carico di visione artificiale (`VNGenerateImageFeaturePrintRequest` sugli elementi di classe M) così che tutte le code siano occupate. Verifica la saturazione prima di misurare: attendi che ogni coda abbia lavoro in attesa, e registra le profondità di coda nei `parameters`.
         b. Emetti `n = 200` spostamenti di selezione a cadenza fissa (default 150 ms) costruendo un `NSEvent.keyEvent` per la freccia destra e inviandolo con `NSApp.postEvent(_:atStart: false)`. Misurare dall'evento inviato, e non chiamando direttamente l'API di selezione, è deliberato: il vincolo di NFR-P3 riguarda la reattività sotto contesa del ciclo di eventi, che una chiamata diretta scavalcherebbe.
         c. Per ogni spostamento misura l'intervallo fra `postEvent` e il completamento della transazione del fotogramma in cui `collectionView.selectionIndexPaths` riflette il nuovo elemento, con lo stesso oracolo di transazione del punto 3b.
         d. Riporta la dispersione sui 200 spostamenti e, separatamente, il conteggio degli spostamenti oltre 100 ms: una mediana buona con una coda oltre soglia è un'informazione diversa da una mediana buona con coda pulita, e ADR-009 ha bisogno di distinguerle.
      5. `main.swift` di `bench`: parsa `CommandLine.arguments` senza librerie esterne. Sottocomandi `first-screen` e `selection-latency`, opzioni comuni `--data <path>` (default `Spikes/01-scale-memory/.data`), `--profile full|smoke`, `--repetitions <n>` (default 5 per `first-screen`), `--out <path>` (default `Spikes/01-scale-memory/runs`), `--thumbnail-path quicklook|imageio`, `--window <w>x<h>`. Su sottocomando o opzione sconosciuti stampa l'uso ed esci con stato 2. Prima di misurare invoca `HostFingerprint.assertComplete()` e verifica che il manifest del dataset esista, altrimenti termina con stato 1 e un messaggio che rimanda a `gen-dataset`.
      6. Riempi i `TODO(TASK-05..07)` di `PROCEDURE.md` relativi a questi due sottocomandi con i comandi esatti.
      7. Esegui `swift format --in-place --recursive` sui percorsi modificati.

      ## Verify
      - Esegui: `swift run --package-path Spikes/01-scale-memory gen-dataset --profile smoke --out /tmp/spike01-smoke --force`
      - Attesa: stato 0 (già dimostrato in TASK-02; serve come dato di ingresso).
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench first-screen --profile smoke --data /tmp/spike01-smoke --repetitions 2 --out /tmp/spike01-runs`
      - Attesa: stato 0; a terminale compaiono `measurementId` e le cifre grezze; il JSON in `/tmp/spike01-runs` contiene 2 ripetizioni con `firstScreenMs`, `thumbnailsReadyMs` e `firstUrlsReadyMs` tutti finiti e maggiori di zero, e un blocco `dispersion` con `n == 2`.
      - Esegui: `swift run --package-path Spikes/01-scale-memory bench selection-latency --profile smoke --data /tmp/spike01-smoke --out /tmp/spike01-runs`
      - Attesa: stato 0; il JSON contiene le ripetizioni degli spostamenti con dispersione e il conteggio degli spostamenti oltre 100 ms.
      - Esegui: `swift build --package-path Spikes/01-scale-memory && swift test --package-path Spikes/01-scale-memory`
      - Attesa: build senza errori né avvisi, test di TASK-04 ancora verdi.
      - Esegui: `swift format lint --strict --recursive Spikes/01-scale-memory/Sources`
      - Attesa: stato 0.
      - **Non** eseguire il profilo `full` qui: appartiene a TASK-09.

      ## Done
      - [ ] AC-3 — `bench first-screen` produce il tempo alla prima schermata su cartelle da 3.000 immagini nel profilo pieno, con ripetizioni su cartelle disgiunte e dispersione, e pubblica separatamente `thumbnailsReadyMs` e `firstScreenMs`.
      - [ ] AC-3 — `bench selection-latency` produce la latenza dello spostamento della selezione con le code dimostrabilmente sature, su 200 spostamenti, con dispersione e conteggio oltre 100 ms.
      - [ ] L'oracolo del fotogramma è il completamento della transazione Core Animation, dichiarato nei `parameters` del risultato.
      - [ ] Entrambi i percorsi di anteprima, QuickLook e ImageIO, sono selezionabili da parametro e registrati nel risultato.
      - [ ] Nulla è stato creato fuori da `Spikes/01-scale-memory/`.
      - [ ] `swift build` e `swift test` verdi, `swift format lint --strict` a stato 0.

      ## Blockers
      None.
